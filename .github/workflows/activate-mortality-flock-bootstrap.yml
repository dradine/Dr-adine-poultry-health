name: Activate mortality flock bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-mortality-flock-bootstrap.yml'
      - 'mortality-flock-bootstrap-v1.js'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert bootstrap before mortality.js
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mortality.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="mortality.js"></script>'
          bootstrap = '<script src="mortality-flock-bootstrap-v1.js"></script>'
          if bootstrap not in s and marker in s:
              s = s.replace(marker, bootstrap + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit activation
        shell: bash
        run: |
          if git diff --quiet -- mortality.html; then
            echo 'Bootstrap already active.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mortality.html
          git commit -m 'fix: activate mortality flock bootstrap before module init'
          git push
