name: Adaptive Reference Warning V1 Regression
on:
  push:
    branches: [main, 'feature/adaptive-reference-warning-v1', 'feature/adaptive-reference-warning-v2']
    paths:
      - 'broiler-adaptive-reference-warning-v1.js'
      - 'tests/broiler-adaptive-reference-warning-v1.test.js'
      - 'broiler-official-standards-v1.js'
      - 'broiler-performance-intelligence-engine-v2.js'
      - 'broiler-performance-intelligence-report-v1.js'
      - 'reports.html'
  pull_request:
    branches: [main]
    paths:
      - 'broiler-adaptive-reference-warning-v1.js'
      - 'tests/broiler-adaptive-reference-warning-v1.test.js'
      - 'broiler-official-standards-v1.js'
      - 'broiler-performance-intelligence-engine-v2.js'
      - 'broiler-performance-intelligence-report-v1.js'
      - 'reports.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tests/broiler-adaptive-reference-warning-v1.test.js
