name: Adine Supabase Database Backup (v2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Backup Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Workflow parser and secret wiring test
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}" || { echo "::error::Missing SUPABASE_DB_URL"; exit 1; }
          test -n "${BACKUP_ENCRYPTION_KEY}" || { echo "::error::Missing BACKUP_ENCRYPTION_KEY"; exit 1; }
          echo "Backup workflow parsed and secrets are available."
