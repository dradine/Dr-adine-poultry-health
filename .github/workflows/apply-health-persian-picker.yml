name: apply-health-persian-picker
on:
  push:
    paths:
      - 'health-date-picker-v2.js'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace health date picker
        run: |
          cp health-date-picker-v2.js health-date-picker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health-date-picker.js
          git diff --cached --quiet || git commit -m 'fix: apply compact Persian Jalali health date picker'
          git push