name: Broiler Performance Intelligence Scientific V3

on:
  pull_request:
    paths:
      - 'reports.html'
      - 'broiler-performance-intelligence-v3.js'
      - 'broiler-performance-intelligence-adapter-v3.js'
      - 'broiler-performance-intelligence-adapter-v3.css'
      - 'tests/broiler-performance-intelligence-v3.test.js'
      - '.github/workflows/broiler-performance-intelligence-scientific-v3.yml'
  push:
    branches: [feature/broiler-performance-intelligence-v3]
    paths:
      - 'reports.html'
      - 'broiler-performance-intelligence-v3.js'
      - 'broiler-performance-intelligence-adapter-v3.js'
      - 'broiler-performance-intelligence-adapter-v3.css'
      - 'tests/broiler-performance-intelligence-v3.test.js'
      - '.github/workflows/broiler-performance-intelligence-scientific-v3.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check broiler-performance-intelligence-v3.js
          node --check broiler-performance-intelligence-adapter-v3.js
          node --check tests/broiler-performance-intelligence-v3.test.js
      - name: Scientific regression
        run: node tests/broiler-performance-intelligence-v3.test.js
      - name: Scope guard
        shell: bash
        run: |
          git fetch origin main --quiet
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          allowed='^(.github/workflows/broiler-performance-intelligence-scientific-v3.yml|broiler-performance-intelligence-v3.js|broiler-performance-intelligence-adapter-v3.js|broiler-performance-intelligence-adapter-v3.css|tests/broiler-performance-intelligence-v3.test.js|reports.html)$'
          bad=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s\n' "$file" | grep -Eq "$allowed"; then echo "FORBIDDEN CHANGED FILE: $file"; bad=1; fi
          done <<< "$changed"
          test "$bad" -eq 0
          echo 'Scientific V3 scope guard: PASS'
