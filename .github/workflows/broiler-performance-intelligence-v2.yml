name: Broiler Performance Intelligence V2
on:
  push:
    branches:
      - feature/broiler-performance-intelligence-final
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run intelligence regression tests
        run: node tests/broiler-performance-intelligence-v2.test.js
      - name: Verify intelligence engine is isolated from network/database access
        run: |
          ! grep -nE 'supabaseClient|\.rpc\(|fetch\(|XMLHttpRequest|from\(' broiler-performance-intelligence-engine-v2.js