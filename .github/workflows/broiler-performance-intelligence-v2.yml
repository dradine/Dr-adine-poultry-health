name: Broiler Performance Intelligence V2
on:
  push:
    branches:
      - main
      - feature/broiler-performance-intelligence-final
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run canonical broiler standards completeness tests
        run: node tests/broiler-canonical-standards-v2.test.js
      - name: Run legacy standards bridge regression tests
        run: node tests/broiler-official-standards.test.js
      - name: Run canonical broiler FCR regression tests
        run: node tests/broiler-fcr-canonical-v4.test.js
      - name: Run intelligence regression tests
        run: node tests/broiler-performance-intelligence-v2.test.js
      - name: Run canonical weekly target source regression tests
        run: node tests/broiler-performance-intelligence-source-v4.test.js
      - name: Verify intelligence engine is isolated from network/database access
        run: |
          ! grep -nE 'supabaseClient|\.rpc\(|fetch\(|XMLHttpRequest' broiler-performance-intelligence-engine-v2.js
      - name: Verify retired standards table is absent from runtime code
        run: |
          ! grep -nE 'poultry_performance_standards|get_flock_fcr_analysis_v4|refresh_broiler_management_targets_v2026_3' reports.html reports.js reports-router.js broiler-report-engine.js broiler-official-standards-v1.js standards-resolver-core-v1.js broiler-performance-intelligence-source-v1.js broiler-performance-intelligence-source-v9-3.js broiler-performance-intelligence-source-runtime-v1.js broiler-performance-intelligence-runtime-bootstrap-v1.js broiler-performance-intelligence-engine-v2.js broiler-performance-intelligence-report-v1.js broiler-pi-controller-v22.js broiler-comprehensive-report-engine-v2.js broiler-comprehensive-report-ui-v2-2.js
