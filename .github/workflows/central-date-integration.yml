name: Central Date Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden-date-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch date dependencies safely
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          def replace_function(text, name, replacement):
              marker = f'function {name}('
              start = text.find(marker)
              if start < 0:
                  return text, False
              brace = text.find('{', start)
              if brace < 0:
                  raise RuntimeError(f'Cannot find body for {name}')
              depth = 0
              quote = None
              escape = False
              i = brace
              while i < len(text):
                  c = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif c == '\\\\':
                          escape = True
                      elif c == quote:
                          quote = None
                  else:
                      if c in ('"', "'", '`'):
                          quote = c
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              return text[:start] + replacement + text[end:], True
                  i += 1
              raise RuntimeError(f'Unbalanced braces in {name}')

          weekly = root / 'weekly.js'
          text = weekly.read_text(encoding='utf-8')
          replacement = '''function setToday() {\n\n    const input = document.getElementById("evaluationDate");\n    if (!input) return;\n\n    if (!window.AdineDateSystem || typeof window.AdineDateSystem.todayJalali !== "function") {\n        throw new Error("Central Date Engine is required before weekly.js");\n    }\n\n    input.value = window.AdineDateSystem.todayJalali();\n}\n'''
          text, changed = replace_function(text, 'setToday', replacement)
          if not changed:
              raise RuntimeError('weekly.js setToday() was not found')
          weekly.write_text(text, encoding='utf-8')

          flocks = root / 'flocks.js'
          text = flocks.read_text(encoding='utf-8')
          replacement = '''function setupJalaliDate() {\n\n    const input = document.getElementById("placementDate");\n    if (!input) return;\n\n    if (!window.AdineDateSystem) {\n        throw new Error("Central Date Engine is required before flocks.js");\n    }\n\n    if (typeof window.jQuery !== "undefined" &&\n        typeof window.jQuery.fn.persianDatepicker === "function" &&\n        !window.jQuery(input).data("central-date-initialized")) {\n\n        window.jQuery(input).persianDatepicker({\n            format: "YYYY/MM/DD",\n            autoClose: true,\n            initialValue: false,\n            observer: true,\n            calendarType: "persian",\n            calendar: { persian: { locale: "fa", leapYearMode: "algorithmic" } },\n            toolbox: { calendarSwitch: false, todayButton: { enabled: true, text: { fa: "امروز" } } },\n            navigator: { enabled: true, scroll: { enabled: false } },\n            responsive: true,\n            timePicker: { enabled: false }\n        });\n\n        window.jQuery(input).data("central-date-initialized", true);\n    }\n\n    input.setAttribute("inputmode", "numeric");\n    input.setAttribute("autocomplete", "off");\n}\n'''
          text, changed = replace_function(text, 'setupJalaliDate', replacement)
          if not changed:
              raise RuntimeError('flocks.js setupJalaliDate() was not found')

          for name in ('gregorianToJalali', 'jalaliToGregorian', 'jalaliToGregorianISO'):
              if f'function {name}(' in text:
                  text = re.sub(r'(?<![A-Za-z0-9_$])' + re.escape(name) + r'\b', '_flockLegacy_' + name, text)
          flocks.write_text(text, encoding='utf-8')

          for html in root.glob('*.html'):
              s = html.read_text(encoding='utf-8')
              deps = ['flocks.js', 'weekly.js', 'health-date.js']
              used = [d for d in deps if f'src="{d}"' in s or f"src='{d}'" in s]
              if not used:
                  continue
              s = re.sub(r'\s*<script[^>]+src=["\']date-system\.js["\'][^>]*></script>', '', s)
              positions = []
              for d in used:
                  m = re.search(r'<script[^>]+src=["\']' + re.escape(d) + r'["\'][^>]*></script>', s)
                  if m:
                      positions.append(m.start())
              if positions:
                  pos = min(positions)
                  s = s[:pos] + '<script src="date-system.js"></script>\n' + s[pos:]
                  html.write_text(s, encoding='utf-8')

      - name: Verify JavaScript syntax
        run: |
          node --check date-system.js
          node --check weekly.js
          node --check flocks.js
          node --check health-date.js

      - name: Run exhaustive central date tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('date-system.js', 'utf8');
          const ctx = { console, Date, Math, String, Number, Boolean, JSON, Object, Array, RegExp };
          ctx.window = ctx;
          vm.createContext(ctx);
          vm.runInContext(code, ctx, { filename: 'date-system.js' });
          const d = ctx.AdineDateSystem;
          if (!d || !d.runSelfTest) throw new Error('Central Date Engine did not initialize');
          const self = d.runSelfTest();
          if (!self.ok) throw new Error('Self-test failed: ' + JSON.stringify(self.failures));
          let count = 0;
          for (let jy = 1300; jy <= 1500; jy++) {
            for (let jm = 1; jm <= 12; jm++) {
              const max = jm <= 6 ? 31 : (jm <= 11 ? 30 : (d.isJalaliLeapYear(jy) ? 30 : 29));
              for (let jd = 1; jd <= max; jd++) {
                const j = `${jy}/${String(jm).padStart(2,'0')}/${String(jd).padStart(2,'0')}`;
                const iso = d.jalaliToISO(j);
                const back = d.isoToJalali(iso);
                if (!iso || back !== j) throw new Error(`Round-trip failure ${j} -> ${iso} -> ${back}`);
                count++;
              }
            }
          }
          const invalid = ['1405/12/30','1405/07/31','1405/01/32','1405/13/01','1405/00/01','1405/02/00','1405/06/32'];
          for (const j of invalid) if (d.isValidJalali(j)) throw new Error(`Invalid date accepted: ${j}`);
          for (const j of ['1399/12/30','1403/12/30','1408/12/30']) if (!d.isValidJalali(j)) throw new Error(`Leap date rejected: ${j}`);
          if (d.dateOnlyDiffDays('2026-03-21','2026-03-22') !== 1) throw new Error('dateOnlyDiffDays +1 failed');
          if (d.dateOnlyDiffDays('2026-03-22','2026-03-21') !== -1) throw new Error('dateOnlyDiffDays -1 failed');
          if (d.jalaliDiffDays('1405/01/01','1405/01/31') !== 30) throw new Error('jalaliDiffDays failed');
          console.log(`CENTRAL_DATE_TEST_OK exhaustive_roundtrips=${count} selfTests=${self.testCount}`);
          NODE

      - name: Static integration guards
        shell: bash
        run: |
          grep -q 'date-system.js' weekly.html
          grep -q 'date-system.js' flocks.html
          grep -q 'date-system.js' health.html
          grep -q 'AdineDateSystem.todayJalali' weekly.js
          grep -q 'AdineDateSystem' flocks.js
          ! grep -q 'function gregorianToJalali' flocks.js
          ! grep -q 'function jalaliToGregorian' flocks.js
          ! grep -q 'function gregorianToJalali' health-date.js
          ! grep -q 'function jalaliToGregorian' health-date.js

      - name: Commit automatic integration changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weekly.html weekly.js flocks.html flocks.js health.html date-system.js health-date.js
          git commit -m 'fix: complete central Jalali date integration'
          git push
