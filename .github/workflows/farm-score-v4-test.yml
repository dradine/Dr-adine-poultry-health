name: Farm Score V4 Test
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run strict farm score tests
        run: node farm-score-v4.test.js
      - name: Verify reports integration
        run: grep -F '<script src="farm-score-v3.js"></script>' reports.html
