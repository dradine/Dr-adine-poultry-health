name: Finalize reports hierarchy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip reports finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Normalize reports page
        shell: python
        run: |
          from pathlib import Path
          p=Path('reports.html')
          s=p.read_text(encoding='utf-8')

          # Remove duplicate loader tags while preserving the first occurrence.
          tags=['reports-period-analysis-v7.js','reports-ui-v8-single-control.js','reports-flock-loader-v9.js']
          for tag in tags:
              needle=f'<script src="{tag}"></script>'
              first=s.find(needle)
              if first>=0:
                  rest=s[first+len(needle):].replace(needle,'')
                  s=s[:first]+needle+rest

          def extract_section(src, sid):
              start=src.find(f'<section id="{sid}"')
              if start<0:return '',src
              end=src.find('</section>',start)
              if end<0:return '',src
              end+=len('</section>')
              return src[start:end],src[:start]+src[end:]

          executive,s=extract_section(s,'executiveReportCard')
          controls,s=extract_section(s,'adineReportsControlCard')
          standard,s=extract_section(s,'standardFrameworkCard')

          # Insert the required hierarchy immediately after the page header.
          header_end=s.find('</header>')
          assert header_end>=0,'page header missing'
          insert_at=header_end+len('</header>')
          block='\n\n'+executive+'\n\n'+controls+'\n\n'+standard+'\n'
          s=s[:insert_at]+block+s[insert_at:]

          p.write_text(s,encoding='utf-8')

      - name: Strict structural tests
        shell: python
        run: |
          from pathlib import Path
          s=Path('reports.html').read_text(encoding='utf-8')
          assert s.count('id="flockSelect"')==1
          assert s.count('id="reportWeekSelect"')==1
          assert s.count('id="reportCompareBtn"')==1
          assert s.count('id="adineReportsControlCard"')==1
          assert s.count('id="executiveReportCard"')==1
          assert s.count('id="standardFrameworkCard"')==1
          assert 'id="weeklyTableBody"' in s
          assert 'function loadReport' in s or 'async function loadReport' in s
          assert s.index('id="executiveReportCard"') < s.index('id="adineReportsControlCard"') < s.index('id="standardFrameworkCard"')
          print('REPORT HIERARCHY AND SINGLE-CONTROL TESTS PASSED')

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize report hierarchy and single controls [skip reports finalize]'
          git push origin HEAD:main
