name: Finalize reports hierarchy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip reports finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Normalize reports page
        shell: python
        run: |
          from pathlib import Path
          p=Path('reports.html'); s=p.read_text(encoding='utf-8')
          legacy=[
            'farm-score-display-fix.js',
            'reports-ui-v4.js',
            'reports-ui-v5-layout.js',
            'reports-ui-v6-sync.js',
            'reports-period-analysis-v7.js',
            'reports-ui-v8-single-control.js',
            'reports-flock-loader-v9.js'
          ]
          for name in legacy:
              s=s.replace(f'<script src="{name}"></script>','')
          def extract(src,sid):
              a=src.find(f'<section id="{sid}"')
              if a<0:return '',src
              b=src.find('</section>',a); assert b>=0,sid
              b+=len('</section>'); return src[a:b],src[:a]+src[b:]
          executive,s=extract(s,'executiveReportCard')
          controls,s=extract(s,'adineReportsControlCard')
          standard,s=extract(s,'standardFrameworkCard')
          h=s.find('</header>'); assert h>=0,'header missing'
          s=s[:h+len('</header>')]+'\n\n'+executive+'\n\n'+controls+'\n\n'+standard+'\n'+s[h+len('</header>'):]
          p.write_text(s,encoding='utf-8')
      - name: Strict structural tests
        shell: python
        run: |
          from pathlib import Path
          s=Path('reports.html').read_text(encoding='utf-8')
          for name in ['farm-score-display-fix.js','reports-ui-v4.js','reports-ui-v5-layout.js','reports-ui-v6-sync.js','reports-period-analysis-v7.js','reports-ui-v8-single-control.js','reports-flock-loader-v9.js']:
              assert f'<script src="{name}"></script>' not in s, name
          assert s.count('id="flockSelect"')==1
          assert s.count('id="reportWeekSelect"')==1
          assert s.count('id="reportCompareBtn"')==1
          assert s.count('id="adineReportsControlCard"')==1
          assert s.count('id="executiveReportCard"')==1
          assert s.count('id="standardFrameworkCard"')==1
          assert 'id="weeklyTableBody"' in s
          assert 'function loadFlocks' in s or 'async function loadFlocks' in s
          assert 'function loadReport' in s or 'async function loadReport' in s
          assert s.index('id="executiveReportCard"') < s.index('id="adineReportsControlCard"') < s.index('id="standardFrameworkCard"')
          print('REPORT CANONICAL LOADER + WEEK SELECTOR + HIERARCHY TESTS PASSED')
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enforce canonical reports architecture [skip reports finalize]'
          git push origin HEAD:main