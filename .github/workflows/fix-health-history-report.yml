name: Fix health history and report data source

on:
  push:
    paths:
      - '.github/workflows/fix-health-history-report.yml'
  workflow_dispatch:

permissions:
  contents: write

# One-time migration/fix: history and reporting must read the unified health_events source.
# The workflow exits after the applied commit marker is present.
jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'health history/report source [applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch health history and report source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('mortality.js')
          s = p.read_text(encoding='utf-8')
          old = '''    const result=await supabaseClient.from("health_reportable_events").select("*").eq("flock_id",healthFlock.id).order("event_date",{ascending:false}).limit(300);\n    if(result.error){const fallback=await supabaseClient.from("health_events").select(`*, suspected_disease:health_disease_catalog!suspected_disease_id(id,name_fa), confirmed_disease:health_disease_catalog!confirmed_disease_id(id,name_fa)`).eq("flock_id",healthFlock.id).order("event_date",{ascending:false}).limit(300);if(fallback.error)throw fallback.error;healthEvents=fallback.data||[];}else healthEvents=result.data||[];renderHistory();'''
          new = '''    const result=await supabaseClient.from("health_events").select(`*, suspected_disease:health_disease_catalog!suspected_disease_id(id,name_fa), confirmed_disease:health_disease_catalog!confirmed_disease_id(id,name_fa)`).eq("flock_id",healthFlock.id).order("event_date",{ascending:false}).limit(300);\n    if(result.error)throw result.error;\n    healthEvents=result.data||[];\n    renderHistory();'''
          if old not in s:
              raise SystemExit('mortality.js loadEvents block not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')

          p = Path('reports.html')
          s = p.read_text(encoding='utf-8')
          old = '''            // Primary source: the same reportable view used by the mortality/health module.\n            const primary = await supabaseClient\n                .from("health_reportable_events")\n                .select("*")\n                .eq("flock_id", reportFlock.id)\n                .order("event_date", { ascending: false });\n\n            if (!primary.error && Array.isArray(primary.data)) {\n                return primary.data.map(normalize);\n            }\n\n            // Fallback: base health events if the reporting view is unavailable.\n            const fallback = await supabaseClient\n                .from("health_events")\n                .select(`\n                    *,\n                    suspected_disease:health_disease_catalog!suspected_disease_id(id,name_fa),\n                    confirmed_disease:health_disease_catalog!confirmed_disease_id(id,name_fa)\n                `)\n                .eq("flock_id", reportFlock.id)\n                .order("event_date", { ascending: false });\n\n            if (!fallback.error && Array.isArray(fallback.data)) {\n                return fallback.data.map(row => normalize({\n                    ...row,\n                    suspected_disease_name:\n                        row.suspected_disease_name || row.suspected_disease?.name_fa,\n                    confirmed_disease_name:\n                        row.confirmed_disease_name || row.confirmed_disease?.name_fa\n                }));\n            }\n'''
          new = '''            // Primary source: ALL health cases for the selected flock.\n            // Visibility is a reporting attribute, not a history filter.\n            const primary = await supabaseClient\n                .from("health_events")\n                .select(`\n                    *,\n                    suspected_disease:health_disease_catalog!suspected_disease_id(id,name_fa),\n                    confirmed_disease:health_disease_catalog!confirmed_disease_id(id,name_fa)\n                `)\n                .eq("flock_id", reportFlock.id)\n                .order("event_date", { ascending: false });\n\n            if (!primary.error && Array.isArray(primary.data)) {\n                return primary.data.map(row => normalize({\n                    ...row,\n                    suspected_disease_name:\n                        row.suspected_disease_name || row.suspected_disease?.name_fa,\n                    confirmed_disease_name:\n                        row.confirmed_disease_name || row.confirmed_disease?.name_fa\n                }));\n            }\n'''
          if old not in s:
              raise SystemExit('reports.html health source block not found')
          s = s.replace(old,new,1)

          old = '''            count:\n                Number(record.mortality_count || 0) ||\n                Number(record.affected_count || 0) ||\n                Number(record.count || 0),'''
          new = '''            count: (() => {\n                const type = record.event_type ?? record.type ?? "other";\n                if (type === "disease" || type === "suspected_disease" || type === "clinical_case") {\n                    return Number(record.affected_count ?? record.affected_birds ?? record.count ?? 0) || 0;\n                }\n                if (type === "cull") return Number(record.cull_count ?? record.count ?? 0) || 0;\n                if (type === "mortality") return Number(record.mortality_count ?? record.dead_birds ?? record.count ?? 0) || 0;\n                return Number(record.affected_count ?? record.mortality_count ?? record.count ?? 0) || 0;\n            })(),'''
          if old not in s:
              raise SystemExit('reports.html health count block not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mortality.js reports.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: health history/report source [applied]"
          git push
