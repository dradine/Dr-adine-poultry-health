name: Fix health report fallback reference

on:
  push:
    paths:
      - '.github/workflows/fix-health-report-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'health report fallback [applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale fallback reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reports.html')
          s=p.read_text(encoding='utf-8')
          old='console.warn("No health report source available.", primary.error, fallback.error, legacy.error);'
          new='console.warn("No health report source available.", primary.error, legacy.error);'
          if old not in s:
              raise SystemExit('stale fallback reference not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: health report fallback [applied]"
          git push
