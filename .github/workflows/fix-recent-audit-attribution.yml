name: Fix recent audit attribution

on:
  push:
    paths:
      - '.github/workflows/fix-recent-audit-attribution.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'recent audit attribution [applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch health recent records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('health.js')
          s=p.read_text(encoding='utf-8')

          old="""  function renderRecent(){
    const rows=[...S.vaccinations.map(x=>({d:x.vaccine_date,t:'واکسیناسیون',s:x.vaccine_name})),...S.treatments.map(x=>({d:x.treatment_date,t:'درمان',s:x.medication_name})),...S.events.map(x=>({d:x.event_date,t:'رویداد سلامت',s:x.event_type}))].sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,8);
    $('recentTimeline').innerHTML=rows.length?rows.map(r=>`<div class=\"timeline-item\"><div class=\"timeline-age\">${fmtDate(r.d)}</div><div class=\"timeline-main\"><b>${esc(r.t)}</b><small>${esc(r.s||'—')}</small></div><span class=\"tag\">ثبت‌شده</span></div>`).join(''):`<div class=\"empty\">پرونده سلامت هنوز سابقه‌ای ندارد.</div>`;
  }"""

          new="""  function renderRecent(){
    const rows=[
      ...S.vaccinations.map(x=>({d:x.vaccine_date,t:'واکسیناسیون',s:x.vaccine_name,id:x.id,kind:'vaccination'})),
      ...S.treatments.map(x=>({d:x.treatment_date,t:'درمان',s:x.medication_name,id:x.id,kind:'treatment'})),
      ...S.events.map(x=>({d:x.event_date,t:'رویداد سلامت',s:x.event_type,id:x.id,kind:'event'}))
    ].sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,8);
    $('recentTimeline').innerHTML=rows.length?rows.map(r=>`<div class=\"timeline-item\" data-recent-kind=\"${r.kind}\" data-recent-id=\"${r.id}\"><div class=\"timeline-age\">${fmtDate(r.d)}</div><div class=\"timeline-main\"><b>${esc(r.t)}</b><small>${esc(r.s||'—')}</small><small class=\"audit-attribution loading\">در حال بررسی ثبت‌کننده...</small></div><button type=\"button\" class=\"tag audit-history-btn\" data-audit-kind=\"${r.kind}\" data-audit-id=\"${r.id}\">تاریخچه</button></div>`).join(''):`<div class=\"empty\">پرونده سلامت هنوز سابقه‌ای ندارد.</div>`;
    if(window.ADInehAuditHistory?.decorateRecent) window.ADInehAuditHistory.decorateRecent(rows);
  }"""
          if old not in s:
              raise SystemExit('renderRecent exact block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Patch audit UI attribution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit-history-ui.js')
          s=p.read_text(encoding='utf-8')
          marker="  window.ADInehAuditHistory={showHistory,showFlockHistory};"
          if marker not in s:
              raise SystemExit('audit API marker not found')
          addition="""
  async function decorateRecent(rows){
    for(const r of rows||[]){
      const item=document.querySelector(`[data-recent-kind=\"${r.kind}\"][data-recent-id=\"${r.id}\"]`);
      if(!item) continue;
      try{
        const logs=await fetchAudit({recordId:r.id,flockId:flockId(),table:TABLE_MAP[r.kind]});
        const latest=logs.find(x=>String(x.operation).toUpperCase()!=='DELETE')||logs[0];
        const el=item.querySelector('.audit-attribution');
        if(!el) continue;
        if(!latest){el.textContent='اطلاعات ثبت‌کننده در تاریخچه موجود نیست';el.classList.remove('loading');continue;}
        const op=String(latest.operation||'').toUpperCase();
        const who=latest.actor_name||'کاربر ثبت‌نشده';
        const role=TYPE_FA[latest.actor_user_type]||latest.actor_user_type||latest.actor_role||'';
        const verb=op==='UPDATE'?'ویرایش‌شده توسط':'ثبت‌شده توسط';
        el.innerHTML=`${verb} <b>${esc(who)}</b>${role?` — ${esc(role)}`:''} در ${esc(dateFa(latest.occurred_at))}`;
        el.classList.remove('loading');
      }catch(e){
        const el=item.querySelector('.audit-attribution');
        if(el){el.textContent='اطلاعات ثبت‌کننده در دسترس نیست';el.classList.remove('loading');}
      }
    }
  }
"""
          s=s.replace(marker,addition+"\n"+marker.replace('showFlockHistory','showFlockHistory,decorateRecent'),1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check health.js
          node --check audit-history-ui.js
          python3 - <<'PY'
          from pathlib import Path
          h=Path('health.js').read_text(encoding='utf-8')
          a=Path('audit-history-ui.js').read_text(encoding='utf-8')
          assert 'در حال بررسی ثبت‌کننده' in h
          assert 'decorateRecent' in a
          assert 'ثبت‌شده توسط' in a
          assert 'ویرایش‌شده توسط' in a
          assert 'dateFa' in a
          print('Audit attribution integration validated')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health.js audit-history-ui.js
          git diff --cached --quiet || git commit -m 'fix: show recent audit attribution [applied]'
          git push
