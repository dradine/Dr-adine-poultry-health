name: health-program-sync-inject
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[health-program-sync-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject program synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('health.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="health-program-sync.js"></script>'
          marker='<script src="health-program-iran.js"></script>'
          if tag not in s:
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag)
              elif '</body>' in s:
                  s=s.replace('</body>', tag+'\n</body>')
              else:
                  s += '\n'+tag+'\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health.html
          git diff --cached --quiet || git commit -m 'fix: sync vaccination program with flock type [health-program-sync-applied]'
          git push
