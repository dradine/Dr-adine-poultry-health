name: Install flock comparison assets
on:
  push:
    paths:
      - 'flock-comparison-engine-v1.js'
      - 'broiler-flock-comparison-v1.js'
      - '.github/workflows/install-flock-comparison.yml'
permissions:
  contents: write
jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, 'flock comparison assets [applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scripts in reports page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reports.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('data-tab="compare"','data-tab="compare-empty"')
          marker='<script src="flock-comparison-engine-v1.js?v=20260911.1"></script>\n<script src="broiler-flock-comparison-v1.js?v=20260911.1"></script>'
          if 'broiler-flock-comparison-v1.js' not in s:
              s=s.replace('</body>',marker+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'data-tab="compare-empty"' reports.html
          grep -q 'flock-comparison-engine-v1.js' reports.html
          grep -q 'broiler-flock-comparison-v1.js' reports.html
      - name: Smoke tests
        run: |
          test -s flock-comparison-engine-v1.js
          test -s broiler-flock-comparison-v1.js
          node --check flock-comparison-engine-v1.js
          node --check broiler-flock-comparison-v1.js
          test "$(grep -o 'broiler-flock-comparison-v1.js' reports.html | wc -l)" -eq 1
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          git diff --cached --quiet || git commit -m 'feat: install flock comparison assets [applied]'
          git push
