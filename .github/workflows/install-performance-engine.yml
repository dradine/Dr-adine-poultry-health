name: Install Adine performance engine
on:
  push:
    branches: [main]
    paths:
      - 'performance-engine-v2.js'
      - '.github/workflows/install-performance-engine.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire performance engine into weekly and reports pages
        shell: python
        run: |
          from pathlib import Path
          for name, anchor in [
              ('weekly.html','    <script src="weekly-specialized.js"></script>'),
              ('reports.html','<script src="weekly-engine.js"></script>')
          ]:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              tag='<script src="performance-engine-v2.js"></script>'
              if tag not in s:
                  if anchor not in s:
                      raise SystemExit(f'anchor not found in {name}')
                  s=s.replace(anchor, anchor+'\n'+tag, 1)
                  p.write_text(s,encoding='utf-8')
      - name: Commit wiring changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weekly.html reports.html
          git diff --cached --quiet || git commit -m 'Wire scientific performance engine into weekly reports'
          git push
