name: Mortality Disease v2 - isolated inject

on:
  push:
    paths:
      - 'mortality-disease-intelligence-v2.js'
      - 'mortality.html'
      - '.github/workflows/mortality-disease-v2-inject.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inject isolated module script into mortality page
        shell: python
        run: |
          from pathlib import Path
          p = Path('mortality.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="mortality-disease-intelligence-v2.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('mortality.html does not contain </body>; refusing to modify file')
              text = text.replace(marker, f'    {tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('Already injected')
      - name: Commit only mortality page injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mortality.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix: activate isolated mortality disease intelligence'
            git push
          fi
