name: Deploy public SEO site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Protect registration page
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi

          protected_changed=0
          while IFS= read -r file; do
            case "$file" in
              register.html|register.js|auth-compact.css)
                protected_changed=1
                echo "::error file=$file::Registration page is locked. Changes require explicit user authorization."
                ;;
            esac
          done <<< "$changed"

          if [ "$protected_changed" -eq 1 ]; then
            if ! git log -1 --pretty=%B | grep -Fq "ALLOW-REGISTRATION-CHANGE"; then
              echo "::error::Registration files are locked. Do not deploy changes to register.html, register.js, or auth-compact.css unless the user explicitly requested a registration-page change and the commit is marked ALLOW-REGISTRATION-CHANGE."
              exit 1
            fi
            echo "Explicit registration-change authorization marker detected."
          else
            echo "Registration page unchanged."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify production entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f login.html
          test -f CNAME
          test "$(tr -d '\r\n' < CNAME)" = "app.adinepoultryhealth.ir"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          jekyll: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
