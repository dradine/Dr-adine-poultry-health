name: Remove weekly report chart layer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Restore known-good report and disable visualization only
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          p=Path('reports.html')
          subprocess.run(['git','checkout','e0e004312ebf83c75932e57685b06b93dc4b36ce','--','reports.html'],check=True)
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>','')
          s=s.replace('<script src="weekly-analysis-v7.js"></script>','')
          s=s.replace('.chart{height:300px}','.chart{display:none!important;height:0!important}')
          s=s.replace('.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}','.grid{display:none!important}')
          p.write_text(s,encoding='utf-8')
          if 'chart.js' in s or 'weekly-analysis-v7.js' in s or '.chart{height:300px}' in s:
              raise SystemExit('chart dependency/renderer still present')
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          git commit -m 'Remove weekly report chart rendering safely'
          git rm .github/workflows/remove-weekly-charts-final.yml
          git commit -m 'Remove temporary chart cleanup workflow'
          git push