name: Repair report data access
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip report data repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch report flock access
        shell: python
        run: |
          from pathlib import Path
          p=Path('reports-data.js'); s=p.read_text(encoding='utf-8')
          old='''            .eq(\n                "owner_id",\n                reportsCurrentUser.id\n            )\n            .maybeSingle();'''
          new='''            .maybeSingle();'''
          assert old in s, 'Expected report flock owner filter was not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Strict report data tests
        shell: python
        run: |
          from pathlib import Path
          s=Path('reports-data.js').read_text(encoding='utf-8')
          assert 'async function getReportFlock' in s
          assert 'async function getReportWeeklyRecords' in s
          start=s.index('async function getReportFlock')
          end=s.index('async function getReportWeeklyRecords')
          block=s[start:end]
          assert '"owner_id"' not in block
          assert '.from("flocks")' in block
          weekly=s[end:s.index('function reportNumber',end)]
          assert '.from("weekly_records")' in weekly
          assert '.eq(\n                "flock_id"' in weekly
          print('REPORT DATA ACCESS TESTS PASSED')
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix report flock access for authorized users [skip report data repair]'
          git push origin HEAD:main
