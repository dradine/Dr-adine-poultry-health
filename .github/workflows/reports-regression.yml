name: Reports regression
on:
  push:
    branches: [main]
    paths:
      - 'reports.js'
      - 'reports-router.js'
      - 'broiler-report-engine.js'
      - 'broiler-official-standards-v1.js'
      - 'broiler-canonical-metric-standards-v1.js'
      - 'broiler-performance-intelligence-source-v1.js'
      - 'broiler-performance-intelligence-engine-v2.js'
      - 'standard-data.js'
      - 'standards-resolver-core-v1.js'
      - 'reports.html'
      - 'reports.css'
      - 'broiler-comprehensive-report-engine-v2.js'
      - 'broiler-comprehensive-report-ui-v2-2.js'
      - 'broiler-comprehensive-report-fixes-v1.js'
      - 'broiler-comprehensive-report-v2.css'
      - 'tests/**'
  pull_request:
    paths:
      - 'reports.js'
      - 'reports-router.js'
      - 'broiler-report-engine.js'
      - 'broiler-official-standards-v1.js'
      - 'broiler-canonical-metric-standards-v1.js'
      - 'broiler-performance-intelligence-source-v1.js'
      - 'broiler-performance-intelligence-engine-v2.js'
      - 'standard-data.js'
      - 'standards-resolver-core-v1.js'
      - 'reports.html'
      - 'reports.css'
      - 'broiler-comprehensive-report-engine-v2.js'
      - 'broiler-comprehensive-report-ui-v2-2.js'
      - 'broiler-comprehensive-report-fixes-v1.js'
      - 'broiler-comprehensive-report-v2.css'
      - 'tests/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check reports.js
          node --check reports-router.js
          node --check broiler-report-engine.js
          node --check broiler-official-standards-v1.js
          node --check broiler-canonical-metric-standards-v1.js
          node --check broiler-performance-intelligence-source-v1.js
          node --check broiler-performance-intelligence-engine-v2.js
          node --check standards-resolver-core-v1.js
          node --check standard-data.js
          node --check broiler-comprehensive-report-engine-v2.js
          node --check broiler-comprehensive-report-ui-v2-2.js
          node --check broiler-comprehensive-report-fixes-v1.js
          node --check adine-weight-band-engine-v1.js
          node --check weight-band-runtime-v1.js
      - name: Weight Band V2 regression test
        run: node tests/weight-band-v2.test.js
      - name: Official registry test
        run: node tests/broiler-official-standards.test.js
      - name: Canonical metric standards coverage test
        run: node tests/broiler-canonical-metric-standards-v1.test.js
      - name: Broiler PI source test
        run: node tests/broiler-performance-intelligence-source-v4.test.js
      - name: Broiler PI engine test
        run: node tests/broiler-performance-intelligence-v2.test.js
      - name: Domain regression test
        run: node tests/reports-architecture.test.js
      - name: Comprehensive broiler V2 regression test
        run: node tests/broiler-comprehensive-report-v2.test.js
      - name: Shell isolation test
        run: node tests/reports-shell.test.js
