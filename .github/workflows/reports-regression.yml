name: Reports regression
on:
  push:
    branches: [main]
    paths:
      - 'reports.js'
      - 'reports-router.js'
      - 'broiler-report-engine.js'
      - 'broiler-official-standards-v1.js'
      - 'standard-data.js'
      - 'standards-resolver-core-v1.js'
      - 'reports.html'
      - 'reports.css'
      - 'tests/**'
  pull_request:
    paths:
      - 'reports.js'
      - 'reports-router.js'
      - 'broiler-report-engine.js'
      - 'broiler-official-standards-v1.js'
      - 'standard-data.js'
      - 'standards-resolver-core-v1.js'
      - 'reports.html'
      - 'reports.css'
      - 'tests/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check reports.js
          node --check reports-router.js
          node --check broiler-report-engine.js
          node --check broiler-official-standards-v1.js
          node --check standards-resolver-core-v1.js
          node --check standard-data.js
      - name: Official registry test
        run: node tests/broiler-official-standards.test.js
      - name: Domain regression test
        run: node tests/reports-architecture.test.js
      - name: Shell isolation test
        run: node tests/reports-shell.test.js
