name: Restore reports.html integrity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore reports.html from known-good baseline and install report UI layers
        shell: bash
        run: |
          set -euo pipefail
          git checkout 13c497e944bce57a2b387a432bafda6d26c1dd55 -- reports.html
          python - <<'PY'
          from pathlib import Path
          p = Path('reports.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="farm-score-v3.js"></script>'
          loaders = '<script src="mortality-benchmark-v2.js"></script>\n<script src="reports-ui-v4.js"></script>\n<script src="reports-ui-v5-layout.js"></script>\n'
          if 'reports-ui-v5-layout.js' not in s and marker in s:
              s = s.replace(marker, loaders + marker, 1)
          elif 'reports-ui-v4.js' not in s and marker in s:
              s = s.replace(marker, '<script src="reports-ui-v4.js"></script>\n' + marker, 1)
          elif 'mortality-benchmark-v2.js' not in s and marker in s:
              s = s.replace(marker, '<script src="mortality-benchmark-v2.js"></script>\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit restored reports page only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Install reports layout guard'
          git push
