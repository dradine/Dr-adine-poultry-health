name: Restore reports.html integrity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure report UI loaders exist without replacing reports.html
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('reports.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="farm-score-v3.js"></script>'
          changed = False
          loaders = [
              ('mortality-benchmark-v2.js', '<script src="mortality-benchmark-v2.js"></script>\n'),
              ('reports-ui-v4.js', '<script src="reports-ui-v4.js"></script>\n'),
              ('reports-ui-v5-layout.js', '<script src="reports-ui-v5-layout.js"></script>\n'),
              ('reports-ui-v6-sync.js', '<script src="reports-ui-v6-sync.js"></script>\n'),
              ('reports-period-analysis-v7.js', '<script src="reports-period-analysis-v7.js"></script>\n'),
          ]
          if marker in s:
              for name, loader in loaders:
                  if name not in s:
                      s = s.replace(marker, loader + marker, 1)
                      changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit only missing loader changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Install selected-week and cumulative report analysis'
          git push
