name: Restore weekly completion UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure restore script is loaded by weekly page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('weekly.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="weekly-completion-restore-v1.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('weekly.html has no </head> marker')
              s = s.replace(marker, '    ' + tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected script tag
        shell: bash
        run: |
          if git diff --quiet -- weekly.html; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weekly.html
          git commit -m 'Restore weekly completion section'
          git push
