name: Restore working weekly reports
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'Restore reports runtime without charts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good reports runtime
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          p=Path('reports.html')
          subprocess.run(['git','checkout','e0e004312ebf83c75932e57685b06b93dc4b36ce','--','reports.html'],check=True)
          s=p.read_text(encoding='utf-8')
          marker='<style>'
          if marker not in s: raise SystemExit('style block not found')
          # Hide only the chart presentation. All report JS, Supabase queries,
          # calculations and standard resolution remain exactly at the baseline.
          s=s.replace(marker, marker+'.chart{display:none!important;height:0!important;overflow:hidden!important}.chart canvas{display:none!important}',1)
          p.write_text(s,encoding='utf-8')
          required=['supabase-config.js','standard-data.js','standards.js','weekly_monitoring','function weekly()']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('critical report runtime missing: '+repr(missing))
      - name: Commit restored report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          git commit -m 'Restore reports runtime without charts'
          git push