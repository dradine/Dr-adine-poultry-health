name: Restore working weekly reports

# Disabled automatic restore: this workflow previously overwrote reports.html
# after every push and silently reverted report changes.
# It remains manually dispatchable for emergency recovery only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Emergency recovery notice
        run: |
          echo "Automatic report restoration is disabled."
          echo "reports.html will no longer be overwritten by this workflow."
