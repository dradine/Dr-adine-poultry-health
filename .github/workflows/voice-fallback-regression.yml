name: Voice Fallback Regression

on:
  push:
    branches: [main]
    paths:
      - 'voice-input.js'
      - 'voice-fallback.js'
      - 'config.js'
      - 'supabase-config.js'
      - 'supabase/functions/persian-voice-transcribe/**'
      - '.github/workflows/voice-fallback-regression.yml'
  pull_request:
    paths:
      - 'voice-input.js'
      - 'voice-fallback.js'
      - 'config.js'
      - 'supabase-config.js'
      - 'supabase/functions/persian-voice-transcribe/**'
      - '.github/workflows/voice-fallback-regression.yml'

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check voice-input.js
          node --check voice-fallback.js
          node --check config.js
          node --check supabase-config.js
      - name: Fallback safety assertions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fallback = fs.readFileSync('voice-fallback.js', 'utf8');
          const fn = fs.readFileSync('supabase/functions/persian-voice-transcribe/index.ts', 'utf8');
          const config = fs.readFileSync('config.js', 'utf8');
          const supabaseConfig = fs.readFileSync('supabase-config.js', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(/MediaRecorder/.test(fallback), 'MediaRecorder fallback missing');
          assert(/getUserMedia/.test(fallback), 'microphone capture missing');
          assert(/persian-voice-transcribe/.test(fallback), 'edge function invocation missing');
          assert(/audio\/mp4/.test(fallback), 'iOS audio/mp4 support missing');
          assert(/data-adine-voice-fallback/.test(fallback), 'fallback marker missing');
          assert(/OPENAI_API_KEY/.test(fn), 'provider key must remain server-side');
          assert(/gpt-4o-mini-transcribe/.test(fn), 'STT model missing');
          assert(/language/.test(fn) && /fa/.test(fn), 'Persian language configuration missing');
          assert(!/OPENAI_API_KEY/.test(fallback), 'provider secret must never be shipped to browser');
          assert(!/OPENAI_API_KEY/.test(config), 'provider secret must never be shipped to browser');
          assert(!/OPENAI_API_KEY/.test(supabaseConfig), 'provider secret must never be shipped to browser');
          console.log('Voice fallback safety assertions: PASS');
          NODE
