name: Voice Fallback Regression

on:
  push:
    branches: [main]
    paths:
      - 'voice-input.js'
      - 'voice-fallback.js'
      - 'voice-shenava.js'
      - 'tests/voice-shenava.test.js'
      - 'config.js'
      - 'supabase-config.js'
      - '.github/workflows/voice-fallback-regression.yml'
  pull_request:
    paths:
      - 'voice-input.js'
      - 'voice-fallback.js'
      - 'voice-shenava.js'
      - 'tests/voice-shenava.test.js'
      - 'config.js'
      - 'supabase-config.js'
      - '.github/workflows/voice-fallback-regression.yml'

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check voice-input.js
          node --check voice-fallback.js
          node --check voice-shenava.js
          node --check tests/voice-shenava.test.js
          node --check config.js
          node --check supabase-config.js
      - name: Shenava normalization regression
        run: node tests/voice-shenava.test.js
      - name: Local voice architecture assertions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const shenava = fs.readFileSync('voice-shenava.js', 'utf8');
          const config = fs.readFileSync('config.js', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(/Shenava-Rizeh-v1\.0-ONNX-fp16/.test(shenava), 'Shenava Rizeh engine missing');
          assert(/processed_signal/.test(shenava) && /processed_signal_length/.test(shenava), 'ONNX input contract missing');
          assert(/2005/.test(shenava) && /80/.test(shenava) && /16000/.test(shenava), 'Shenava preprocessing contract missing');
          assert(/MediaRecorder/.test(shenava) && /getUserMedia/.test(shenava), 'local microphone capture missing');
          assert(/audio\/mp4/.test(shenava), 'iOS audio/mp4 support missing');
          assert(/webgpu/.test(shenava) && /wasm/.test(shenava), 'runtime fallback providers missing');
          assert(/Reza2kn\/Shenava-Rizeh-v1\.0-ONNX-fp16/.test(shenava), 'pinned model repository missing');
          assert(!/OPENAI_API_KEY/.test(shenava), 'paid provider secret must never ship to browser');
          assert(!/supabaseClient|weekly_records|cumulative_fcr/.test(shenava), 'voice engine must not couple to application data');
          assert(/voice-shenava\.js\?v=2\.1\.0/.test(config), 'global Shenava loader missing');
          assert(!/OPENAI_API_KEY/.test(config), 'provider secret must never ship to browser');
          console.log('Local Shenava voice architecture assertions: PASS');
          NODE
