name: Voice Input Regression

on:
  push:
    branches:
      - feature/global-persian-voice-input-v1
  pull_request:
    branches:
      - main

jobs:
  voice-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Voice regression tests
        run: node tests/voice-input.test.js
