name: Wire weekly analysis engine safely

on:
  push:
    branches:
      - feature/weekly-analysis-safe-wire-2026-08-31
    paths:
      - .github/workflows/wire-weekly-analysis-safe.yml
      - weekly-analysis-engine.js
      - reports.html

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch tip
        uses: actions/checkout@v4

      - name: Inject only the external analysis script tag
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('reports.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="weekly-analysis-engine.js"></script>'
          if tag in text:
              print('Analysis engine tag already present; no change needed.')
              raise SystemExit(0)
          marker = '<script src="health-records-runtime-v2.js"></script>'
          if marker not in text:
              raise SystemExit('Safety check failed: expected reports runtime marker was not found.')
          if text.count(marker) != 1:
              raise SystemExit('Safety check failed: reports runtime marker is not unique.')
          updated = text.replace(marker, tag + marker, 1)
          if updated.count(tag) != 1:
              raise SystemExit('Safety check failed: analysis tag count is not exactly one.')
          p.write_text(updated, encoding='utf-8')
          PY

      - name: Commit only reports.html
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = "reports.html"
          git commit -m 'feat: wire weekly analysis engine into reports'
          git push
