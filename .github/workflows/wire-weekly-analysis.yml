name: Wire weekly analysis engine
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'Wire weekly analysis engine into weekly reports') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add analysis engine loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reports.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="weekly-analysis-engine.js"></script>'
          if tag not in s:
              marker='<script src="health-records-runtime-v2.js"></script>'
              if marker not in s:
                  raise SystemExit('reports.html marker not found')
              s=s.replace(marker, tag+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          git diff --cached --quiet && exit 0
          git commit -m 'Wire weekly analysis engine into weekly reports'
          git push