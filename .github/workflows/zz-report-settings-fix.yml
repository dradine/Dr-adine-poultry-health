name: Normalize report settings
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize report settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mortality-auto-flock-v4.js')
          s=p.read_text(encoding='utf-8')
          a=s.index('function tidyReportSettings(){')
          b=s.index('async function authoritativeLoader', a)
          new=r'''function tidyReportSettings(){
            const box=document.querySelector('.report-box');
            if(!box)return;
            const title=box.querySelector(':scope > strong');
            const show=document.getElementById('showInReports')?.closest('.report-row');
            const level=document.getElementById('reportLevel')?.closest('.form-group');
            const weekly=document.getElementById('includeWeekly')?.closest('.report-row');
            const analysis=document.getElementById('includeAnalysis')?.closest('.report-row');
            if(!show||!level||!weekly||!analysis)return;
            [show,level,weekly,analysis].forEach(x=>{x.classList.remove('report-row','form-group','report-settings-row','report-settings-level');x.removeAttribute('style');});
            if(title)box.appendChild(title);
            box.appendChild(show);box.appendChild(level);box.appendChild(weekly);box.appendChild(analysis);
            show.className='report-settings-option';weekly.className='report-settings-option';analysis.className='report-settings-option';level.className='report-settings-level';
            [show,weekly,analysis].forEach(row=>{const input=row.querySelector('input[type=checkbox]'),label=row.querySelector('label');if(input&&label){row.innerHTML='';row.append(input,label);}});
            let style=document.getElementById('adineReportSettingsStableStyle');
            if(!style){style=document.createElement('style');style.id='adineReportSettingsStableStyle';document.head.appendChild(style)}
            style.textContent=`
              .report-box{display:block!important;width:100%!important;direction:rtl!important;box-sizing:border-box!important}
              .report-box>strong{display:block!important;margin:0 0 12px!important;padding:0!important;text-align:right!important;font-size:15px!important;line-height:1.8!important}
              .report-box>.report-settings-option{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;direction:rtl!important;gap:10px!important;width:100%!important;min-height:46px!important;margin:0 0 8px!important;padding:10px 12px!important;box-sizing:border-box!important;border:1px solid #dfe8e3!important;border-radius:10px!important;background:#fff!important}
              .report-box>.report-settings-option::before,.report-box>.report-settings-option::after,.report-box>.report-settings-option label::before,.report-box>.report-settings-option label::after{content:none!important;display:none!important}
              .report-box>.report-settings-option input[type=checkbox]{appearance:auto!important;-webkit-appearance:checkbox!important;display:block!important;position:static!important;order:0!important;flex:0 0 18px!important;width:18px!important;height:18px!important;min-width:18px!important;min-height:18px!important;margin:0!important;padding:0!important;transform:none!important}
              .report-box>.report-settings-option label{display:block!important;order:1!important;flex:1 1 auto!important;width:auto!important;min-width:0!important;margin:0!important;padding:0!important;text-align:right!important;font-size:13px!important;font-weight:500!important;line-height:1.8!important;white-space:normal!important;cursor:pointer!important}
              .report-box>.report-settings-level{display:flex!important;flex-direction:column!important;align-items:stretch!important;width:100%!important;box-sizing:border-box!important;margin:0 0 8px!important;padding:10px 12px!important;border:1px solid #dfe8e3!important;border-radius:10px!important;background:#fff!important}
              .report-box>.report-settings-level label{display:block!important;width:100%!important;margin:0 0 6px!important;padding:0!important;text-align:right!important;font-size:13px!important;font-weight:700!important;line-height:1.8!important}
              .report-box>.report-settings-level select{display:block!important;width:100%!important;max-width:100%!important;min-height:40px!important;box-sizing:border-box!important;margin:0!important}
            `;
          }
          '''
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mortality-auto-flock-v4.js
          git rm .github/workflows/zz-report-settings-fix.yml
          git commit -m 'fix: clean report settings checkbox layout' || exit 0
          git push