<body><div class="app-shell"><header class="topbar"><div class="brand"><img src="IMG_4309.png" alt="مرکز تخصصی سلامت طیور آدینه"><span>ثبت فارم</span></div><button type="button" class="btn btn-secondary" onclick="location.href='Dashboard.html'">داشبورد</button></header><main class="page"><div class="container"><h1 class="page-title">ثبت و مدیریت فارم</h1><p class="page-description">اطلاعات پایه فارم را وارد کنید. با وارد کردن نام شهر، استان، منطقه جغرافیایی و اقلیم به‌صورت خودکار تعیین می‌شوند.</p><form id="farmForm" class="card"><div class="form-grid"><div class="form-group"><label for="farmName">نام فارم *</label><input id="farmName" type="text" required autocomplete="off" placeholder="مثلاً فارم شماره ۱"></div><div class="form-group"><label for="farmCode">کد فارم</label><input id="farmCode" type="text" autocomplete="off" placeholder="مثلاً F01"></div><div class="form-group"><label for="farmLocation">موقعیت / شهر</label><input id="farmLocation" type="text" autocomplete="off" placeholder="مثلاً شاهین‌شهر یا مشهد"></div><div class="form-group"><label for="farmProvince">استان</label><select id="farmProvince"><option value="">انتخاب استان</option><option>آذربایجان شرقی</option><option>آذربایجان غربی</option><option>اردبیل</option><option>اصفهان</option><option>البرز</option><option>ایلام</option><option>بوشهر</option><option>تهران</option><option>چهارمحال و بختیاری</option><option>خراسان جنوبی</option><option>خراسان رضوی</option><option>خراسان شمالی</option><option>خوزستان</option><option>زنجان</option><option>سمنان</option><option>سیستان و بلوچستان</option><option>فارس</option><option>قزوین</option><option>قم</option><option>کردستان</option><option>کرمان</option><option>کرمانشاه</option><option>کهگیلویه و بویراحمد</option><option>گلستان</option><option>گیلان</option><option>لرستان</option><option>مازندران</option><option>مرکزی</option><option>هرمزگان</option><option>همدان</option><option>یزد</option></select></div><div class="form-group"><label for="farmRegion">منطقه جغرافیایی</label><select id="farmRegion"><option value="">انتخاب منطقه</option><option value="north">شمال</option><option value="south">جنوب</option><option value="east">شرق</option><option value="west">غرب</option><option value="center">مرکز</option></select></div><div class="form-group"><label for="farmClimate">اقلیم</label><select id="farmClimate"><option value="">انتخاب اقلیم</option><option value="cold">سرد</option><option value="hot_arid">گرم–خشک</option><option value="hot_humid">گرم–مرطوب</option><option value="temperate_humid">معتدل–مرطوب</option></select></div><div class="form-group"><label for="farmOwner">نام مالک</label><input id="farmOwner" type="text" autocomplete="off"></div><div class="form-group"><label for="farmManager">مسئول فارم</label><input id="farmManager" type="text" autocomplete="off"></div><div class="form-group"><label for="farmCapacity">ظرفیت کل</label><input id="farmCapacity" type="text" inputmode="numeric" autocomplete="off" placeholder="مثلاً ۵۰۰۰۰"></div><div class="form-group full"><label for="farmNotes">توضیحات</label><textarea id="farmNotes" rows="4" placeholder="توضیحات مربوط به فارم..."></textarea></div></div><div class="button-row"><button class="btn btn-primary" type="submit">ذخیره فارم</button><button class="btn btn-secondary" type="button" onclick="location.href='Dashboard.html'">بازگشت</button></div></form><section class="card"><h2 class="card-title">فارم‌های ثبت‌شده</h2><div id="farmsList">در حال بارگذاری...</div></section></div></main><nav class="bottom-nav" aria-label="ناوبری اصلی">
