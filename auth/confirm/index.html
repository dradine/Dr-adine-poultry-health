<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#123b2a">
  <title>تأیید لینک | آدینه</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body aria-busy="true">
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var type=p.get("type");
  document.title=type==="recovery"?"":"";
})();
</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../config.js"></script>
  <script>
    (async () => {
      const message = document.getElementById("message");
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get("token_hash");
      const type = params.get("type");
      const requestedNext = params.get("next");

      const allowedNext = {
        recovery: "/update-password.html",
        email: "/login.html"
      };

      const next = requestedNext && requestedNext.startsWith("/") && !requestedNext.startsWith("//")
        ? requestedNext
        : allowedNext[type];

      const labels = {
        recovery: {
          title: "تأیید بازیابی رمز عبور",
          loading: "در حال تأیید لینک بازیابی رمز عبور...",
          invalid: "لینک بازیابی رمز عبور ناقص یا نامعتبر است. لطفاً دوباره درخواست بازیابی رمز عبور کنید.",
          expired: "لینک بازیابی رمز عبور معتبر نیست یا منقضی شده است. لطفاً دوباره درخواست بازیابی کنید.",
          error: "در تأیید لینک بازیابی خطایی رخ داد. لطفاً دوباره درخواست بازیابی کنید."
        },
        email: {
          title: "تأیید ایمیل حساب کاربری",
          loading: "در حال تأیید ایمیل حساب کاربری...",
          invalid: "لینک تأیید ایمیل ناقص یا نامعتبر است. لطفاً دوباره ثبت‌نام یا درخواست تأیید ایمیل کنید.",
          expired: "لینک تأیید ایمیل معتبر نیست یا منقضی شده است. لطفاً دوباره درخواست تأیید ایمیل کنید.",
          error: "در تأیید ایمیل خطایی رخ داد. لطفاً دوباره درخواست تأیید ایمیل کنید."
        }
      };

      const label = labels[type];

      const fail = (text) => {
        message.textContent = text;
        message.className = "message error";
      };

      if (!label || !tokenHash || !next) {
        fail("لینک تأیید ناقص یا نامعتبر است. لطفاً دوباره درخواست ارسال کنید.");
        return;
      }

      document.getElementById("authConfirmTitle").textContent = label.title;
      message.textContent = label.loading;

      try {
        const { error } = await supabaseClient.auth.verifyOtp({
          token_hash: tokenHash,
          type
        });

        if (error) {
          console.error("AUTH CONFIRM VERIFY ERROR:", error);
          fail(error.message || label.expired);
          return;
        }

        window.location.replace(next);
      } catch (error) {
        console.error("AUTH CONFIRM ERROR:", error);
        fail(label.error);
      }
    })();
  </script>
</body></html>
