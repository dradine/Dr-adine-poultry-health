<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#123b2a">
  <title>آدینه</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff}
    body{visibility:hidden}
    body.auth-error{visibility:visible;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f4f7f5;color:#173f2e}
    .error-card{box-sizing:border-box;width:min(440px,calc(100% - 32px));margin:12vh auto 0;padding:28px 22px;border-radius:20px;background:#fff;border:1px solid #dce8e2;box-shadow:0 18px 50px rgba(18,59,42,.12);text-align:center}
    .error-card h1{margin:0 0 10px;font-size:21px}
    .error-card p{margin:0;color:#66756e;font-size:14px;line-height:2}
  </style>
</head>
<body aria-busy="true">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../config.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get("token_hash");
      const type = params.get("type");
      const requestedNext = params.get("next");

      const allowedNext = {
        recovery: "/update-password.html",
        email: "/login.html"
      };

      const next = requestedNext && requestedNext.startsWith("/") && !requestedNext.startsWith("//")
        ? requestedNext
        : allowedNext[type];

      const labels = {
        recovery: {
          title: "لینک بازیابی رمز عبور",
          invalid: "لینک بازیابی رمز عبور ناقص یا نامعتبر است. لطفاً دوباره درخواست بازیابی رمز عبور کنید.",
          expired: "لینک بازیابی رمز عبور معتبر نیست یا منقضی شده است. لطفاً دوباره درخواست بازیابی کنید.",
          error: "در تأیید لینک بازیابی خطایی رخ داد. لطفاً دوباره درخواست بازیابی کنید."
        },
        email: {
          title: "تأیید ایمیل حساب کاربری",
          invalid: "لینک تأیید ایمیل ناقص یا نامعتبر است. لطفاً دوباره ثبت‌نام یا درخواست تأیید ایمیل کنید.",
          expired: "لینک تأیید ایمیل معتبر نیست یا منقضی شده است. لطفاً دوباره درخواست تأیید ایمیل کنید.",
          error: "در تأیید ایمیل خطایی رخ داد. لطفاً دوباره درخواست تأیید ایمیل کنید."
        }
      };

      const showError = (text, title) => {
        document.body.className = "auth-error";
        document.body.removeAttribute("aria-busy");
        document.body.innerHTML =
          '<main class="error-card" role="alert">' +
          '<h1>' + title + '</h1>' +
          '<p>' + text + '</p>' +
          '</main>';
      };

      const label = labels[type];

      if (!label || !tokenHash || !next) {
        showError(label ? label.invalid : "لینک تأیید ناقص یا نامعتبر است. لطفاً دوباره درخواست ارسال کنید.", label ? label.title : "لینک نامعتبر");
        return;
      }

      try {
        const { error } = await supabaseClient.auth.verifyOtp({
          token_hash: tokenHash,
          type
        });

        if (error) {
          console.error("AUTH CONFIRM VERIFY ERROR:", error);
          showError(error.message || label.expired, label.title);
          return;
        }

        window.location.replace(next);
      } catch (error) {
        console.error("AUTH CONFIRM ERROR:", error);
        showError(label.error, label.title);
      }
    })();
  </script>
</body>
</html>
