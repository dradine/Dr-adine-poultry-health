<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123b2a">
<meta name="description" content="تأیید ایمیل حساب کاربری در سامانه مدیریت و پایش فارم‌های طیور آدینه">
<title>تأیید ایمیل | مرکز تخصصی سلامت طیور آدینه</title>
<link rel="icon" type="image/png" href="IMG_4309.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth-compact.css">
<style>
.confirm-card{max-width:560px;margin:8vh auto;padding:34px 28px;text-align:center}
.confirm-icon{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:rgba(168,214,94,.14);border:1px solid rgba(168,214,94,.35);font-size:2.2rem}
.confirm-card h1{margin:0 0 10px}
.confirm-card p{line-height:2;color:#9aa8a0}
.confirm-status{margin:18px 0;padding:13px 16px;border-radius:13px;background:rgba(168,214,94,.08);border:1px solid rgba(168,214,94,.2);color:#dcebdc}
.confirm-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.confirm-actions a{display:inline-flex;align-items:center;justify-content:center;min-width:190px;padding:12px 20px;border-radius:13px;text-decoration:none;font-weight:800}
.confirm-primary{background:#a8d65e;color:#10200f}
.confirm-secondary{border:1px solid rgba(168,214,94,.3);color:#dcebdc;background:rgba(255,255,255,.03)}
</style>
</head>
<body class="auth-page">
<main class="auth-wrapper">
<section class="auth-card confirm-card" aria-labelledby="confirmTitle">
<div class="auth-logo"><img src="IMG_4309.png" alt="لوگوی مرکز تخصصی سلامت طیور آدینه"></div>
<div class="confirm-icon" aria-hidden="true">✓</div>
<h1 id="confirmTitle">ایمیل شما تأیید شد</h1>
<p>تأیید ایمیل حساب کاربری با موفقیت انجام شد. اکنون می‌توانید با ایمیل و رمز عبوری که هنگام ثبت‌نام تعیین کردید وارد سامانه شوید.</p>
<div id="confirmStatus" class="confirm-status">در حال بررسی وضعیت تأیید حساب...</div>
<div class="confirm-actions">
<a class="confirm-primary" href="login.html">ورود به سامانه</a>
<a class="confirm-secondary" href="/">بازگشت به سایت</a>
</div>
<div class="auth-ownership" style="margin-top:22px">© ۲۰۲۶ مرکز تخصصی سلامت طیور آدینه</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(async function(){
const status=document.getElementById("confirmStatus");
try{
const {data,error}=await supabaseClient.auth.getSession();
if(error) throw error;
if(data?.session?.user){
status.textContent="حساب شما تأیید شده است. برای ورود، روی «ورود به سامانه» بزنید.";
if(window.history?.replaceState && window.location.hash) window.history.replaceState({},document.title,window.location.pathname+window.location.search);
}else{
status.textContent="تأیید ایمیل انجام شد. برای ورود، روی «ورود به سامانه» بزنید.";
}
}catch(e){
console.warn("confirmation status:",e);
status.textContent="تأیید ایمیل انجام شد. برای ورود، روی «ورود به سامانه» بزنید.";
}
})();
</script>
</body>
</html>
