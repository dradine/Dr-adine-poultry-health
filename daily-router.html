<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پایش روزانه گله</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#f3f6f4}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app-core.js"></script></head><body><iframe id="frame" title="پایش روزانه"></iframe><script>
(async function(){try{let id='';try{const s=(typeof getCurrentSelection==='function'?getCurrentSelection():{})||{};id=s.flockId||s.flock_id||s.id||''}catch(_){}if(!id){for(const k of ['adine_poultry_current_selection','current_selection','adine_selected_flock']){try{const raw=localStorage.getItem(k);if(!raw)continue;try{const o=JSON.parse(raw);id=o?.flockId||o?.flock_id||o?.id||''}catch(_){if(!raw.trim().startsWith('{'))id=raw.trim()}if(id)break}catch(_) {}}}const q=new URLSearchParams(location.search);id=id||q.get('flock_id')||q.get('flockId')||'';if(!id){frame.src='daily-core.html'+location.search;return}const r=await supabaseClient.from('flocks').select('production_type').eq('id',id).maybeSingle();const t=String(r.data?.production_type||'').toLowerCase();const qs=new URLSearchParams(location.search);qs.set('flock_id',id);frame.src=(t==='layer'||t.includes('تخم'))?'layer-daily-core.html?'+qs.toString():'daily-core.html?'+qs.toString();}catch(e){console.error('Daily router:',e);frame.src='daily-core.html'+location.search;}})();
</script></body></html>
