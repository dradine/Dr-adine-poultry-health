<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متخصصان فارم | آدینه</title><link rel="stylesheet" href="app.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.box{border:1px solid #e5eae7;border-radius:14px;padding:15px}.muted{color:#66736e}.stars{font-size:18px}</style><style>.professional-add-grid{display:grid;gap:8px}.professional-add-grid input,.professional-add-grid select{width:100%;margin-bottom:8px}</style></head><body><header class="topbar"><div class="brand"><img src="IMG_4309.png" alt="آدینه"><span>متخصصان فارم</span></div><button class="btn btn-secondary" onclick="location.href='Dashboard.html'">داشبورد</button></header><main class="page"><div class="container"><h1 class="page-title">دامپزشک و آزمایشگاه فارم</h1><p class="page-description">با کد حرفه‌ای ۴ رقمی، متخصص موردنظر را انتخاب کنید. درخواست ابتدا برای متخصص ارسال می‌شود و فقط پس از تأیید او دسترسی فعال خواهد شد. مالک فارم هر زمان بخواهد می‌تواند دسترسی را قطع کند.</p><section class="card"><div id="farms" class="grid"></div></section><section id="ratePanel" class="card" style="display:none"><h2>ارزیابی پایان همکاری / دوره</h2><form id="rateForm"><input type="hidden" id="rateFarm"><input type="hidden" id="ratePro"><input type="hidden" id="rateType"><div id="rateName"></div><label>امتیاز از ۱ تا ۱۰</label><input id="rating" type="number" min="1" max="10" required><textarea id="comment" placeholder="نظر اختیاری"></textarea><button class="btn btn-primary">ثبت ارزیابی</button></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script><script src="access-control.js"></script><script src="farm-professionals.js"></script></body></html>
