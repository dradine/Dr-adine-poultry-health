<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متخصصان فارم | آدینه</title>
<link rel="stylesheet" href="app.css">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.box{border:1px solid #e5eae7;border-radius:16px;padding:16px;background:#fff}
.farm-box{display:flex;flex-direction:column;gap:14px}
.farm-head{display:flex;justify-content:space-between;gap:12px}
.muted{color:#66736e}
.connect-box{padding:14px;border-radius:14px;background:#f7faf8;border:1px solid #e7eee9;display:grid;gap:8px}
.code-row{display:flex;gap:8px}.code-row input{flex:1;min-width:0}
.professionals{display:grid;gap:8px}.professionals h4{margin:0}
.professional-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid #edf0ee;border-radius:12px}
.professional-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.type-pill,.status-pill{font-size:12px;padding:4px 8px;border-radius:999px}
.type-pill{background:#eef5f1}.status-active{background:#e7f7ec;color:#16713b}.status-pending{background:#fff4d8;color:#875c00}.status-muted{background:#eef0f0;color:#606866}
.btn-danger-outline{border:1px solid #c94a4a;background:#fff;color:#a62828}
.empty-state,.empty-access{padding:18px;text-align:center}.alert{padding:12px;border-radius:12px;background:#fff4d8;margin-bottom:8px}
@media(max-width:600px){.code-row{flex-direction:column}.professional-row{align-items:stretch;flex-direction:column}.professional-actions button{width:100%}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="IMG_4309.png" alt="آدینه"><span>متخصصان فارم</span></div>
  <button class="btn btn-secondary" type="button" onclick="location.href='Dashboard.html'">داشبورد</button>
</header>
<main class="page">
  <div class="container">
    <h1 class="page-title">مدیریت متخصصان فارم</h1>
    <p class="page-description">
      دامپزشک، دامپزشک مسئول فنی، کارشناس فنی طیور یا آزمایشگاه را با کد حرفه‌ای ۴ رقمی انتخاب کنید.
      درخواست ابتدا برای متخصص ارسال می‌شود و فقط پس از تأیید او دسترسی فعال خواهد شد.
      مالک فارم هر زمان بخواهد می‌تواند دسترسی را قطع کند.
    </p>
    <section class="card">
      <div id="farms" class="grid"></div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="access-control.js"></script>
<script src="farm-professionals.js"></script>
</body>
</html>
