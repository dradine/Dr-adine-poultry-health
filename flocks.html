<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173f35">
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script><script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script><script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
</head><body><div class="app-shell"><header class="topbar"><div class="brand"><img src="IMG_4309.png" alt="مرکز تخصصی سلامت طیور آدینه"><span>سالن و گله</span></div><button type="button" class="btn btn-secondary" onclick="location.href='Dashboard.html'">داشبورد</button></header>
<main class="page"><div class="container"><h1 class="page-title">مدیریت سالن و گله</h1><p class="page-description">ابتدا فارم و سالن را انتخاب کنید، سپس دوره گله را ثبت کنید.</p>
<section class="card"><h2 class="card-title">فارم انتخاب‌شده</h2><div id="selectedFarm">در حال بارگذاری...</div></section>
<section class="card"><h2 class="card-title">ثبت سالن</h2><form id="houseForm"><div class="form-grid"><div class="form-group"><label for="houseName">نام سالن *</label><input id="houseName" type="text" required placeholder="مثلاً سالن ۱"></div><div class="form-group"><label for="houseCode">کد سالن</label><input id="houseCode" type="text" placeholder="مثلاً H01"></div><div class="form-group"><label for="houseCapacity">ظرفیت سالن</label><input id="houseCapacity" type="text" inputmode="numeric" autocomplete="off" placeholder="مثلاً ۲۵۰۰۰"></div><div class="form-group"><label for="houseInitialBirdCount">تعداد اولیه جوجه / مرغ سالن</label><input id="houseInitialBirdCount" type="text" inputmode="numeric" autocomplete="off" placeholder="مثلاً ۵۰۰۰۰"></div><div class="form-group"><label for="houseLength">طول سالن (متر)</label><input id="houseLength" type="text" inputmode="decimal" autocomplete="off"></div><div class="form-group"><label for="houseWidth">عرض سالن (متر)</label><input id="houseWidth" type="text" inputmode="decimal" autocomplete="off"></div><div class="form-group"><label for="houseVentilation">سیستم تهویه</label><select id="houseVentilation"><option value="">انتخاب کنید</option><option value="tunnel">تونلی</option><option value="cross">عرضی</option><option value="natural">طبیعی</option><option value="mixed">ترکیبی</option></select></div><div class="form-group"><label for="houseSystem">سیستم پرورش</label><select id="houseSystem"><option value="">انتخاب کنید</option><option value="floor">بستر</option><option value="cage">قفس</option><option value="aviary">آویاری</option></select></div><div class="form-group full"><label for="houseNotes">توضیحات</label><textarea id="houseNotes" rows="3"></textarea></div></div><div class="button-row"><button class="btn btn-primary" type="submit">ذخیره سالن</button></div></form></section>
<section class="card"><h2 class="card-title">سالن‌های فارم</h2><div id="housesList">در حال بارگذاری...</div></section>
<section class="card"><h2 class="card-title">ثبت گله</h2><form id="flockForm"><div class="form-grid"><div class="form-group full"><label for="flockHouse">سالن *</label><select id="flockHouse" required><option value="">ابتدا سالن را انتخاب کنید</option></select></div><div class="form-group"><label for="flockName">نام گله *</label><input id="flockName" type="text" required placeholder="مثلاً گله تابستان ۱۴۰۵"></div><div class="form-group"><label for="flockCode">کد گله</label><input id="flockCode" type="text" placeholder="مثلاً FLOCK-01"></div><div class="form-group"><label for="productionType">نوع پرورش *</label><select id="productionType" required><option value="">انتخاب کنید</option><option value="broiler">گوشتی</option><option value="layer">تخم‌گذار</option><option value="pullet">پولت</option><option value="breeder">مرغ مادر</option></select></div><div class="form-group"><label for="genetics">نژاد / سویه</label><select id="genetics"><option value="">ابتدا نوع پرورش را انتخاب کنید</option></select></div><div class="form-group"><label for="flockStrain">سویه / خط ژنتیکی</label><select id="flockStrain"><option value="">ابتدا شرکت / ژنتیک را انتخاب کنید</select></div><div class="form-group"><label for="flockProgram">برنامه / کاتالوگ استاندارد</label><select id="flockProgram"><option value="">انتخاب خودکار</option></select></div><div class="form-group"><label for="flockSex">جنسیت</label><select id="flockSex"><option value="mixed">مخلوط</option><option value="male">نر</option><option value="female">ماده</option></select></div><div class="form-group"><label for="birdCount">تعداد اولیه جوجه / مرغ</label><input id="birdCount" type="text" inputmode="numeric" autocomplete="off" placeholder="با انتخاب سالن خودکار پر می‌شود"></div><div class="form-group"><label for="initialAverageWeightG">میانگین وزن اولیه (گرم) *</label><input id="initialAverageWeightG" type="text" inputmode="decimal" autocomplete="off" placeholder="مثلاً ۴۵" required></div><div class="form-group"><label for="placementDate">تاریخ جوجه ریزی / استقرار گله</label><input id="placementDate" type="text" inputmode="numeric" autocomplete="off" placeholder="۱۴۰۵/۰۵/۲۹" maxlength="10" readonly></div><div class="form-group"><label for="startAgeDays">سن جوجه ریزی / استقرار گله (روز)</label><input id="startAgeDays" type="text" inputmode="numeric" autocomplete="off" value="۱"></div><div class="form-group full"><label for="flockNotes">توضیحات</label><textarea id="flockNotes" rows="3"></textarea></div></div><div class="button-row"><button class="btn btn-primary" type="submit">ذخیره گله</button></div></form></section>
<section class="card"><h2 class="card-title">گله‌های ثبت‌شده</h2><div id="flocksList">در حال بارگذاری...</div></section></div></main><nav class="bottom-nav" aria-label="ناوبری اصلی"><button type="button" onclick="window.location.href='Dashboard.html'" aria-label="خانه"><span data-icon="home"></span><small>خانه</small></button><button type="button" onclick="window.location.href='Farms.html'" aria-label="فارم‌ها"><span data-icon="farm"></span><small>فارم‌ها</small></button><button class="active" type="button" onclick="window.location.href='flocks.html'" aria-label="سالن و گله"><span data-icon="flock"></span><small>سالن و گله</small></button><button type="button" onclick="window.location.href='weekly.html'" aria-label="هفتگی"><span data-icon="scale"></span><small>هفتگی</small></button></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="standards.js"></script><script src="standard-data.js"></script><script src="poultry-utils.js"></script><script src="weekly-storage.js"></script><script src="comparison-engine.js"></script><script src="app-core.js"></script><script src="genetics-ui.js"></script><script src="weekly-engine.js"></script><script src="access-control.js"></script>
<script src="date-system.js"></script>
<script src="flocks.js"></script><script src="farm-house-flock-enhancements.js"></script><script src="poultry-icons.js"></script><script src="edit-manager.js"></script>
</body></html>
