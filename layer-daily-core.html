<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پایش روزانه تخم‌گذار | مرکز تخصصی سلامت طیور آدینه</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app-core.js"></script><script src="layer-daily-standards-v1.js"></script><script src="layer-period-engine-v1.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17251f;font-family:Tahoma,Arial,sans-serif;padding:16px 0 34px}.wrap{width:min(1180px,94%);margin:auto}.card{background:#fff;border:1px solid #dfe8e2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 20px rgba(15,60,35,.055)}.hero{background:linear-gradient(135deg,#163d2b,#245b3f);color:#fff;border:0}.hero h1{font-size:20px;margin:0 0 8px}.muted{opacity:.75;font-size:12px}.flock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.pill{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px}.pill small{display:block;opacity:.7;margin-bottom:3px}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.metric{border:1px solid #e1e9e4;border-radius:14px;padding:12px;background:#fafcfb}.metric b{display:block;font-size:18px;margin-top:5px}.metric small{color:#66756d}.status{font-size:12px;margin-top:7px}.ok{color:#197a48}.warn{color:#a15d00}.bad{color:#a83232}.section{border:1px solid #dfe8e2;border-radius:15px;margin:12px 0;overflow:hidden}.section-head{width:100%;border:0;background:#f8fbf9;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font:800 14px Tahoma;color:#1c3829;cursor:pointer}.section-head .plus{width:27px;height:27px;border:1px solid #d4e0d8;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:19px}.section.open .plus:before{content:'−'}.section:not(.open) .plus:before{content:'+'}.section-head .plus{font-size:0}.section.open .plus,.section:not(.open) .plus{font-size:0}.section.open .plus:before,.section:not(.open) .plus:before{font-size:19px}.section-body{display:none;padding:15px}.section.open .section-body{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.group label{display:block;font-size:12px;font-weight:700;color:#52625a;margin:0 0 6px}.group input,.group select,.group textarea{width:100%;border:1px solid #d5e0d9;border-radius:11px;padding:10px;background:#fff;font:14px Tahoma;color:#17251f}.group textarea{min-height:82px;resize:vertical}.full{grid-column:1/-1}.readonly{background:#f4f7f5!important}.actions{display:flex;gap:10px}.btn{border:0;border-radius:12px;padding:12px 18px;font:800 13px Tahoma;cursor:pointer}.primary{background:#1f6b45;color:#fff}.secondary{background:#edf3ef;color:#234534}.history-row{display:grid;grid-template-columns:90px 90px 1fr 80px;gap:10px;padding:10px 0;border-bottom:1px solid #edf1ee;font-size:12px}.alert{display:none;padding:12px;border-radius:12px;background:#fff4df;color:#805000;margin-top:10px;font-size:12px}.alert.show{display:block}@media(max-width:760px){.flock,.summary,.grid{grid-template-columns:1fr 1fr}.history-row{grid-template-columns:1fr 1fr}.actions{flex-direction:column}}@media(max-width:460px){.flock,.summary,.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<section class="card hero"><h1>پایش روزانه گله — تخم‌گذار</h1><div class="muted">موتور مستقل Layer Daily Monitoring • استاندارد مستقل تخم‌گذار</div><div id="flockInfo" class="flock"></div></section>
<section class="card"><div class="select-row" style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end"><div class="group"><label for="daySelect">انتخاب روز پایش</label><select id="daySelect"></select></div><div class="muted" id="dayRangeHint">همه روزهای ثبت‌شده گله قابل انتخاب هستند.</div></div></section><section class="card"><div class="summary" id="summary"><div class="metric"><small>تولید روزانه</small><b id="sProd">—</b><div class="status" id="sProdSt"></div></div><div class="metric"><small>مصرف دان/مرغ</small><b id="sFeed">—</b></div><div class="metric"><small>مصرف آب/مرغ</small><b id="sWater">—</b></div><div class="metric"><small>Egg Mass</small><b id="sMass">—</b></div><div class="metric"><small>تلفات روزانه</small><b id="sMort">—</b></div><div class="metric"><small>وضعیت پایش</small><b id="sStatus">—</b></div></div><div id="alert" class="alert"></div></section>
<form id="layerDailyForm">
<section class="section open"><button class="section-head" type="button">۱) تاریخ، سن و جمعیت گله <span class="plus"></span></button><div class="section-body"><div class="grid"><div class="group"><label>تاریخ ثبت (شمسی)</label><input id="recordDateJalali" type="text" inputmode="numeric" placeholder="۱۴۰۵/۰۷/۰۲" autocomplete="off" required><input id="recordDate" type="hidden"></div><div class="group"><label>سن گله (روز)</label><input id="ageDays" class="readonly" readonly></div><div class="group"><label>تعداد ابتدای روز</label><input id="openingBirds" type="number" min="0"></div><div class="group"><label>تلفات</label><input id="mortalityCount" type="number" min="0" value="0"></div><div class="group"><label>حذفیات</label><input id="cullCount" type="number" min="0" value="0"></div><div class="group"><label>زنده‌مانی (%)</label><input id="livability" class="readonly" readonly></div></div></div></section>
<section class="section"><button class="section-head" type="button">۲) دان، آب و مصرف روزانه <span class="plus"></span></button><div class="section-body"><div class="grid"><div class="group"><label>دان مصرفی کل (kg)</label><input id="feedQuantity" type="number" step="0.01" min="0"></div><div class="group"><label>مصرف دان/مرغ/روز (g)</label><input id="feedPerHen" class="readonly" readonly></div><div class="group"><label>آب مصرفی کل (L)</label><input id="waterQuantity" type="number" step="0.1" min="0"></div><div class="group"><label>مصرف آب/مرغ/روز (mL)</label><input id="waterPerHen" class="readonly" readonly></div><div class="group"><label>نسبت آب به دان</label><input id="waterFeedRatio" class="readonly" readonly></div><div class="group"><label>تغییر جیره / خوراک</label><input id="feedChange"></div></div></div></section>
<section class="section"><button class="section-head" type="button">۳) تولید و کیفیت تخم‌مرغ <span class="plus"></span></button><div class="section-body"><div class="grid"><div class="group"><label>تعداد کل تخم</label><input id="eggCount" type="number" min="0"></div><div class="group"><label>درصد تولید Hen-Day</label><input id="henDay" class="readonly" readonly></div><div class="group"><label>تعداد تخم قابل فروش</label><input id="saleableEggCount" type="number" min="0"></div><div class="group"><label>درصد قابل فروش</label><input id="saleableEggPercent" class="readonly" readonly></div><div class="group"><label>تخم شکسته</label><input id="crackedEggCount" type="number" min="0"></div><div class="group"><label>تخم کثیف</label><input id="dirtyEggCount" type="number" min="0"></div><div class="group"><label>تخم نرم / بدون پوسته</label><input id="softShellEggCount" type="number" min="0"></div><div class="group"><label>تخم بدشکل / زبر</label><input id="misshapenEggCount" type="number" min="0"></div><div class="group"><label>تخم کف سالن</label><input id="floorEggCount" type="number" min="0"></div><div class="group"><label>درصد کل معیوب</label><input id="eggDefectPercent" class="readonly" readonly></div><div class="group"><label>وزن متوسط تخم (g)</label><input id="eggWeight" type="number" step="0.1" min="0"></div><div class="group"><label>Egg Mass (g/hen/day)</label><input id="eggMass" class="readonly" readonly></div><div class="group"><label>خوراک به ازای هر تخم (g)</label><input id="feedPerEgg" class="readonly" readonly></div><div class="group"><label>Feed / Egg Mass</label><input id="feedPerEggMass" class="readonly" readonly></div><div class="group full"><label>وضعیت کیفیت پوسته</label><select id="eggShellQuality"><option value="">انتخاب</option><option>طبیعی</option><option>افزایش تخم ترک‌دار</option><option>پوسته نازک</option><option>پوسته نرم</option><option>افزایش تخم بدشکل</option></select></div></div></div></section>
<section class="section"><button class="section-head" type="button">۴) کیفیت پیشرفته تخم و آب — اختیاری <span class="plus"></span></button><div class="section-body"><div class="grid"><div class="group"><label>Haugh Unit</label><input id="haughUnit" type="number" step="0.1" min="0"></div><div class="group"><label>ارتفاع آلبومین (mm)</label><input id="albumenHeight" type="number" step="0.1" min="0"></div><div class="group"><label>استحکام پوسته (g)</label><input id="shellStrength" type="number" step="0.1" min="0"></div><div class="group"><label>ضخامت پوسته (mm)</label><input id="shellThickness" type="number" step="0.01" min="0"></div><div class="group"><label>رنگ پوسته / امتیاز رنگ</label><input id="eggColor" type="number" step="0.1" min="0"></div><div class="group"><label>pH آب</label><input id="waterPh" type="number" step="0.01"></div><div class="group"><label>TDS آب (ppm)</label><input id="waterTds" type="number" step="1" min="0"></div><div class="group"><label>کلر آزاد آب (ppm)</label><input id="waterChlorine" type="number" step="0.01" min="0"></div><div class="group"><label>وضعیت میکروبی آب</label><select id="waterMicro"><option value="">انتخاب</option><option>طبیعی</option><option>نیازمند آزمایش</option><option>مشکوک</option></select></div></div></div></section><section class="section"><button class="section-head" type="button">۵) وزن بدن و یکنواختی — در صورت اندازه‌گیری امروز <span class="plus"></span></button><div class="section-body"><div class="grid"><div class="group"><label>وزن متوسط بدن (g)</label><input id="bodyWeight" type="number" step="0.1" min="0"></div><div class="group"><label>تعداد نمونه وزن</label><input id="bodyWeightSample" type="number" min="0"></div><div class="group"><label>Uniformity ±10%</label><input id="uniformity10" type="number" step="0.1" min="0" max="100"></div><div class="group"><label>Uniformity ±15%</label><input id="uniformity15" type="number" step="0.1" min="0" max="100"></div><div class="group"><label>CV%</label><input id="cv" type="number" step="0.1" min="0"></div><div class="group"><label>مرجع وزن/یکنواختی</label><input id="weightReference" class="readonly" readonly></div></div></div></section>
<section class="section"><button class="section-head" type="button">۶) محیط سالن و آب <span class="plus"></span></button><div class="section-body"><div class="grid"><div class="group"><label>دمای سالن (°C)</label><input id="houseTemp" type="number" step="0.1"></div><div class="group"><label>دمای بیرون (°C)</label><input id="outsideTemp" type="number" step="0.1"></div><div class="group"><label>رطوبت نسبی (%)</label><input id="humidity" type="number" step="0.1" min="0" max="100"></div><div class="group"><label>ساعات روشنایی</label><input id="lightHours" type="number" step="0.1" min="0" max="24"></div><div class="group"><label>شدت نور (lux)</label><input id="lightLux" type="number" step="0.1" min="0"></div><div class="group"><label>آمونیاک (ppm)</label><input id="ammonia" type="number" step="0.1" min="0"></div><div class="group"><label>CO₂ (ppm)</label><input id="co2" type="number" step="1" min="0"></div><div class="group"><label>دمای آب (°C)</label><input id="waterTemp" type="number" step="0.1"></div><div class="group"><label>کیفیت آب</label><select id="waterQuality"><option value="">انتخاب</option><option>طبیعی</option><option>نیازمند بررسی</option><option>مشکوک</option></select></div><div class="group"><label>وضعیت کود/بستر</label><select id="manureCondition"><option value="">انتخاب</option><option>طبیعی</option><option>مرطوب</option><option>خیلی مرطوب</option><option>بوی غیرعادی</option></select></div></div></div></section>
<section class="section"><button class="section-head" type="button">۷) سلامت، رفتار و رفاه گله <span class="plus"></span></button><div class="section-body"><div class="grid"><div class="group"><label>اشتها / مصرف خوراک</label><select id="appetite"><option value="">انتخاب</option><option>طبیعی</option><option>کاهش اشتها</option><option>کاهش واضح مصرف</option></select></div><div class="group"><label>وضعیت تنفسی</label><select id="respiratory"><option value="">انتخاب</option><option>طبیعی</option><option>علائم خفیف</option><option>علائم واضح</option></select></div><div class="group"><label>وضعیت مدفوع</label><select id="droppings"><option value="">انتخاب</option><option>طبیعی</option><option>غیرطبیعی خفیف</option><option>اسهالی / آبکی</option></select></div><div class="group"><label>وضعیت فعالیت گله</label><select id="activity"><option value="">انتخاب</option><option>طبیعی</option><option>کاهش فعالیت</option><option>بی‌قراری</option><option>تجمع غیرطبیعی</option></select></div><div class="group"><label>پرکنی / Feather Pecking</label><select id="pecking"><option value="">انتخاب</option><option>طبیعی</option><option>افزایش پرکنی</option><option>زخم / کانیبالیسم</option></select></div><div class="group"><label>وضعیت استخوان سینه</label><select id="keelBone"><option value="">انتخاب</option><option>طبیعی</option><option>انحراف مشکوک</option><option>آسیب / شکستگی مشکوک</option></select></div><div class="group"><label>حرکت / Gait</label><select id="locomotion"><option value="">انتخاب</option><option>طبیعی</option><option>اختلال خفیف</option><option>اختلال واضح</option></select></div><div class="group"><label>وضعیت کف پا</label><select id="footpad"><option value="">انتخاب</option><option>طبیعی</option><option>ضایعه خفیف</option><option>ضایعه واضح</option></select></div><div class="group"><label>استفاده از لانه</label><select id="nestUse"><option value="">انتخاب</option><option>طبیعی</option><option>افزایش تخم کف سالن</option><option>کاهش استفاده از لانه</option></select></div><div class="group full"><label>علائم بالینی / مشاهدات سلامت</label><textarea id="clinicalSigns"></textarea></div></div></div></section>
<section class="section"><button class="section-head" type="button">۸) مداخلات و یادداشت روزانه <span class="plus"></span></button><div class="section-body"><div class="grid"><div class="group"><label>واکسیناسیون امروز</label><input id="vaccinationEvent"></div><div class="group"><label>درمان / مداخله</label><input id="treatment"></div><div class="group"><label>ایراد تجهیزات</label><input id="equipmentIssue"></div><div class="group full"><label>یادداشت</label><textarea id="notes"></textarea></div></div></div></section>
<div class="actions"><button class="btn primary" type="submit">ذخیره پایش روزانه تخم‌گذار</button><button class="btn secondary" id="reload" type="button">بازخوانی</button></div></form>
<section class="card"><b>سوابق پایش روزانه همین گله</b><div id="history" style="margin-top:10px"></div></section></main>
<script src="layer-daily-monitoring-v1.js"></script></body></html>
