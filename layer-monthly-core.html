<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پایش ماهانه تخم‌گذار | مرکز تخصصی سلامت طیور آدینه</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app-core.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17251f;font-family:Tahoma,Arial,sans-serif;padding:16px 0 34px}.wrap{width:min(1180px,94%);margin:auto}.card{background:#fff;border:1px solid #dfe8e2;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#163d2b,#245b3f);color:#fff;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:1px solid #e1e9e4;border-radius:14px;padding:12px;background:#fafcfb}.metric small{color:#66756d}.metric b{display:block;font-size:18px;margin-top:5px}.group label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.group select{width:100%;border:1px solid #d5e0d9;border-radius:11px;padding:11px;background:#fff;font:14px Tahoma}.select-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.btn{border:0;border-radius:12px;padding:12px 18px;font:800 13px Tahoma;cursor:pointer;background:#1f6b45;color:#fff}.table{width:100%;border-collapse:collapse;font-size:12px}.table td{padding:10px;border-bottom:1px solid #edf1ee}.note{padding:12px;border-radius:12px;background:#f7faf8;font-size:12px;line-height:1.9}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.select-row{grid-template-columns:1fr}.table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card hero"><h1>پایش ماهانه گله — تخم‌گذار</h1><div id="flockInfo">در حال دریافت اطلاعات گله…</div></section><section class="card"><div class="select-row"><div class="group"><label>انتخاب ماه پایش</label><select id="monthSelect"></select></div><button class="btn" id="reportBtn">گزارش ماهانه</button></div></section><section class="card"><div class="grid"><div class="metric"><small>تولید میانگین</small><b id="prod">—</b></div><div class="metric"><small>دان/مرغ</small><b id="feed">—</b></div><div class="metric"><small>آب/مرغ</small><b id="water">—</b></div><div class="metric"><small>وزن تخم</small><b id="egg">—</b></div><div class="metric"><small>Egg Mass</small><b id="mass">—</b></div><div class="metric"><small>Feed/Egg Mass</small><b id="fem">—</b></div><div class="metric"><small>تلفات</small><b id="mort">—</b></div><div class="metric"><small>زنده‌مانی</small><b id="liv">—</b></div></div></section><section class="card"><table class="table"><tbody><tr><td>تخم کل</td><td id="eggs">—</td></tr><tr><td>تخم قابل فروش</td><td id="sale">—</td></tr><tr><td>تخم شکسته</td><td id="cracked">—</td></tr><tr><td>تخم کثیف</td><td id="dirty">—</td></tr><tr><td>دمای سالن</td><td id="temp">—</td></tr><tr><td>رطوبت</td><td id="rh">—</td></tr></tbody></table><div class="note" id="note"></div></section></main><script>
(async function(){let id,rows=[];const $=x=>document.getElementById(x),q=new URLSearchParams(location.search),fmt=(v,d=1)=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(d);async function boot(){const a=await checkUserAccess();if(!a?.authenticated){location.href='login.html';return}id=(typeof getCurrentSelection==='function'?getCurrentSelection()?.flockId:null)||q.get('flock_id');const f=await supabaseClient.from('flocks').select('id,flock_name,strain,production_type').eq('id',id).maybeSingle();if(f.error||!f.data)return;if(String(f.data.production_type).toLowerCase()!=='layer'){location.href='weekly-core.html'+location.search;return}$('flockInfo').textContent=f.data.flock_name+' • '+(f.data.strain||'—')+' • موتور مستقل Layer';const r=await supabaseClient.from('layer_monthly_monitoring').select('*').eq('flock_id',id).order('jalali_year').order('jalali_month');rows=r.data||[];rows.forEach(x=>{const o=document.createElement('option');o.value=x.jalali_month_key;o.textContent=(x.jalali_month_label||x.jalali_month_key)+' • سن '+x.age_start_days+' تا '+x.age_end_days+' روز';$('monthSelect').appendChild(o)});if(q.get('month'))$('monthSelect').value=q.get('month');render();$('monthSelect').onchange=render;$('reportBtn').onclick=()=>location.href='layer-reports.html?flock_id='+encodeURIComponent(id)+'&period=monthly&month='+encodeURIComponent($('monthSelect').value)}function render(){const r=rows.find(x=>x.jalali_month_key===$('monthSelect').value)||rows.at(-1);if(!r)return;$('prod').textContent=fmt(r.avg_hen_day_production)+'٪';$('feed').textContent=fmt(r.avg_feed_per_hen_g)+' g';$('water').textContent=fmt(r.avg_water_per_hen_ml)+' ml';$('egg').textContent=fmt(r.avg_egg_weight_g)+' g';$('mass').textContent=fmt(r.avg_egg_mass_g)+' g';$('fem').textContent=fmt(r.feed_per_egg_mass,3);$('mort').textContent=fmt(r.mortality_count,0)+' قطعه';$('liv').textContent=fmt(r.livability)+'٪';$('eggs').textContent=fmt(r.total_eggs,0);$('sale').textContent=fmt(r.total_saleable_eggs,0);$('cracked').textContent=fmt(r.total_cracked_eggs,0);$('dirty').textContent=fmt(r.total_dirty_eggs,0);$('temp').textContent=fmt(r.avg_temperature_c)+' °C';$('rh').textContent=fmt(r.avg_humidity_pct)+'٪';$('note').textContent='از '+r.source_daily_count+' رکورد روزانه ساخته شده است؛ '+(r.is_complete?'ماه کامل است.':'ماه در حال تکمیل است.')}boot()})();
</script></body></html>
