<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش‌های تخم‌گذار | مرکز تخصصی سلامت طیور آدینه</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app-core.js"></script><script src="layer-daily-standards-v1.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17251f;font-family:Tahoma,Arial,sans-serif;padding:16px 0 40px}.wrap{width:min(1220px,94%);margin:auto}.card{background:#fff;border:1px solid #dfe8e2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 20px rgba(15,60,35,.055)}.hero{background:linear-gradient(135deg,#163d2b,#245b3f);color:#fff;border:0}.identity,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pill,.metric{border-radius:12px;padding:10px}.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)}.metric{border:1px solid #e1e9e4;background:#fafcfb}.metric small{color:#66756d}.metric b{display:block;font-size:18px;margin-top:5px}.tabs,.subtabs{display:flex;gap:8px;overflow:auto}.tab,.subtab{border:1px solid #d5e0d9;background:#f7faf8;border-radius:11px;padding:10px 14px;font:800 13px Tahoma;cursor:pointer;white-space:nowrap}.tab.active{background:#1f6b45;color:#fff}.subtab.active{background:#e8f1eb;color:#1f6b45;border-color:#1f6b45}.controls{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.group label{display:block;font-size:12px;font-weight:700;color:#52625a;margin-bottom:6px}.group select{width:100%;border:1px solid #d5e0d9;border-radius:11px;padding:11px;background:#fff;font:14px Tahoma}.btn{border:0;border-radius:12px;padding:12px 18px;font:800 13px Tahoma;cursor:pointer;background:#1f6b45;color:#fff}.panel{display:none}.panel.active{display:block}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid #edf1ee;text-align:right}.table th{background:#f7faf8}.note{padding:12px;border-radius:12px;background:#f7faf8;font-size:12px;line-height:1.9}@media(max-width:760px){.identity,.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:460px){.identity,.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card hero"><h1>گزارش‌های تخم‌گذار</h1><div id="subtitle">گزارش‌ها مستقل از موتورهای Broiler هستند.</div><div id="identity" class="identity" style="margin-top:14px"></div></section><section class="card"><nav class="tabs"><button class="tab active" data-tab="daily">گزارش روزانه</button><button class="tab" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="monthly">گزارش ماهانه</button><button class="tab" data-tab="overall">گزارش جامع عملکرد گله</button><button class="tab" data-tab="compare">گزارش مقایسه‌ای</button></nav></section><section id="periodNav" class="card"><nav class="subtabs"><button class="subtab active" data-period="daily">گزارش روزانه</button><button class="subtab" data-period="weekly">گزارش هفتگی</button><button class="subtab" data-period="monthly">گزارش ماهانه</button></nav></section><section id="dailyPanel" class="card panel active"><div class="controls"><div class="group"><label>روز گزارش — تمام روزها</label><select id="day"></select></div><button class="btn" onclick="window.print()">چاپ</button></div><div class="grid" id="dailyMetrics" style="margin-top:14px"></div></section><section id="weeklyPanel" class="card panel"><div class="controls"><div class="group"><label>هفته گزارش</label><select id="week"></select></div><button class="btn" onclick="window.print()">چاپ</button></div><div class="grid" id="weeklyMetrics" style="margin-top:14px"></div></section><section id="monthlyPanel" class="card panel"><div class="controls"><div class="group"><label>ماه گزارش</label><select id="month"></select></div><button class="btn" onclick="window.print()">چاپ</button></div><div class="grid" id="monthlyMetrics" style="margin-top:14px"></div></section><section id="overallPanel" class="card panel"><div class="grid" id="overallMetrics"></div><div class="note" id="overallNote" style="margin-top:12px"></div></section><section id="comparePanel" class="card panel"><div class="controls"><div class="group"><label>هفته مقایسه</label><select id="compareWeek"></select></div></div><table class="table" style="margin-top:14px"><thead><tr><th>سویه</th><th>هفته</th><th>تولید %</th><th>دان g</th><th>آب ml</th><th>وزن تخم g</th><th>Feed/Egg Mass</th></tr></thead><tbody id="compareBody"></tbody></table></section></main><script>
(async function(){let flockId,flock,daily=[],weekly=[],monthly=[];const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),fmt=(v,d=1)=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(d),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const cards=a=>a.map(x=>'<div class="metric"><small>'+esc(x[0])+'</small><b>'+esc(x[1])+'</b></div>').join('');
function show(name){['daily','weekly','monthly','overall','compare'].forEach(x=>$(x+'Panel').classList.toggle('active',x===name));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));const p=['daily','weekly','monthly'].includes(name);$('periodNav').style.display=p?'block':'none';document.querySelectorAll('.subtab').forEach(x=>x.classList.toggle('active',x.dataset.period===name));}
function renderDaily(){const r=daily.find(x=>x.record_date===$('day').value)||daily.at(-1);if(!r)return;$('dailyMetrics').innerHTML=cards([['تاریخ',r.record_date],['سن گله',r.age_days+' روز'],['تولید Hen-Day',fmt(r.hen_day_production_percent)+'٪'],['دان/مرغ',fmt(r.feed_per_hen_g)+' g'],['آب/مرغ',fmt(r.water_per_hen_ml)+' ml'],['Egg Mass',fmt(r.egg_mass_g_hen_day)+' g'],['وزن تخم',fmt(r.average_egg_weight_g)+' g'],['تلفات',fmt(r.mortality_count,0)+' قطعه'],['قابل فروش',fmt(r.saleable_egg_percent)+'٪'],['معیوب',fmt(r.egg_defect_percent)+'٪'],['وضعیت پایش',r.daily_monitoring_status||'—'],['دلیل',r.daily_status_reason||'—']]);}
function renderWeekly(){const r=weekly.find(x=>Number(x.week_no)===Number($('week').value))||weekly.at(-1);if(!r)return;$('weeklyMetrics').innerHTML=cards([['هفته',r.week_no],['سن',r.age_start_days+'–'+r.age_end_days+' روز'],['تولید',fmt(r.avg_hen_day_production)+'٪'],['دان/مرغ',fmt(r.avg_feed_per_hen_g)+' g'],['آب/مرغ',fmt(r.avg_water_per_hen_ml)+' ml'],['وزن تخم',fmt(r.avg_egg_weight_g)+' g'],['Egg Mass',fmt(r.avg_egg_mass_g)+' g'],['Feed/Egg Mass',fmt(r.feed_per_egg_mass,3)],['تلفات',fmt(r.mortality_count,0)+' قطعه'],['وضعیت',r.health_status||'—']]);}
function renderMonthly(){const r=monthly.find(x=>x.jalali_month_key===$('month').value)||monthly.at(-1);if(!r)return;$('monthlyMetrics').innerHTML=cards([['ماه',r.jalali_month_label||r.jalali_month_key],['سن',r.age_start_days+'–'+r.age_end_days+' روز'],['تولید',fmt(r.avg_hen_day_production)+'٪'],['دان/مرغ',fmt(r.avg_feed_per_hen_g)+' g'],['آب/مرغ',fmt(r.avg_water_per_hen_ml)+' ml'],['وزن تخم',fmt(r.avg_egg_weight_g)+' g'],['Egg Mass',fmt(r.avg_egg_mass_g)+' g'],['Feed/Egg Mass',fmt(r.feed_per_egg_mass,3)],['تلفات',fmt(r.mortality_count,0)+' قطعه'],['زنده‌مانی',fmt(r.livability)+'٪']]);}
function renderOverall(){const av=(a,k)=>{const v=a.map(x=>Number(x[k])).filter(Number.isFinite);return v.length?fmt(v.reduce((x,y)=>x+y,0)/v.length):'—'};$('overallMetrics').innerHTML=cards([['روزهای ثبت‌شده',daily.length],['هفته‌های ثبت‌شده',weekly.length],['ماه‌های ثبت‌شده',monthly.length],['میانگین تولید روزانه',av(daily,'hen_day_production_percent')+'٪'],['میانگین تولید هفتگی',av(weekly,'avg_hen_day_production')+'٪'],['میانگین تولید ماهانه',av(monthly,'avg_hen_day_production')+'٪'],['میانگین وزن تخم',av(daily,'average_egg_weight_g')+' g'],['تلفات کل',daily.reduce((s,x)=>s+(Number(x.mortality_count)||0),0)+' قطعه']]);$('overallNote').textContent='گزارش جامع عملکرد گله از سه لایه روزانه، هفتگی و ماهانه داده می‌گیرد.';}
async function renderCompare(){const w=Number($('compareWeek').value);const fs=(await supabaseClient.from('flocks').select('id,strain,flock_name').eq('production_type','layer')).data||[];const map=new Map(fs.map(x=>[x.id,x]));const d=(await supabaseClient.from('layer_weekly_monitoring').select('flock_id,week_no,avg_hen_day_production,avg_feed_per_hen_g,avg_water_per_hen_ml,avg_egg_weight_g,feed_per_egg_mass').eq('week_no',w)).data||[];$('compareBody').innerHTML=d.map(r=>{const f=map.get(r.flock_id);return f?'<tr><td>'+esc(f.strain||f.flock_name)+'</td><td>'+r.week_no+'</td><td>'+fmt(r.avg_hen_day_production)+'</td><td>'+fmt(r.avg_feed_per_hen_g)+'</td><td>'+fmt(r.avg_water_per_hen_ml)+'</td><td>'+fmt(r.avg_egg_weight_g)+'</td><td>'+fmt(r.feed_per_egg_mass,3)+'</td></tr>':''}).join('');}
async function boot(){const a=await checkUserAccess();if(!a?.authenticated){location.href='login.html';return}const s=typeof getCurrentSelection==='function'?getCurrentSelection()||{}:{};flockId=s.flockId||q.get('flock_id')||q.get('flockId');if(!flockId){$('subtitle').textContent='گله فعال پیدا نشد.';return}const f=await supabaseClient.from('flocks').select('*').eq('id',flockId).maybeSingle();if(f.error||!f.data)return;flock=f.data;if(String(flock.production_type).toLowerCase()!=='layer'){location.href='reports.html'+location.search;return}$('identity').innerHTML=cards([['گله',flock.flock_name],['سویه',flock.strain||'—'],['نوع','تخم‌گذار'],['استاندارد','Layer Standards V1']]);const [a1,a2,a3]=await Promise.all([supabaseClient.from('layer_daily_monitoring').select('*').eq('flock_id',flockId).order('record_date',{ascending:true}),supabaseClient.from('layer_weekly_monitoring').select('*').eq('flock_id',flockId).order('week_no',{ascending:true}),supabaseClient.from('layer_monthly_monitoring').select('*').eq('flock_id',flockId).order('jalali_year').order('jalali_month')]);daily=a1.data||[];weekly=a2.data||[];monthly=a3.data||[];$('day').innerHTML=daily.map(x=>'<option value="'+x.record_date+'">روز '+x.age_days+' • '+x.record_date+'</option>').join('');$('week').innerHTML=weekly.map(x=>'<option value="'+x.week_no+'">هفته '+x.week_no+' • سن '+x.age_start_days+' تا '+x.age_end_days+'</option>').join('');$('month').innerHTML=monthly.map(x=>'<option value="'+x.jalali_month_key+'">'+(x.jalali_month_label||x.jalali_month_key)+' • سن '+x.age_start_days+' تا '+x.age_end_days+'</option>').join('');$('compareWeek').innerHTML=weekly.map(x=>'<option value="'+x.week_no+'">هفته '+x.week_no+'</option>').join('');if(q.get('day'))$('day').value=q.get('day');if(q.get('week'))$('week').value=q.get('week');if(q.get('month'))$('month').value=q.get('month');renderDaily();renderWeekly();renderMonthly();renderOverall();renderCompare();if(q.get('period'))show(q.get('period'));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>show(b.dataset.period));$('day').onchange=renderDaily;$('week').onchange=()=>{renderWeekly();renderCompare()};$('month').onchange=renderMonthly;$('compareWeek').onchange=renderCompare);}
boot();})();
</script></body></html>
