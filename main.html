<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#123b2a"
    >

    <title>
        مدیریت گله طیور | مرکز تخصصی سلامت طیور آدینه
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            min-height: 100vh;
            background: #10291f;
            color: #ffffff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .app {
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* =========================
           CLEAN DASHBOARD BACKGROUND
           No logo/text image is used here.
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(circle at 12% 8%, rgba(91, 157, 123, 0.18), transparent 30%),
                radial-gradient(circle at 88% 82%, rgba(55, 120, 89, 0.14), transparent 32%),
                linear-gradient(145deg, #10291f 0%, #153b2b 48%, #0d241b 100%);

            z-index: -3;
        }

        .background-overlay {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(8, 27, 20, 0.18),
                    rgba(8, 27, 20, 0.34)
                );

            z-index: -2;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(12px + env(safe-area-inset-top))
                18px
                12px;

            background:
                rgba(10, 35, 26, 0.82);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-bottom:
                1px solid rgba(255,255,255,0.10);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 52px;
            height: 52px;

            object-fit: contain;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.95);

            padding: 3px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.25);
        }

        .brand-text h1 {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.5;
        }

        .brand-text p {
            font-size: 11px;
            opacity: 0.78;
            margin-top: 2px;
        }

        .menu-button {
            width: 46px;
            height: 46px;

            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 14px;

            background:
                rgba(255,255,255,0.09);

            color: white;

            font-size: 23px;

            cursor: pointer;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            width: min(1100px, 100%);
            margin: auto;

            padding:
                20px
                16px
                25px;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 18px;

            padding: 23px;

            margin-bottom: 20px;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    rgba(18,59,42,0.90),
                    rgba(18,59,42,0.70)
                );

            border:
                1px solid rgba(255,255,255,0.12);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.22);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .welcome-label {
            display: inline-block;

            font-size: 11px;
            font-weight: 700;

            color: #c8e8d8;

            margin-bottom: 8px;
        }

        .welcome h2 {
            font-size: 21px;
            line-height: 1.65;

            margin-bottom: 7px;
        }

        .welcome p {
            font-size: 13px;
            line-height: 1.9;

            color:
                rgba(255,255,255,0.78);
        }

        .week-box {
            min-width: 105px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 15px;

            border-radius: 19px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid rgba(255,255,255,0.12);
        }
