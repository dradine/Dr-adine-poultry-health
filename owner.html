<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>مدیریت کاربران | مرکز تخصصی سلامت طیور آدینه</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .owner-page{min-height:100vh;background:#f5f8f6;color:#193b31}
        .owner-header{background:#123b2a;color:#fff;padding:18px 16px;box-shadow:0 3px 18px rgba(0,0,0,.08)}
        .owner-header-inner{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
        .owner-header h1{margin:0;font-size:21px}.owner-header p{margin:5px 0 0;opacity:.78;font-size:12px}
        .owner-main{max-width:1250px;margin:auto;padding:22px 16px 45px}
        .owner-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
        .owner-stat{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.05);border:1px solid #e8efeb}
        .owner-stat span{display:block;color:#718078;font-size:12px;margin-bottom:7px}.owner-stat strong{font-size:24px;color:#173f35}
        .owner-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 25px rgba(0,0,0,.06);margin-bottom:16px}
        .owner-toolbar{display:grid;grid-template-columns:1.7fr 1fr 1fr auto;gap:10px;align-items:center}
        .owner-toolbar input,.owner-toolbar select{width:100%;box-sizing:border-box;border:1px solid #dfe7e3;border-radius:11px;padding:11px 12px;font:inherit;background:#fff;min-height:44px}
        .owner-table-wrap{width:100%;overflow:auto;margin-top:15px}.users-table{min-width:1120px}
        .users-table th{white-space:nowrap}.users-table td{vertical-align:top}.user-name{font-weight:800;color:#173f35}.user-sub{font-size:11px;color:#7a8782;margin-top:4px;line-height:1.7}.activity-line{max-width:230px;white-space:normal}
        .role-badge{display:inline-block;background:#edf4f0;border-radius:9px;padding:5px 8px;font-size:11px;font-weight:700}.access-code{font-family:monospace;font-size:18px;letter-spacing:3px;font-weight:900}.code-toggle{border:0;background:transparent;color:#1d6a52;cursor:pointer;font:inherit;font-size:11px;margin-right:7px}.muted{color:#a0aaa5}
        .action-details{background:#eaf2ef;color:#245443}.action-remove{background:#f9e5e5;color:#9a2727}.owner-lock{color:#17603f}
        .loading-cell,.empty-cell,.error-cell{text-align:center!important;padding:30px!important}.error-cell{color:#a52222}.owner-modal-backdrop{position:fixed;inset:0;background:rgba(10,28,22,.48);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}.owner-modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 20px 70px rgba(0,0,0,.25)}
        .owner-modal-head{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid #e7ece9}.owner-modal-head h3{margin:0}.owner-modal-head p{margin:5px 0 0;color:#748079;font-size:12px}.modal-close{border:0;background:#f0f3f1;border-radius:10px;width:38px;height:38px;font-size:25px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:18px 20px}.detail-grid>div{background:#f7f9f8;border-radius:11px;padding:11px}.detail-grid span{display:block;color:#7b8782;font-size:11px;margin-bottom:5px}.detail-grid strong{font-size:13px;word-break:break-word}.detail-wide{grid-column:1/-1}.modal-code{font-family:monospace;letter-spacing:3px;font-size:19px!important}.owner-modal-foot{padding:15px 20px;border-top:1px solid #e7ece9;display:flex;justify-content:flex-start}
        @media(max-width:800px){.owner-stats{grid-template-columns:repeat(2,1fr)}.owner-toolbar{grid-template-columns:1fr 1fr}.owner-toolbar .refresh{grid-column:1/-1}.detail-grid{grid-template-columns:1fr}.detail-wide{grid-column:auto}}
        @media(max-width:480px){.owner-main{padding:14px 10px 35px}.owner-stats{gap:8px}.owner-stat{padding:12px}.owner-stat strong{font-size:20px}.owner-toolbar{grid-template-columns:1fr}.owner-toolbar .refresh{grid-column:auto}.owner-header h1{font-size:18px}}
    </style>
</head>
<body class="owner-page">
<header class="owner-header">
    <div class="owner-header-inner">
        <div><h1>مدیریت کاربران</h1><p>مرکز مدیریت حساب‌ها، نقش‌ها و اطلاعات حرفه‌ای</p></div>
        <button id="logoutButton" type="button" class="action-button action-block">خروج</button>
    </div>
</header>
<main class="owner-main">
    <section class="owner-stats">
        <div class="owner-stat"><span>کل کاربران</span><strong id="statTotal">۰</strong></div>
        <div class="owner-stat"><span>کاربران فعال</span><strong id="statActive">۰</strong></div>
        <div class="owner-stat"><span>متخصصان</span><strong id="statSpecialists">۰</strong></div>
        <div class="owner-stat"><span>در انتظار تأیید</span><strong id="statPending">۰</strong></div>
    </section>
    <section class="owner-card">
        <div id="message" class="message hidden"></div>
        <div class="owner-toolbar">
            <input id="userSearch" type="search" placeholder="جستجو: نام، ایمیل، تلفن، کد حرفه‌ای..." autocomplete="off">
            <select id="roleFilter"><option value="">همه نوع‌های کاربری</option><option value="veterinarian">دامپزشک</option><option value="technical_veterinarian">دامپزشک مسئول فنی</option><option value="farm_operator">بهره‌بردار واحد طیور</option><option value="farm_manager">مدیر واحد طیور</option><option value="diagnostic_lab">آزمایشگاه تشخیص دامپزشکی</option><option value="poultry_technical_expert">کارشناس فنی طیور</option><option value="company_manager">مدیر / نماینده مجموعه</option><option value="other">سایر</option></select>
            <select id="statusFilter"><option value="">همه وضعیت‌ها</option><option value="active">فعال</option><option value="pending">در انتظار تأیید</option><option value="suspended">موقتاً غیرفعال</option><option value="blocked">مسدود</option><option value="removed">بایگانی</option></select>
            <button id="refreshUsers" class="action-button action-active refresh" type="button">↻ بروزرسانی</button>
        </div>
        <div class="owner-table-wrap">
            <table class="users-table">
                <thead><tr><th>کاربر</th><th>تماس</th><th>نوع کاربری و فعالیت</th><th>کد حرفه‌ای</th><th>وضعیت</th><th>ثبت‌نام</th><th>آخرین فعالیت</th><th>عملیات</th></tr></thead>
                <tbody id="usersTableBody"><tr><td colspan="8" class="loading-cell">در حال بارگذاری...</td></tr></tbody>
            </table>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="owner.js"></script>
</body>
</html>
