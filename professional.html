<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل حرفه‌ای | آدینه</title><link rel="stylesheet" href="app.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.farm-card{border:1px solid #e4e9e6;border-radius:16px;padding:16px;background:#fff}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef5f1}.pending{background:#fff4d8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.alert{padding:12px;border-radius:12px;background:#fff4d8;margin-bottom:14px}.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}</style></head><body><header class="topbar"><div class="brand"><img src="IMG_4309.png" alt="آدینه"><span>پنل حرفه‌ای</span></div><button class="btn btn-secondary" onclick="AdineAuth.signOut()">خروج</button></header><main class="page"><div class="container"><h1 class="page-title" id="title">پنل حرفه‌ای</h1><p id="sub" class="page-description"></p><div id="message"></div><section class="card"><h2 class="card-title">درخواست‌های جدید</h2><div id="pending"></div></section><section class="card"><h2 class="card-title">فارم‌های تحت نظارت</h2><div id="farms" class="grid"></div></section><section id="labPanel" class="card" style="display:none"><h2 class="card-title">ثبت نتیجه آزمایش</h2><form id="labForm"><div class="lab-grid"><select id="labFarm" required></select><input id="labTitle" placeholder="عنوان گزارش" required><input id="labDate" type="date"><input id="labDisease" placeholder="بیماری / عامل"><input id="labResult" placeholder="نتیجه"><input id="labName" placeholder="نام آزمایشگاه"><input id="labFile" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"></div><textarea id="labNotes" placeholder="توضیحات" style="width:100%;margin-top:10px"></textarea><button class="btn btn-primary" style="margin-top:10px">ثبت نتیجه</button></form><div id="labList" style="margin-top:16px"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script><script src="access-control.js"></script><script src="professional.js"></script></body></html>
