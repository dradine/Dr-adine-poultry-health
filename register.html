<body class="auth-page">

    <main class="auth-wrapper">

        <section class="auth-card">

            <div class="auth-logo">

                <img
                    src="IMG_4309.png"
                    alt="مرکز تخصصی سلامت طیور آدینه"
                >

            </div>

            <h1>
                ایجاد حساب کاربری
            </h1>

            <p class="auth-subtitle">
                مرکز تخصصی سلامت طیور آدینه
            </p>

            <div
                id="message"
                class="message hidden"
            ></div>

            

            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        نام و نام خانوادگی
                    </label>

                    <input
                        id="fullName"
                        type="text"
                        autocomplete="name"
                        placeholder="نام و نام خانوادگی"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        ایمیل
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        placeholder="ایمیل"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="phone">شماره تماس</label>
                    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="مثلاً ۰۹۱۲..." required>

                </div>

                <div class="form-group">
                    <label for="userType">نوع کاربری خود را انتخاب کنید</label>
                    <select id="userType" required>
                        <option value="">انتخاب کنید</option>
                        <option value="veterinarian">⚕ دامپزشک</option>
                        <option value="technical_veterinarian">✦ دامپزشک مسئول فنی</option>
                        <option value="farm_operator">◈ بهره‌بردار واحد طیور</option>
                        <option value="farm_manager">▣ مدیر واحد طیور</option>
                        <option value="diagnostic_lab">⬡ آزمایشگاه تشخیص دامپزشکی</option>
                        <option value="poultry_technical_expert">◌ کارشناس فنی طیور</option>
                        <option value="company_manager">⌘ مدیر / نماینده مجموعه</option>
                        <option value="other">• سایر</option>
                    </select>
                </div>

                <div id="roleSpecific" class="form-group hidden">
                    <label id="roleSpecificLabel" for="activityTypes">نوع فعالیت / واحد</label>
                    <div id="activityTypes" class="checkbox-grid"></div>
                </div>

                <div class="form-group">

                    <label for="password">
                        رمز عبور
                    </label>

                    <div class="password-field">

                        <input
                            id="password"
                            type="password"
                            autocomplete="new-password"
                            placeholder="حداقل ۸ کاراکتر"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            نمایش
                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        تکرار رمز عبور
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="تکرار رمز عبور"
                        minlength="8"
                        required
                    >

                </div>

                <div class="legal-consent">
                    <label class="legal-consent-label">
                        <input id="legalConsent" type="checkbox" required>
                        <span>
                            با ایجاد حساب، شرایط استفاده و حقوق مالکیت فکری سامانه را مطالعه کرده و می‌پذیرم.
                            <a href="settings.html#legal-rights" target="_blank" rel="noopener">مشاهده متن کامل</a>
                        </span>
                    </label>
                </div>

                <button
                    type="submit"
                    id="registerButton"
                    class="primary-button"
                >
                    ثبت‌نام
                </button>

            </form>

            <div class="auth-links">

                <a href="login.html">
                    قبلاً ثبت‌نام کرده‌ام؛ ورود
                </a>

            </div>

        </section>

    </main>

            <div id="registrationSuccessModal" class="registration-modal" hidden role="dialog" aria-modal="true" aria-labelledby="registrationSuccessTitle">
                <div class="registration-modal-card">
                    <div class="registration-modal-icon" aria-hidden="true">✓</div>
                    <h2 id="registrationSuccessTitle" class="registration-modal-title">ثبت‌نام با موفقیت انجام شد</h2>
                    <p id="registrationSuccessText" class="registration-modal-text"></p>
                    <button type="button" id="registrationSuccessOk" class="registration-modal-button">تأیید</button>
                </div>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="auth.js"></script>

    <script src="register.js?v=20260927.2"></script>

</body>
