
<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#123b2a"
    >

    <title>
        ثبت‌نام | مرکز تخصصی سلامت طیور آدینه
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
      .checkbox-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:8px}.role-option{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #dfe6e2;border-radius:10px;background:#fafcfb}.hidden{display:none!important}
    </style>

</head>

<body class="auth-page">

    <main class="auth-wrapper">

        <section class="auth-card">

            <div class="auth-logo">

                <img
                    src="logo.png"
                    alt="مرکز تخصصی سلامت طیور آدینه"
                >

            </div>

            <h1>
                ایجاد حساب کاربری
            </h1>

            <p class="auth-subtitle">
                مرکز تخصصی سلامت طیور آدینه
            </p>

            <div
                id="message"
                class="message hidden"
            ></div>

            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        نام و نام خانوادگی
                    </label>

                    <input
                        id="fullName"
                        type="text"
                        autocomplete="name"
                        placeholder="نام و نام خانوادگی"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        ایمیل
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        placeholder="ایمیل"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="phone">شماره تماس</label>
                    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="مثلاً ۰۹۱۲..." required>

                </div>

                <div class="form-group">
                    <label for="userType">نوع کاربری خود را انتخاب کنید</label>
                    <select id="userType" required>
                        <option value="">انتخاب کنید</option>
                        <option value="veterinarian">🩺 دامپزشک</option>
                        <option value="technical_veterinarian">🩺 دامپزشک مسئول فنی</option>
                        <option value="poultry_operator">🐔 بهره‌بردار واحد طیور</option>
                        <option value="poultry_manager">👨‍💼 مدیر واحد طیور</option>
                        <option value="veterinary_lab">🔬 آزمایشگاه تشخیص دامپزشکی</option>
                        <option value="poultry_technical_expert">📊 کارشناس فنی طیور</option>
                        <option value="organization_manager">🏢 مدیر / نماینده مجموعه</option>
                        <option value="other">سایر</option>
                    </select>
                </div>

                <div id="roleSpecific" class="form-group hidden">
                    <label id="roleSpecificLabel" for="activityTypes">نوع فعالیت / واحد</label>
                    <div id="activityTypes" class="checkbox-grid"></div>
                </div>

                <div class="form-group">

                    <label for="password">
                        رمز عبور
                    </label>

                    <div class="password-field">

                        <input
                            id="password"
                            type="password"
                            autocomplete="new-password"
                            placeholder="حداقل ۸ کاراکتر"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            نمایش
                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        تکرار رمز عبور
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="تکرار رمز عبور"
                        minlength="8"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="registerButton"
                    class="primary-button"
                >
                    ثبت‌نام
                </button>

            </form>

            <div class="auth-links">

                <a href="login.html">
                    قبلاً ثبت‌نام کرده‌ام؛ ورود
                </a>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="auth.js"></script>

    <script src="register.js"></script>

</body>

</html>
