<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش عملکرد گله</title><link rel="stylesheet" href="style.css"><style>body{margin:0;padding:0 0 78px;background:#f4f7f6;font-family:Tahoma,Arial,sans-serif}.frame{position:fixed;inset:0 0 76px 0;border:0;width:100%;height:calc(100% - 76px);background:#f4f7f6}.bottom-navigation{position:fixed;z-index:9999;right:0;left:0;bottom:0;height:72px;display:flex;align-items:stretch;justify-content:center;background:rgba(255,255,255,.98);border-top:1px solid #dfe6e2;box-shadow:0 -5px 20px rgba(20,45,38,.10);padding:5px max(10px,env(safe-area-inset-left)) calc(5px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right));backdrop-filter:blur(10px)}.nav-item{flex:1;max-width:150px;border:0;background:transparent;color:#718079;font:inherit;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:12px}.nav-item.active{color:#173f35;background:#edf4f1}.icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(max-width:600px){.bottom-navigation{height:68px}.frame{inset:0 0 72px 0;height:calc(100% - 72px)}.nav-item{font-size:9px}}</style></head><body><iframe id="reportFrame" class="frame" title="گزارش عملکرد گله"></iframe><nav class="bottom-navigation" aria-label="ناوبری اصلی"><button class="nav-item" onclick="location.href='Dashboard.html'"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6"></path></svg></span><span>خانه</span></button><button class="nav-item" onclick="location.href='flocks.html'"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"></path><path d="M7 21v-7h10v7"></path><path d="M9 10h6"></path><path d="M12 7v3"></path></svg></span><span>فارم‌ها</span></button><button class="nav-item" onclick="goWeekly()"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h17"></path><path d="M6.5 15l4-4 3 2 5-6"></path></svg></span><span>ثبت هفتگی</span></button><button class="nav-item active"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"></path><path d="M15 3v5h5"></path><path d="M9 12h6"></path><path d="M9 16h6"></path></svg></span><span>گزارش‌ها</span></button></nav><script>const p=new URLSearchParams(location.search);const id=p.get('flock_id')||p.get('flockId');const wk=p.get('week_number')||p.get('week');if(!id){document.body.innerHTML='<div style="padding:30px;font-family:Tahoma;text-align:center">گله انتخاب‌شده از ثبت هفتگی دریافت نشد.</div>';throw new Error('missing flock_id')}const q=new URLSearchParams({flock_id:id});if(wk)q.set('week_number',wk);document.getElementById('reportFrame').src='reports-universal-v2.html?'+q.toString();function goWeekly(){location.href='weekly.html?flockId='+encodeURIComponent(id)+(wk?'&week_number='+encodeURIComponent(wk):'')}</script></body></html>
