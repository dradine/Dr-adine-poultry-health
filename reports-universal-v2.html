<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش تخصصی گله</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="report-standard-source-registry-v1.js"></script><script src="report-engine-broiler-v1.js"></script><script src="report-engine-pullet-v1.js"></script><script src="report-engine-layer-v1.js"></script><script src="report-engine-breeder-v1.js"></script><style>body{background:#f5f7fa;font-family:Tahoma,Arial,sans-serif;color:#172033}.wrap{width:min(1500px,95%);margin:18px auto 60px}.card,.section{background:#fff;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 4px 18px rgba(0,0,0,.05)}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0 0 6px}.muted,.note{color:#667085;font-size:12px;line-height:1.9}.controls{display:grid;grid-template-columns:2fr 1fr auto;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:800}.field select,.btn{min-height:44px;border:1px solid #d7dde5;border-radius:10px;padding:8px 11px;font:inherit}.btn{cursor:pointer;font-weight:900;background:#173f35;color:#fff}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.tabs.report{grid-template-columns:1fr 1fr}.tab{background:#fff;border:1px solid #dfe7e3;border-radius:12px;padding:12px;font:inherit;font-weight:900;cursor:pointer}.tab.active{background:#173f35;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#f8faf9;border:1px solid #e3ebe7;border-radius:12px;padding:12px}.kpi b{font-size:11px;color:#667085;display:block}.kpi strong{display:block;font-size:20px;margin-top:5px}.kpi small{display:block;color:#667085;margin-top:4px;line-height:1.7}.compare,.source{margin-top:12px;padding:12px;border-radius:11px;background:#f8fafc;border:1px solid #e6ebef;line-height:2;font-size:12px}.chart{height:320px;position:relative;margin-top:12px}.table-wrap{overflow:auto}.table-wrap table{width:100%;min-width:1200px;border-collapse:collapse}.table-wrap th,.table-wrap td{padding:8px;border-bottom:1px solid #e5e9ed;text-align:center;white-space:nowrap}.table-wrap th{background:#173f35;color:#fff}.error{padding:12px;border-radius:10px;background:#fff4f4;border:1px solid #efcaca;color:#8b1e1e}@media(max-width:800px){.controls,.grid,.tabs{grid-template-columns:1fr 1fr}}@media(max-width:550px){.controls,.grid,.tabs,.tabs.report{grid-template-columns:1fr}.chart{height:270px}}@media print{.controls,.tabs,.btn{display:none}.section{box-shadow:none;break-inside:avoid}}</style></head><body><main class="wrap"><header class="card head"><div><h1>گزارش تخصصی گله</h1><div class="muted">چهار موتور مستقل و تخصصی — گزارش پایش هفتگی + گزارش جامع/تجمعی</div></div><button class="btn" onclick="window.print()">چاپ</button></header><section class="card"><div class="controls"><div class="field"><label>گله</label><select id="flock"></select></div><div class="field"><label>هفته</label><select id="week"></select></div><button class="btn" id="refresh">محاسبه</button></div><div id="meta" class="note"></div></section><nav class="tabs"><button class="tab active" data-type="broiler">گوشتی</button><button class="tab" data-type="pullet">پولت</button><button class="tab" data-type="layer">تخم‌گذار</button><button class="tab" data-type="breeder">مادر</button></nav><nav class="tabs report"><button class="tab active" data-mode="weekly">گزارش هفتگی</button><button class="tab" data-mode="comprehensive">گزارش جامع/تجمعی</button></nav><section id="root"></section></main><script>(async()=>{const $=x=>document.getElementById(x),N=x=>{const n=Number(x);return Number.isFinite(n)?n:null},F=(x,d=1,u='')=>N(x)==null?'—':N(x).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d})+u;const T={broiler:'گوشتی',pullet:'پولت',layer:'تخم‌گذار',breeder:'مادر'},E={broiler:()=>BROILER_REPORT_ENGINE,pullet:()=>PULLET_REPORT_ENGINE,layer:()=>LAYER_REPORT_ENGINE,breeder:()=>BREEDER_REPORT_ENGINE};let type='broiler',mode='weekly',allFlocks=[],flock=null,rows=[],built=[],charts=[];const ptype=x=>window.normalizePoultryProductionType?window.normalizePoultryProductionType(x):x;function std(age){if(!flock||!window.resolvePoultryStandard)return null;return window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,ageDays:age})}function kill(){charts.forEach(x=>x.destroy());charts=[]}function make(id,labels,datasets){const c=$(id);if(!c||!window.Chart)return;charts.push(new Chart(c,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:false}}}}))}function metric(r,k){const pm=r.production_metrics||{};for(const x of k){const v=N(r[x]??pm[x]);if(v!=null)return v}return null}function kpis(r,extra){const s=std(N(r.age_days));const base=[['سن',F(r.age_days,0,' روز'),''],['وزن',F(r.average_weight_g,1,' گرم'),s?.weight!=null?'رسمی: '+F(s.weight,1,' گرم'):''],['CV',F(r.cv_percent,2,'%'),''],['یکنواختی ±10',F(r.uniformity_10_percent,1,'%'),''],['دان',F(r.feed_total_kg,1,' کیلوگرم'),''],['آب',F(r.water_total_liter,1,' لیتر'),''],['تلفات',F(r.mortality_count,0,' قطعه'),''],...extra];return base.map(a=>`<div class="kpi"><b>${a[0]}</b><strong>${a[1]}</strong><small>${a[2]}</small></div>`).join('')}async function bench(metricName,age){const f=flock;if(!f||age==null)return null;const {data,error}=await supabaseClient.from('flocks').select('id').eq('production_type',f.production_type).eq('genetics',f.genetics).eq('strain',f.strain);if(error||!data||data.length<4)return null;const ids=data.map(x=>x.id);const {data:w}=await supabaseClient.from('weekly_records').select(metricName).in('flock_id',ids).eq('age_days',age);if(!w)return null;const a=w.map(x=>N(x[metricName])).filter(x=>x!=null).sort((a,b)=>a-b);if(a.length<4)return null;const m=(a.length-1)/2;return a.length%2?a[Math.floor(m)]:(a[Math.floor(m)]+a[Math.ceil(m)])/2}function renderWeekly(){kill();const idx=rows.findIndex(r=>N(r.week_number)===N($('week').value));const r=idx>=0?rows[idx]:rows.at(-1);if(!r){$('root').innerHTML='<div class="section note">برای این گله رکورد هفتگی وجود ندارد.</div>';return}const s=std(N(r.age_days)),b=built[idx]||{};let extra=[];if(type==='broiler'){extra=[['FCR هفتگی',F(b.weeklyFcr??r.fcr,3),s?.fcr!=null?'رسمی: '+F(s.fcr,3):''],['FCR تجمعی',F(b.cumulativeFcr??r.cumulative_fcr,3),'']]}else if(type==='layer'){extra=[['تولید تخم',F(metric(r,['hen_day_production','henDayProduction','egg_production_percent']),1,'%'),''],['وزن تخم',F(metric(r,['egg_weight_g','eggWeightG']),1,' گرم'),''],['Egg Mass',F(metric(r,['egg_mass_g','eggMassG']),1,' گرم'),''],['FCR',F(metric(r,['egg_mass_fcr','eggMassFcr','fcr']),3),s?.fcr!=null?'رسمی: '+F(s.fcr,3):'']]}else if(type==='breeder'){extra=[['تولید روزانه',F(metric(r,['hen_day_production','henDayProduction']),1,'%'),''],['H.H.',F(metric(r,['hen_housed_production','henHousedProduction']),1,'%'),''],['وزن تخم',F(metric(r,['egg_weight_g','eggWeightG']),1,' گرم'),''],['باروری',F(metric(r,['fertility_percent','fertilityPercent']),1,'%'),''],['هچ‌پذیری',F(metric(r,['hatchability_percent','hatchabilityPercent']),1,'%'),'']]}else extra=[['دان/پرنده',F(r.feed_per_bird_g,1,' گرم'),'']];const rs=rows.filter(x=>N(x.week_number)<=N(r.week_number));$('root').innerHTML=`<section class="section"><h2>گزارش پایش هفتگی — ${T[type]} — هفته ${F(r.week_number,0)}</h2><div class="grid">${kpis(r,extra)}</div><div class="compare">${type==='broiler'?`FCR هفتگی واقعی: ${F(b.weeklyFcr??r.fcr,3)} | رسمی: ${F(s?.fcr,3)} | اختلاف: ${b.weeklyFcr!=null&&s?.fcr!=null?F(b.weeklyFcr-s.fcr,3):'—'}<br>FCR تجمعی واقعی: ${F(b.cumulativeFcr??r.cumulative_fcr,3)}`:'استاندارد رسمی فقط در صورت تطابق واقعی نوع تولید/ژنتیک/سویه/سن نمایش داده می‌شود؛ مقدار جایگزین ساختگی تولید نمی‌شود.'}</div></section><section class="section"><div class="chart"><canvas id="w1"></canvas></div><div class="chart"><canvas id="w2"></canvas></div></section>`;const labels=rs.map(x=>'هفته '+N(x.week_number));make('w1',labels,[{label:'وزن واقعی',data:rs.map(x=>N(x.average_weight_g))},{label:'وزن رسمی',data:rs.map(x=>std(N(x.age_days))?.weight??null)}]);if(type==='broiler')make('w2',labels,[{label:'FCR هفتگی واقعی',data:rs.map(x=>built[rows.indexOf(x)]?.weeklyFcr??N(x.fcr))},{label:'FCR رسمی',data:rs.map(x=>std(N(x.age_days))?.fcr??null)},{label:'FCR تجمعی واقعی',data:rs.map(x=>built[rows.indexOf(x)]?.cumulativeFcr??N(x.cumulative_fcr))}]);else make('w2',labels,[{label:'CV',data:rs.map(x=>N(x.cv_percent))},{label:'یکنواختی ±10%',data:rs.map(x=>N(x.uniformity_10_percent))}]);}async function renderComp(){kill();const rs=[...rows],last=rs.at(-1);if(!last)return;const s=std(N(last.age_days)),b=built.at(-1)||{},bw=await bench('average_weight_g',N(last.age_days)),bf=type==='broiler'?await bench('cumulative_fcr',N(last.age_days)):null;const cf=type==='broiler'?(b.cumulativeFcr??last.cumulative_fcr):null;$('root').innerHTML=`<section class="section"><h2>گزارش جامع و تجمعی — ${T[type]}</h2><div class="grid">${kpis(last,type==='broiler'?[['FCR تجمعی',F(cf,3),s?.fcr!=null?'رسمی: '+F(s.fcr,3):''],['Benchmark وزن',F(bw,1,' گرم'),'میانه جامعه مشابه'],['Benchmark FCR',F(bf,3),'میانه جامعه مشابه']]:[['Benchmark وزن',F(bw,1,' گرم'),'میانه جامعه مشابه'],['رکوردهای واقعی',F(rs.length,0),'']])}</div><div class="compare">وزن فعلی: ${F(last.average_weight_g,1,' گرم')} | رسمی: ${F(s?.weight,1,' گرم')} | اختلاف: ${last.average_weight_g!=null&&s?.weight!=null?F(N(last.average_weight_g)-s.weight,1,' گرم'):'—'}<br>Benchmark مدیریتی: ${bw==null?'داده کافی نیست':F(bw,1,' گرم')}</div></section><section class="section"><div class="chart"><canvas id="c1"></canvas></div>${type==='broiler'?'<div class="chart"><canvas id="c2"></canvas></div>':''}</section><section class="section"><div class="table-wrap"><table><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>استاندارد وزن</th><th>CV</th><th>یکنواختی</th><th>دان</th><th>آب</th><th>تلفات</th>${type==='broiler'?'<th>FCR هفتگی</th><th>FCR تجمعی</th>':''}</tr></thead><tbody>${rs.map((r,i)=>{const x=built[i]||{};return`<tr><td>${F(r.week_number,0)}</td><td>${F(r.age_days,0)}</td><td>${F(r.average_weight_g,1)}</td><td>${F(std(N(r.age_days))?.weight,1)}</td><td>${F(r.cv_percent,2)}%</td><td>${F(r.uniformity_10_percent,1)}%</td><td>${F(r.feed_total_kg,1)}</td><td>${F(r.water_total_liter,1)}</td><td>${F(r.mortality_count,0)}</td>${type==='broiler'?`<td>${F(x.weeklyFcr??r.fcr,3)}</td><td>${F(x.cumulativeFcr??r.cumulative_fcr,3)}</td>`:''}</tr>`}).join('')}</tbody></table></div></section>`;const labels=rs.map(x=>'هفته '+N(x.week_number));make('c1',labels,[{label:'وزن واقعی',data:rs.map(x=>N(x.average_weight_g))},{label:'وزن رسمی',data:rs.map(x=>std(N(x.age_days))?.weight??null)},{label:'Benchmark وزن',data:bw==null?rs.map(()=>null):rs.map(()=>bw)}]);if(type==='broiler')make('c2',labels,[{label:'FCR تجمعی واقعی',data:rs.map((x,i)=>built[i]?.cumulativeFcr??N(x.cumulative_fcr))},{label:'FCR رسمی',data:rs.map(x=>std(N(x.age_days))?.fcr??null)},{label:'Benchmark مدیریتی',data:bf==null?rs.map(()=>null):rs.map(()=>bf)}]);}async function loadType(){kill();const {data,error}=await supabaseClient.from('flocks').select('*').order('created_at',{ascending:false});if(error){$('root').innerHTML=`<div class="error">${error.message}</div>`;return}allFlocks=Array.isArray(data)?data:[];const list=allFlocks.filter(f=>ptype(f.production_type)===type);$('flock').innerHTML=list.map(f=>`<option value="${f.id}">${f.flock_name||'بدون نام'} — ${f.genetics||'بدون ژنتیک'} / ${f.strain||'بدون سویه'}</option>`).join('')||'<option value="">گله‌ای وجود ندارد</option>';flock=list[0]||null;await loadFlock()}async function loadFlock(){if(!flock){rows=[];built=[];$('week').innerHTML='<option>—</option>';$('meta').textContent='';$('root').innerHTML='<div class="section note">گله‌ای برای این دسته وجود ندارد.</div>';return}const {data,error}=await supabaseClient.from('weekly_records').select('*').eq('flock_id',flock.id).order('week_number',{ascending:true});if(error){$('root').innerHTML=`<div class="error">${error.message}</div>`;return}rows=Array.isArray(data)?data:[];const e=E[type](),st=age=>std(age);built=e&&e.build?e.build(flock,rows,st):rows;$('week').innerHTML=rows.map(r=>`<option value="${N(r.week_number)}">هفته ${F(r.week_number,0)} — ${F(r.age_days,0)} روز</option>`).join('')||'<option value="">رکوردی نیست</option>';$('meta').textContent=`${T[type]} | ${flock.flock_name||''} | ${flock.genetics||'ژنتیک ثبت نشده'} | ${flock.strain||'سویه ثبت نشده'} | ${rows.length} رکورد واقعی`;mode==='weekly'?renderWeekly():renderComp()}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;await loadType()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;flock&&loadFlock()});$('flock').onchange=async()=>{flock=allFlocks.find(x=>x.id===$('flock').value)||null;await loadFlock()};$('week').onchange=()=>{if(flock&&mode==='weekly')renderWeekly()};$('refresh').onclick=()=>flock&&(mode==='weekly'?renderWeekly():renderComp());await loadType()})()</script></body></html>
