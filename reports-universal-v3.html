<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش تخصصی گله</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="report-engine-broiler-v1.js"></script><script src="report-engine-pullet-v1.js"></script><script src="report-engine-layer-v1.js"></script><script src="report-engine-breeder-v1.js"></script><script src="report-benchmark-runtime-v1.js"></script><style>body{margin:0;background:#f5f7fa;font-family:Tahoma,Arial;color:#172033}.wrap{max-width:1500px;width:95%;margin:18px auto}.box{background:#fff;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0000000b}.controls,.grid,.tabs{display:grid;gap:8px}.controls{grid-template-columns:2fr 1fr auto}.grid{grid-template-columns:repeat(4,1fr)}.tabs{grid-template-columns:repeat(4,1fr)}.tabs.mode{grid-template-columns:1fr 1fr}.tab,.btn,select{padding:11px;border:1px solid #d7dde5;border-radius:10px;font:inherit}.tab,.btn{cursor:pointer;font-weight:bold}.active,.btn{background:#173f35;color:white}.k{background:#f8faf9;border:1px solid #e3ebe7;border-radius:11px;padding:11px}.k b,.k small{display:block;color:#667085;font-size:11px}.k strong{display:block;font-size:19px;margin:4px 0}.compare{padding:12px;background:#f8fafc;border-radius:10px;line-height:2;font-size:12px}.chart{height:300px;margin:15px 0}.table{overflow:auto}.table table{border-collapse:collapse;width:100%;min-width:1100px}.table th,.table td{padding:7px;border-bottom:1px solid #e5e7eb;text-align:center}.table th{background:#173f35;color:#fff}.err{padding:12px;background:#fff1f1;color:#8b1e1e;border-radius:10px}@media(max-width:800px){.controls,.grid,.tabs{grid-template-columns:1fr 1fr}}@media(max-width:520px){.controls,.grid,.tabs,.tabs.mode{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="box"><h1>گزارش تخصصی گله</h1><div>گزارش هفتگی و گزارش جامع/تجمعی — چهار موتور مستقل</div></section><section class="box"><div class="controls"><select id="flock"></select><select id="week"></select><button class="btn" id="calc">محاسبه</button></div><div id="meta"></div></section><nav class="tabs"><button class="tab active" data-t="broiler">گوشتی</button><button class="tab" data-t="pullet">پولت</button><button class="tab" data-t="layer">تخم‌گذار</button><button class="tab" data-t="breeder">مادر</button></nav><nav class="tabs mode"><button class="tab active" data-m="weekly">گزارش هفتگی</button><button class="tab" data-m="all">گزارش جامع/تجمعی</button></nav><section id="root"></section></main><script>(async()=>{const $=id=>document.getElementById(id),N=x=>{x=Number(x);return Number.isFinite(x)?x:null},F=(x,d=1,u='')=>N(x)==null?'—':N(x).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d})+u,T={broiler:'گوشتی',pullet:'پولت',layer:'تخم‌گذار',breeder:'مادر'},E={broiler:()=>BROILER_REPORT_ENGINE,pullet:()=>PULLET_REPORT_ENGINE,layer:()=>LAYER_REPORT_ENGINE,breeder:()=>BREEDER_REPORT_ENGINE};let type='broiler',mode='weekly',fs=[],f=null,rs=[],out=[],cs=[];const p=x=>window.normalizePoultryProductionType?window.normalizePoultryProductionType(x):x;function official(age,metric){if(!f||!window.resolvePoultryStandard)return null;const s=window.resolvePoultryStandard({productionType:f.production_type,genetics:f.genetics,strain:f.strain,variant:f.variant,ageDays:age});return metric==='body_weight'?s?.weight:metric==='fcr'?s?.fcr:null}async function bm(age,metric){return window.AdineBenchmark.resolve({productionType:f.production_type,genetics:f.genetics,strain:f.strain,variant:f.variant,ageDays:age,metric,official:official(age,metric)})}function kill(){cs.forEach(x=>x.destroy());cs=[]}function chart(id,labels,datasets){const e=$(id);if(!e)return;cs.push(new Chart(e,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}}}}))}function val(r,keys){for(const k of keys){const x=N(r[k]??(r.production_metrics||{})[k]);if(x!=null)return x}return null}function card(a){return a.map(x=>`<div class="k"><b>${x[0]}</b><strong>${x[1]}</strong><small>${x[2]||''}</small></div>`).join('')}async function weekly(){kill();const i=Math.max(0,rs.findIndex(x=>N(x.week_number)===N($('week').value))),r=rs[i];if(!r){$('root').innerHTML='<div class="box">رکورد هفتگی وجود ندارد.</div>';return}const age=N(r.age_days),bw=await bm(age,'body_weight'),bf=type==='broiler'?await bm(age,'fcr'):null,b=out[i]||{};const extra=type==='broiler'?[['FCR هفتگی',F(b.weeklyFcr??r.fcr,3),`مرجع: ${bf?F(bf.value,3):'—'} (${bf?.source==='official'?'رسمی':'مدیریتی'})`],['FCR تجمعی',F(b.cumulativeFcr??r.cumulative_fcr,3),'محاسبه‌شده از سوابق واقعی گله']]:type==='layer'?[['تولید تخم',F(val(r,['hen_day_production','henDayProduction','egg_production_percent']),1,'%'),''],['وزن تخم',F(val(r,['egg_weight_g','eggWeightG']),1,' گرم'),''],['Egg Mass',F(val(r,['egg_mass_g','eggMassG']),1,' گرم'),''],['FCR',F(val(r,['egg_mass_fcr','eggMassFcr','fcr']),3),'']]:type==='breeder'?[['تولید روزانه',F(val(r,['hen_day_production','henDayProduction']),1,'%'),''],['H.H.',F(val(r,['hen_housed_production','henHousedProduction']),1,'%'),''],['باروری',F(val(r,['fertility_percent','fertilityPercent']),1,'%'),''],['هچ‌پذیری',F(val(r,['hatchability_percent','hatchabilityPercent']),1,'%'),'']]:[['دان/پرنده',F(r.feed_per_bird_g,1,' گرم'),'']];$('root').innerHTML=`<section class="box"><h2>گزارش هفتگی — ${T[type]} — هفته ${F(r.week_number,0)}</h2><div class="grid">${card([['سن',F(age,0,' روز'),''],['وزن',F(r.average_weight_g,1,' گرم'),`${bw?.source==='official'?'رسمی':'مدیریتی'}: ${F(bw?.value,1,' گرم')}`],['CV',F(r.cv_percent,2,'%'),''],['یکنواختی ±10%',F(r.uniformity_10_percent,1,'%'),''],['دان',F(r.feed_total_kg,1,' کیلوگرم'),''],['آب',F(r.water_total_liter,1,' لیتر'),''],['تلفات',F(r.mortality_count,0,' قطعه'),''],...extra])}</div><div class="compare">${comparison(r,bw,bf)}</div></section><section class="box"><div class="chart"><canvas id="a"></canvas></div><div class="chart"><canvas id="b"></canvas></div></section>`;const q=rs.filter(x=>N(x.week_number)<=N(r.week_number)),lab=q.map(x=>'هفته '+N(x.week_number));chart('a',lab,[{label:'وزن واقعی',data:q.map(x=>N(x.average_weight_g))},{label:'مرجع وزن',data:q.map(x=>{const z=official(N(x.age_days),'body_weight');return z??null})}]);if(type==='broiler')chart('b',lab,[{label:'FCR هفتگی',data:q.map(x=>out[rs.indexOf(x)]?.weeklyFcr??N(x.fcr))},{label:'FCR تجمعی',data:q.map(x=>out[rs.indexOf(x)]?.cumulativeFcr??N(x.cumulative_fcr))},{label:'مرجع FCR',data:q.map(x=>official(N(x.age_days),'fcr'))}]);else chart('b',lab,[{label:'CV',data:q.map(x=>N(x.cv_percent))},{label:'یکنواختی ±10%',data:q.map(x=>N(x.uniformity_10_percent))}])}function comparison(r,bw,bf){let s=`وزن واقعی: ${F(r.average_weight_g,1,' گرم')} | مرجع: ${F(bw?.value,1,' گرم')} | منبع: ${bw?.source==='official'?'استاندارد رسمی':'استاندارد مدیریتی'} | اختلاف: ${r.average_weight_g!=null&&bw?.value!=null?F(N(r.average_weight_g)-bw.value,1,' گرم'):'—'}`;if(type==='broiler')s+=`<br>FCR هفتگی: ${F(out[rs.indexOf(r)]?.weeklyFcr??r.fcr,3)} | مرجع: ${F(bf?.value,3)} | اختلاف: ${out[rs.indexOf(r)]?.weeklyFcr!=null&&bf?.value!=null?F((out[rs.indexOf(r)].weeklyFcr-bf.value),3):'—'}<br>FCR تجمعی: ${F(out[rs.indexOf(r)]?.cumulativeFcr??r.cumulative_fcr,3)}`;return s}async function all(){kill();const last=rs.at(-1);if(!last){$('root').innerHTML='<div class="box">داده‌ای برای گزارش جامع وجود ندارد.</div>';return}const age=N(last.age_days),bw=await bm(age,'body_weight'),bf=type==='broiler'?await bm(age,'cumulative_fcr'):null;$('root').innerHTML=`<section class="box"><h2>گزارش جامع و تجمعی — ${T[type]}</h2><div class="grid">${card([['تعداد پایش واقعی',F(rs.length,0),'فقط همین گله'],['آخرین سن',F(age,0,' روز'),''],['وزن آخر',F(last.average_weight_g,1,' گرم'),`مرجع ${F(bw?.value,1,' گرم')} — ${bw?.source==='official'?'رسمی':'مدیریتی'}`],type==='broiler'?['FCR تجمعی',F(out.at(-1)?.cumulativeFcr??last.cumulative_fcr,3),`مرجع ${F(bf?.value,3)} — ${bf?.source==='official'?'رسمی':'مدیریتی'}`]:['تلفات تجمعی',F(rs.reduce((a,x)=>a+(N(x.mortality_count)||0),0),0,' قطعه'),''])])}</div><div class="compare">${comparison(last,bw,bf)}</div></section><section class="box"><div class="chart"><canvas id="c1"></canvas></div>${type==='broiler'?'<div class="chart"><canvas id="c2"></canvas></div>':''}</section><section class="box table"><table><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>CV</th><th>یکنواختی</th><th>دان</th><th>آب</th><th>تلفات</th>${type==='broiler'?'<th>FCR هفتگی</th><th>FCR تجمعی</th>':''}</tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${F(r.week_number,0)}</td><td>${F(r.age_days,0)}</td><td>${F(r.average_weight_g,1)}</td><td>${F(r.cv_percent,2)}%</td><td>${F(r.uniformity_10_percent,1)}%</td><td>${F(r.feed_total_kg,1)}</td><td>${F(r.water_total_liter,1)}</td><td>${F(r.mortality_count,0)}</td>${type==='broiler'?`<td>${F(out[i]?.weeklyFcr??r.fcr,3)}</td><td>${F(out[i]?.cumulativeFcr??r.cumulative_fcr,3)}</td>`:''}</tr>`).join('')}</tbody></table></section>`;const lab=rs.map(x=>'هفته '+N(x.week_number));chart('c1',lab,[{label:'وزن واقعی',data:rs.map(x=>N(x.average_weight_g))},{label:'وزن رسمی/مدیریتی',data:rs.map(x=>official(N(x.age_days),'body_weight'))}]);if(type==='broiler')chart('c2',lab,[{label:'FCR تجمعی',data:rs.map((x,i)=>out[i]?.cumulativeFcr??N(x.cumulative_fcr))},{label:'FCR رسمی/مدیریتی',data:rs.map(x=>official(N(x.age_days),'fcr'))}])}async function load(){if(!f)return;const {data,error}=await supabaseClient.from('weekly_records').select('*').eq('flock_id',f.id).order('week_number',{ascending:true});if(error){$('root').innerHTML=`<div class="box err">${error.message}</div>`;return}rs=data||[];const e=E[type](),st=a=>window.resolvePoultryStandard?window.resolvePoultryStandard({productionType:f.production_type,genetics:f.genetics,strain:f.strain,ageDays:a}):null;out=e?.build?e.build(f,rs,st):rs;$('week').innerHTML=rs.map(x=>`<option value="${N(x.week_number)}">هفته ${F(x.week_number,0)} — ${F(x.age_days,0)} روز</option>`).join('')||'<option>—</option>';$('meta').textContent=`${T[type]} | ${f.flock_name||''} | ${f.genetics||'ژنتیک ثبت نشده'} / ${f.strain||'سویه ثبت نشده'} | ${rs.length} رکورد واقعی`;mode==='weekly'?await weekly():await all()}async function loadType(){const list=fs.filter(x=>p(x.production_type)===type);$('flock').innerHTML=list.map(x=>`<option value="${x.id}">${x.flock_name||'بدون نام'} — ${x.genetics||''} / ${x.strain||''}</option>`).join('')||'<option value="">گله‌ای نیست</option>';f=list[0]||null;await load()}document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.t;await loadType()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.m;await load()});$('flock').onchange=async()=>{f=fs.find(x=>x.id===$('flock').value)||null;await load()};$('week').onchange=()=>mode==='weekly'&&weekly();$('calc').onclick=()=>f&&(mode==='weekly'?weekly():all());const {data,error}=await supabaseClient.from('flocks').select('*').order('created_at',{ascending:false});if(error){$('root').innerHTML=`<div class="box err">${error.message}</div>`;return}fs=data||[];await loadType()})()</script></body></html>
