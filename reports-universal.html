<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش جامع طیور | مرکز تخصصی سلامت طیور آدینه</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="report-engine-broiler-v1.js"></script><script src="report-engine-pullet-v1.js"></script><script src="report-engine-layer-v1.js"></script><script src="report-engine-breeder-v1.js"></script><style>body{background:#f5f7fa;font-family:Tahoma,Arial,sans-serif;color:#172033}.wrap{width:min(1500px,95%);margin:18px auto 60px}.head,.card,.section{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.05)}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:0 0 6px}.muted,.note{color:#667085;font-size:12px;line-height:1.9}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:800}.field select,.btn{min-height:44px;border:1px solid #d7dde5;border-radius:10px;padding:8px 11px;font:inherit}.btn{cursor:pointer;font-weight:900;background:#173f35;color:#fff}.type-tabs,.report-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.report-tabs{grid-template-columns:1fr 1fr}.tab{background:#fff;border:1px solid #dfe7e3;border-radius:12px;padding:12px;font:inherit;font-weight:900;cursor:pointer}.tab.active{background:#173f35;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#f8faf9;border:1px solid #e3ebe7;border-radius:12px;padding:12px}.kpi b{display:block;font-size:11px;color:#667085}.kpi strong{display:block;font-size:20px;margin-top:5px}.kpi small{display:block;color:#667085;line-height:1.7;margin-top:4px}.compare{padding:12px;background:#f8fafc;border:1px solid #e6ebef;border-radius:11px;line-height:2;font-size:13px;margin-top:12px}.chart{height:320px;position:relative;margin-top:12px}.table-wrap{overflow:auto}.table-wrap table{width:100%;min-width:1250px;border-collapse:collapse}.table-wrap th,.table-wrap td{padding:8px;border-bottom:1px solid #e5e9ed;text-align:center;white-space:nowrap}.table-wrap th{background:#173f35;color:#fff}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4f1;font-size:11px;font-weight:800}.error{background:#fff4f4;border:1px solid #f0caca;padding:12px;border-radius:10px;color:#8b1e1e}.hidden{display:none}@media(max-width:800px){.controls,.grid,.type-tabs{grid-template-columns:1fr 1fr}}@media(max-width:550px){.controls,.grid,.type-tabs,.report-tabs{grid-template-columns:1fr}.chart{height:270px}}@media print{.controls,.type-tabs,.report-tabs,.btn{display:none!important}.section{box-shadow:none;break-inside:avoid}}
</style></head><body><main class="wrap"><header class="head"><div><h1>گزارش جامع و تخصصی گله</h1><div class="muted">چهار موتور مستقل: گوشتی، پولت، تخم‌گذار و مادر — گزارش هفتگی و جامع/تجمعی</div></div><button class="btn" onclick="print()">چاپ</button></header><section class="card"><div class="controls"><div class="field"><label>گله</label><select id="flock"><option>در حال دریافت...</option></select></div><div class="field"><label>هفته گزارش</label><select id="week"><option>ابتدا گله را انتخاب کنید</option></select></div><button class="btn" id="load">محاسبه گزارش</button></div><div id="info" class="note">گله را انتخاب کنید.</div></section><nav class="type-tabs"><button class="tab active" data-type="broiler">گوشتی</button><button class="tab" data-type="pullet">پولت</button><button class="tab" data-type="layer">تخم‌گذار</button><button class="tab" data-type="breeder">مادر</button></nav><nav class="report-tabs"><button class="tab active" data-report="weekly">گزارش پایش هفتگی</button><button class="tab" data-report="comprehensive">گزارش جامع و تجمعی</button></nav><section id="root"></section></main><script>(async function(){'use strict';const $=id=>document.getElementById(id),N=v=>{const x=Number(v);return Number.isFinite(x)?x:null},FA=(v,d=1,s='')=>N(v)==null?'—':N(v).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d})+s;let flocks=[],flock=null,rows=[],built=[],type='broiler',mode='weekly',charts=[];const engines={broiler:()=>window.BROILER_REPORT_ENGINE,pullet:()=>window.PULLET_REPORT_ENGINE,layer:()=>window.LAYER_REPORT_ENGINE,breeder:()=>window.BREEDER_REPORT_ENGINE};const labels={broiler:'گوشتی',pullet:'پولت',layer:'تخم‌گذار',breeder:'مادر'};function std(age){if(!flock||!window.resolvePoultryStandard)return null;try{return window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,ageDays:age});}catch(e){return null}}async function benchmark(metric,age){if(!flock||age==null)return null;const {data,error}=await window.supabaseClient.from('flocks').select('id,production_type,genetics,strain').eq('production_type',flock.production_type).eq('genetics',flock.genetics).eq('strain',flock.strain);if(error||!Array.isArray(data)||data.length<4)return null;const ids=data.map(x=>x.id);const {data:wr}=await window.supabaseClient.from('weekly_records').select('flock_id,age_days,average_weight_g,cv_percent,uniformity_10_percent,fcr,cumulative_fcr,mortality').in('flock_id',ids).eq('age_days',age);if(!Array.isArray(wr))return null;const vals=wr.map(r=>N(r[metric])).filter(v=>v!=null).sort((a,b)=>a-b);if(vals.length<4)return null;const m=(vals.length-1)/2;return vals.length%2?vals[Math.floor(m)]:(vals[Math.floor(m)]+vals[Math.ceil(m)])/2}function destroy(){charts.forEach(c=>c.destroy());charts=[]}function chart(id,labels,datasets){const el=$(id);if(!el||!window.Chart)return;charts.push(new Chart(el,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:false}}}}))}function metricRow(r){const s=std(N(r.age_days??r.ageDays));return{r,s}}function commonKpis(r,extra){const s=std(N(r.age_days??r.ageDays));const items=[['سن گله',FA(r.age_days??r.ageDays,0,' روز'),''],['میانگین وزن',FA(r.average_weight_g??r.averageWeightG,1,' گرم'),s?.weight!=null?'استاندارد رسمی: '+FA(s.weight,1,' گرم'):''],['CV',FA(r.cv_percent??r.cv,2,'%'),''],['یکنواختی ±10%',FA(r.uniformity_10_percent??r.uniformity10,1,'%'),''],['دان هفته',FA(r.feed_total_kg??r.feedTotalKg??r.feed,1,' کیلوگرم'),''],['آب هفته',FA(r.water_total_liter??r.waterTotalLiter??r.water,1,' لیتر'),''],['تلفات هفته',FA(r.mortality_count??r.mortality,0,' قطعه'),''],...extra];return items.map(x=>`<div class="kpi"><b>${x[0]}</b><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}function renderWeekly(){destroy();const i=rows.findIndex(r=>N(r.week_number)===N($('week').value)),r=i>=0?rows[i]:rows.at(-1);if(!r)return;const age=N(r.age_days),s=std(age),b=built[i]||{},wf=b.weeklyFcr??N(r.fcr),cf=b.cumulativeFcr??N(r.cumulative_fcr),items=[];if(type==='broiler')items.push(['FCR هفتگی',FA(wf,3),s?.fcr!=null?'استاندارد رسمی: '+FA(s.fcr,3):''],['FCR تجمعی',FA(cf,3),s?.fcr!=null?'مرجع تجمعی رسمی: '+FA(s.fcr,3):'']);else if(type==='layer')items.push(['تولید تخم',FA(b.eggProduction,1,'%'),''],['وزن تخم‌مرغ',FA(b.eggWeight,1,' گرم'),''],['Egg Mass',FA(b.eggMass,1,' گرم'),''],['FCR',FA(b.fcr,3),s?.fcr!=null?'استاندارد رسمی: '+FA(s.fcr,3):'']);else if(type==='breeder')items.push(['تولید روزانه',FA(b.henDayProduction,1,'%'),''],['تولید H.H.',FA(b.henHousedProduction,1,'%'),''],['وزن تخم‌مرغ',FA(b.eggWeight,1,' گرم'),''],['باروری',FA(b.fertility,1,'%'),''],['هچ‌پذیری',FA(b.hatchability,1,'%'),'']);else items.push(['FCR هفتگی',FA(wf,3),s?.fcr!=null?'استاندارد رسمی: '+FA(s.fcr,3):'']);$('root').innerHTML=`<section class="section"><div class="title">گزارش پایش هفتگی — ${labels[type]} — هفته ${FA(r.week_number,0)}</div><div class="grid">${commonKpis(r,items)}</div><div class="compare">${type==='broiler'?`<b>FCR هفتگی:</b> ${FA(wf,3)} | رسمی: ${FA(s?.fcr,3)} | اختلاف: ${wf!=null&&s?.fcr!=null?FA(wf-s.fcr,3):'—'}<br><b>FCR تجمعی تا این هفته:</b> ${FA(cf,3)}`:`<b>استاندارد:</b> ${s?.sourceName||'برای این شاخص/سویه استاندارد رسمی معتبر موجود نیست؛ عدد ساختگی تولید نمی‌شود.'}`}</div></section><section class="section"><div class="title">روند واقعی همین گله تا هفته انتخاب‌شده</div><div class="chart"><canvas id="c1"></canvas></div><div class="chart"><canvas id="c2"></canvas></div></section><section class="section"><div class="note">مبنای نمودار فقط رکوردهای واقعی ثبت‌شده برای همین گله است. استاندارد بر اساس نوع تولید، ژنتیک، سویه و سن Resolver می‌شود و داده گله دیگر وارد سری واقعی نمی‌شود.</div></section>`;const rs=rows.filter(x=>N(x.week_number)<=N(r.week_number)),lab=rs.map(x=>'هفته '+N(x.week_number));chart('c1',lab,[{label:'وزن واقعی',data:rs.map(x=>N(x.average_weight_g))},{label:'استاندارد رسمی وزن',data:rs.map(x=>std(N(x.age_days))?.weight??null)}]);if(type==='broiler')chart('c2',lab,[{label:'FCR هفتگی واقعی',data:rs.map((x,j)=>built[rows.indexOf(x)]?.weeklyFcr??N(x.fcr))},{label:'FCR رسمی',data:rs.map(x=>std(N(x.age_days))?.fcr??null)},{label:'FCR تجمعی واقعی',data:rs.map((x,j)=>built[rows.indexOf(x)]?.cumulativeFcr??N(x.cumulative_fcr))}]);else chart('c2',lab,[{label:'CV',data:rs.map(x=>N(x.cv_percent))},{label:'یکنواختی ±10%',data:rs.map(x=>N(x.uniformity_10_percent))}]);}async function renderComp(){destroy();const rs=[...rows].sort((a,b)=>(N(a.week_number)||0)-(N(b.week_number)||0)),last=rs.at(-1);if(!last)return;const li=rs.length-1,b=built[li]||{},s=std(N(last.age_days)),benchW=await benchmark('average_weight_g',N(last.age_days)),benchF=type==='broiler'?await benchmark('cumulative_fcr',N(last.age_days)):null;$('root').innerHTML=`<section class="section"><div class="title">گزارش جامع و تجمعی — ${labels[type]}</div><div class="grid">${commonKpis(last,type==='broiler'?[['FCR تجمعی',FA(b.cumulativeFcr??last.cumulative_fcr,3),s?.fcr!=null?'استاندارد رسمی: '+FA(s.fcr,3):''],['Benchmark وزن',FA(benchW,1,' گرم'),'میانه گله‌های هم‌نوع/هم‌سویه'],['Benchmark FCR',FA(benchF,3),'میانه گله‌های هم‌نوع/هم‌سویه']]:type==='layer'?[['تولید تخم',FA(b.eggProduction,1,'%'),''],['Egg Mass',FA(b.eggMass,1,' گرم'),''],['FCR',FA(b.fcr,3),'']]:type==='breeder'?[['تولید روزانه',FA(b.henDayProduction,1,'%'),''],['باروری',FA(b.fertility,1,'%'),''],['هچ‌پذیری',FA(b.hatchability,1,'%'),'']]:[['دان تجمعی',FA(rs.reduce((q,x)=>q+(N(x.feed_total_kg)||0),0),1,' کیلوگرم'),''],['تلفات تجمعی',FA(rs.reduce((q,x)=>q+(N(x.mortality_count)||0),0),0,' قطعه'),''],['Benchmark وزن',FA(benchW,1,' گرم'),'میانه قابل‌اعتبار']])}</div><div class="compare"><b>وزن فعلی:</b> ${FA(last.average_weight_g,1,' گرم')} | رسمی: ${FA(s?.weight,1,' گرم')} | اختلاف: ${last.average_weight_g!=null&&s?.weight!=null?FA(N(last.average_weight_g)-s.weight,1,' گرم'):'—'}<br><b>Benchmark مدیریتی:</b> ${benchW==null?'داده کافی نیست':'وزن '+FA(benchW,1,' گرم')+(type==='broiler'&&benchF!=null?' | FCR '+FA(benchF,3):'')}</div></section><section class="section"><div class="title">روند تجمعی گله</div><div class="chart"><canvas id="cc1"></canvas></div><div class="chart"><canvas id="cc2"></canvas></div></section><section class="section"><div class="title">جدول کامل سوابق واقعی</div><div class="table-wrap"><table><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>استاندارد وزن</th><th>CV</th><th>یکنواختی</th><th>دان</th><th>آب</th><th>تلفات</th>${type==='broiler'?'<th>FCR هفتگی</th><th>FCR تجمعی</th>':''}</tr></thead><tbody>${rs.map((r,i)=>{const x=built[i]||{};return`<tr><td>${FA(r.week_number,0)}</td><td>${FA(r.age_days,0)}</td><td>${FA(r.average_weight_g,1)}</td><td>${FA(std(N(r.age_days))?.weight,1)}</td><td>${FA(r.cv_percent,2)}%</td><td>${FA(r.uniformity_10_percent,1)}%</td><td>${FA(r.feed_total_kg,1)}</td><td>${FA(r.water_total_liter,1)}</td><td>${FA(r.mortality_count,0)}</td>${type==='broiler'?`<td>${FA(x.weeklyFcr??r.fcr,3)}</td><td>${FA(x.cumulativeFcr??r.cumulative_fcr,3)}</td>`:''}</tr>`}).join('')}</tbody></table></div></section>`;const lab=rs.map(x=>'هفته '+N(x.week_number));chart('cc1',lab,[{label:'وزن واقعی',data:rs.map(x=>N(x.average_weight_g))},{label:'استاندارد رسمی',data:rs.map(x=>std(N(x.age_days))?.weight??null)},{label:'Benchmark مدیریتی',data:benchW==null?rs.map(()=>null):rs.map(()=>benchW)}]);if(type==='broiler')chart('cc2',lab,[{label:'FCR تجمعی واقعی',data:rs.map((x,i)=>built[i]?.cumulativeFcr??N(x.cumulative_fcr))},{label:'FCR رسمی',data:rs.map(x=>std(N(x.age_days))?.fcr??null)},{label:'Benchmark مدیریتی',data:benchF==null?rs.map(()=>null):rs.map(()=>benchF)}]);else chart('cc2',lab,[{label:'CV',data:rs.map(x=>N(x.cv_percent))},{label:'یکنواختی ±10%',data:rs.map(x=>N(x.uniformity_10_percent))}]);}function bind(){document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;loadData()});document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-report]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.report;flock&&loadData()});$('flock').onchange=()=>{flock=flocks.find(x=>x.id===$('flock').value)||null;fillWeeks();};$('week').onchange=()=>{if(flock)mode==='weekly'?renderWeekly():renderComp()};$('load').onclick=()=>{if(flock)mode==='weekly'?renderWeekly():renderComp()}}async function loadData(){if(!flock)return;if((window.normalizePoultryProductionType?window.normalizePoultryProductionType(flock.production_type):flock.production_type)!==type)return;const {data,error}=await window.supabaseClient.from('weekly_records').select('*').eq('flock_id',flock.id).order('week_number',{ascending:true});if(error){$('root').innerHTML=`<div class="error">خطا در دریافت سوابق: ${error.message}</div>`;return}rows=Array.isArray(data)?data:[];const e=engines[type]();const st=age=>window.resolvePoultryStandard?window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,ageDays:age}):null;built=e?.build?e.build(flock,rows,st):rows;fillWeeks();$('info').innerHTML=`<span class="badge">${labels[type]}</span> ${flock.flock_name||''} — ${flock.genetics||'ژنتیک ثبت نشده'} / ${flock.strain||'سویه ثبت نشده'} — ${rows.length} رکورد واقعی`;mode==='weekly'?renderWeekly():renderComp()}function fillWeeks(){$('week').innerHTML=rows.map(r=>`<option value="${N(r.week_number)}">هفته ${FA(r.week_number,0)} — سن ${FA(r.age_days,0)} روز</option>`).join('')||'<option value="">رکوردی وجود ندارد</option>'}async function init(){if(!window.supabaseClient){$('root').innerHTML='<div class="error">Supabase در دسترس نیست.</div>';return}const {data,error}=await window.supabaseClient.from('flocks').select('*').order('created_at',{ascending:false});if(error){$('root').innerHTML=`<div class="error">خطا در دریافت گله‌ها: ${error.message}</div>`;return}flocks=Array.isArray(data)?data:[];const wanted=flocks.filter(f=>(window.normalizePoultryProductionType?window.normalizePoultryProductionType(f.production_type):f.production_type)===type);flocks=wanted;$('flock').innerHTML=flocks.map(f=>`<option value="${f.id}">${f.flock_name||'بدون نام'} — ${labels[type]}</option>`).join('')||'<option value="">گله‌ای در این دسته نیست</option>';flock=flocks[0]||null;if(flock){$('flock').value=flock.id;await loadData()}bind()}await init()})();</script></body></html>
