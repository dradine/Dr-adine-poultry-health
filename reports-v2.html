<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش هفتگی و جامع گله | مرکز تخصصی سلامت طیور آدینه</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app-core.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="genetics-ui.js"></script><script src="reports-data.js"></script><style>body{background:#f5f7fa;font-family:Tahoma,Arial,sans-serif;color:#172033}.wrap{width:min(1450px,95%);margin:20px auto 60px}.head,.card,.section{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.head h1{margin:0 0 7px;font-size:25px}.muted{color:#667085;font-size:12px;line-height:1.9}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:800}.field select,.btn{min-height:46px;border:1px solid #d7dde5;border-radius:10px;padding:9px 12px;font:inherit}.btn{cursor:pointer;font-weight:900;background:#173f35;color:#fff}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.tab{background:#fff;color:#173f35;border:1px solid #dfe7e3;border-radius:14px;padding:14px;font:inherit;font-weight:900;cursor:pointer}.tab.active{background:#173f35;color:#fff}.pane{display:none}.pane.active{display:block}.title{font-size:19px;font-weight:950;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.kpi{background:#f8faf9;border:1px solid #e3ebe7;border-radius:13px;padding:13px}.kpi b{display:block;font-size:12px;color:#667085}.kpi strong{display:block;font-size:21px;margin-top:6px}.kpi small{display:block;color:#667085;margin-top:5px;line-height:1.7}.compare{margin-top:13px;padding:12px;border-radius:11px;background:#f8fafc;border:1px solid #e6ebef;line-height:1.9;font-size:13px}.table-wrap{overflow:auto}.table-wrap table{min-width:1400px;width:100%;border-collapse:collapse}.table-wrap th,.table-wrap td{padding:9px;border-bottom:1px solid #e5e9ed;text-align:center;white-space:nowrap}.table-wrap th{background:#173f35;color:#fff}.chart{height:340px;position:relative}.notice{padding:12px;border-radius:11px;background:#f8fafc;border:1px solid #e5eaf0;color:#667085;line-height:1.9;font-size:12px}.bench{padding:14px;border-radius:13px;background:#f7faf9;border:1px solid #e1eae6;line-height:2;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:850px){.controls,.grid,.row{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:stretch}}@media(max-width:560px){.controls,.grid,.tabs,.row{grid-template-columns:1fr}.chart{height:280px}}@media print{.controls,.tabs{display:none}.pane{display:block!important}.section{box-shadow:none;break-inside:avoid}}</style></head><body><main class="wrap"><header class="head"><div><h1>گزارش و ارزیابی گله</h1><div class="muted">گزارش پایش هفتگی و گزارش جامع/تجمعی — مرکز تخصصی سلامت طیور آدینه</div></div><button class="btn" onclick="window.print()">چاپ گزارش</button></header><section class="card"><div class="controls"><div class="field"><label>گله</label><select id="flock"><option value="">در حال دریافت...</option></select></div><div class="field"><label>هفته گزارش</label><select id="week"><option value="">ابتدا گله را انتخاب کنید</option></select></div><button class="btn" id="load">نمایش گزارش</button></div><div id="info" class="notice">گله و هفته را انتخاب کنید.</div></section><nav class="tabs"><button class="tab active" data-tab="weekly">گزارش پایش هفتگی</button><button class="tab" data-tab="comprehensive">گزارش جامع و تجمعی گله</button></nav><section id="weeklyPane" class="pane active"><div id="weeklyRoot"></div></section><section id="comprehensivePane" class="pane"><div id="compRoot"></div></section></main><script>(async function(){'use strict';const $=id=>document.getElementById(id),N=v=>{const x=Number(v);return Number.isFinite(x)?x:null},FA=(v,d=1,s='')=>N(v)==null?'—':N(v).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d})+s;let data=null,analysisRows=[];function ar(week){return analysisRows.find(x=>N(x.week_number)===N(week))||null}function weeklyFcr(r,i){const a=ar(r.weekNumber);if(a&&N(a.weekly_fcr)!=null)return N(a.weekly_fcr);if(i===0)return null;const p=data.records[i-1],feed=N(r.feedTotalKg),cw=N(r.averageWeight),pw=N(p.averageWeight),cb=N(r.liveBirds),pb=N(p.liveBirds);if(feed==null||feed<=0||cw==null||pw==null||cb==null||pb==null||cb<=0||pb<=0)return null;const gain=(cb*cw-pb*pw)/1000;return gain>0?feed/gain:null}function stdWeekly(r){const a=ar(r.weekNumber);return a?N(a.official_weekly_fcr):null}function stdCum(r){const a=ar(r.weekNumber);return a?N(a.official_cumulative_fcr):null}function mgWeekly(r){const a=ar(r.weekNumber);return a?N(a.management_weekly_fcr):null}function mgCum(r){const a=ar(r.weekNumber);return a?N(a.management_cumulative_fcr):null}function makeChart(canvas,type,labels,datasets){if(!canvas)return null;return new Chart(canvas,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:false}}}})}function renderWeekly(){const i=data.records.findIndex(x=>N(x.weekNumber)===N($('week').value));const r=i>=0?data.records[i]:data.records.at(-1);if(!r)return;const wf=weeklyFcr(r,i),ws=stdWeekly(r);const delta=wf!=null&&ws!=null?wf-ws:null;$('weeklyRoot').innerHTML=`<section class="section"><div class="title">گزارش پایش هفتگی — هفته ${FA(r.weekNumber,0)}</div><div class="grid">${[['سن گله',FA(r.ageDays,0,' روز'),''],['میانگین وزن',FA(r.averageWeight,1,' گرم'),'استاندارد: '+FA(r.standardWeight,1,' گرم')],['CV',FA(r.cv,2,'%'),''],['یکنواختی ±10%',FA(r.uniformity10,1,'%'),''],['دان هفتگی',FA(r.feedTotalKg,1,' کیلوگرم'),''],['آب هفتگی',FA(r.waterTotalLiter,1,' لیتر'),''],['FCR هفتگی',FA(wf,3),'استاندارد رسمی: '+FA(ws,3)],['تلفات هفته',FA(r.mortality,0,' قطعه'),'']].map(x=>`<div class="kpi"><b>${x[0]}</b><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="compare"><b>وزن:</b> ${FA(r.averageWeight,1,' گرم')} | رسمی: ${FA(r.standardWeight,1,' گرم')} | اختلاف: ${r.weightDifference==null?'—':FA(r.weightDifference,1,' گرم')} (${r.weightDifferencePercent==null?'—':FA(r.weightDifferencePercent,1,'%')})<br><b>FCR هفتگی:</b> ${FA(wf,3)} | رسمی: ${FA(ws,3)} | اختلاف: ${delta==null?'—':FA(delta,3)} (${delta==null||!ws?'—':FA(delta/ws*100,1,'%')})</div></section><section class="section"><div class="title">روند هفتگی گله تا این هفته</div><div class="chart"><canvas id="weeklyWeightChart"></canvas></div><div class="chart"><canvas id="weeklyFcrChart"></canvas></div></section><section class="section"><div class="title">مبنای گزارش</div><div class="notice">فقط رکوردهای واقعی ثبت‌شده برای همین گله استفاده می‌شوند. استاندارد FCR هفتگی از موتور canonical گرفته می‌شود؛ در صورت نبود مقدار مستقیم رسمی، مقدار هفتگی از منحنی رسمی مشتق‌شده است. هیچ هفته آینده یا رکورد گله دیگر وارد این گزارش نمی‌شود.</div></section>`;const rows=data.records.filter(x=>N(x.weekNumber)<=N(r.weekNumber));const labels=rows.map(x=>'هفته '+N(x.weekNumber));makeChart($('weeklyWeightChart'),'line',labels,[{label:'وزن واقعی',data:rows.map(x=>N(x.averageWeight))},{label:'استاندارد رسمی وزن',data:rows.map(x=>N(x.standardWeight))}]);makeChart($('weeklyFcrChart'),'line',labels,[{label:'FCR هفتگی واقعی',data:rows.map((x,j)=>weeklyFcr(x,data.records.indexOf(x)))},{label:'FCR هفتگی رسمی',data:rows.map(x=>stdWeekly(x))}]);}function renderComp(){const rows=[...data.records].sort((a,b)=>(a.ageDays??0)-(b.ageDays??0)),last=rows.at(-1),la=ar(last.weekNumber),feed=rows.reduce((s,r)=>s+(N(r.feedTotalKg)||0),0),water=rows.reduce((s,r)=>s+(N(r.waterTotalLiter)||0),0),mort=rows.reduce((s,r)=>s+(N(r.mortality)||0),0),cfcr=N(la?.cumulative_fcr??last.cumulativeFCR),sfcr=N(la?.official_cumulative_fcr),mb=N(la?.management_cumulative_fcr),d=cfcr!=null&&sfcr!=null?cfcr-sfcr:null,dp=d!=null&&sfcr?d/sfcr*100:null;$('compRoot').innerHTML=`<section class="section"><div class="title">گزارش جامع و تجمعی تا آخرین پایش</div><div class="grid">${[['سن آخرین پایش',FA(last.ageDays,0,' روز'),''],['وزن فعلی',FA(last.averageWeight,1,' گرم'),'استاندارد: '+FA(last.standardWeight,1,' گرم')],['FCR تجمعی',FA(cfcr,3),'استاندارد رسمی: '+FA(sfcr,3)],['FCR مدیریتی',FA(mb,3),mb==null?'جامعه معتبر کافی نیست':'Benchmark مدیریتی'],['دان تجمعی',FA(feed,1,' کیلوگرم'),''],['آب تجمعی',FA(water,1,' لیتر'),''],['تلفات تجمعی',FA(mort,0,' قطعه'),''],['CV آخرین پایش',FA(last.cv,2,'%'),''],['یکنواختی ±10%',FA(last.uniformity10,1,'%'),'']].map(x=>`<div class="kpi"><b>${x[0]}</b><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="compare"><b>FCR تجمعی:</b> ${FA(cfcr,3)} | رسمی: ${FA(sfcr,3)} | اختلاف: ${d==null?'—':FA(d,3)} (${dp==null?'—':FA(dp,1,'%')}) | مدیریتی: ${FA(mb,3)}</div></section><section class="section"><div class="title">روند تجمعی</div><div class="row"><div class="chart"><canvas id="cumFcrChart"></canvas></div><div class="chart"><canvas id="cumWeightChart"></canvas></div></div></section><section class="section"><div class="title">مقایسه با Benchmark مدیریتی</div><div class="bench">${mb==null?'برای این گله در سن فعلی جامعه آماری معتبر Benchmark مدیریتی کافی نیست؛ سیستم عدد ساختگی تولید نمی‌کند.':'FCR تجمعی واقعی: '+FA(cfcr,3)+' | Benchmark مدیریتی: '+FA(mb,3)+' | اختلاف: '+FA(cfcr-mb,3)}</div></section><section class="section"><div class="title">جدول جامع روند گله</div><div class="table-wrap"><table><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>استاندارد وزن</th><th>CV</th><th>یکنواختی ±10</th><th>دان</th><th>آب</th><th>FCR هفتگی واقعی</th><th>FCR هفتگی رسمی</th><th>FCR تجمعی واقعی</th><th>FCR تجمعی رسمی</th><th>FCR مدیریتی تجمعی</th><th>تلفات</th></tr></thead><tbody>${rows.map((r,i)=>{const a=ar(r.weekNumber);return`<tr><td>${FA(r.weekNumber,0)}</td><td>${FA(r.ageDays,0)}</td><td>${FA(r.averageWeight,1)}</td><td>${FA(r.standardWeight,1)}</td><td>${FA(r.cv,2)}%</td><td>${FA(r.uniformity10,1)}%</td><td>${FA(r.feedTotalKg,1)}</td><td>${FA(r.waterTotalLiter,1)}</td><td>${FA(weeklyFcr(r,i),3)}</td><td>${FA(a?.official_weekly_fcr,3)}</td><td>${FA(a?.cumulative_fcr??r.cumulativeFCR,3)}</td><td>${FA(a?.official_cumulative_fcr,3)}</td><td>${FA(a?.management_cumulative_fcr,3)}</td><td>${FA(r.mortality,0)}</td></tr>`}).join('')}</tbody></table></div></section>`;const labels=rows.map(x=>'هفته '+N(x.weekNumber));makeChart($('cumFcrChart'),'line',labels,[{label:'FCR تجمعی واقعی',data:rows.map(x=>N(ar(x.weekNumber)?.cumulative_fcr??x.cumulativeFCR))},{label:'FCR تجمعی رسمی',data:rows.map(x=>N(ar(x.weekNumber)?.official_cumulative_fcr))},{label:'Benchmark مدیریتی',data:rows.map(x=>N(ar(x.weekNumber)?.management_cumulative_fcr))}]);makeChart($('cumWeightChart'),'line',labels,[{label:'وزن واقعی',data:rows.map(x=>N(x.averageWeight))},{label:'استاندارد رسمی وزن',data:rows.map(x=>N(x.standardWeight))}]);}async function load(){await initializeReportsData();const{data:flocks,error}=await supabaseClient.from('flocks').select('id,flock_name,name,production_type,genetics,strain').order('flock_name');if(error)throw error;const b=$('flock');b.innerHTML='<option value="">انتخاب گله</option>'+(flocks||[]).map(f=>`<option value="${f.id}">${f.flock_name||f.name||'گله'} — ${f.strain||f.genetics||''}</option>`).join('');b.onchange=async()=>{if(!b.value)return;data=await getCompleteReportData(b.value);const q=await supabaseClient.rpc('get_flock_fcr_analysis_v3',{p_flock_id:b.value});if(q.error)throw q.error;analysisRows=q.data||[];$('week').innerHTML='<option value="">انتخاب هفته</option>'+data.records.map(r=>`<option value="${r.weekNumber}">هفته ${FA(r.weekNumber,0)} — ${FA(r.ageDays,0)} روز</option>`).join('');$('week').value=data.records.at(-1)?.weekNumber??'';renderWeekly();renderComp();$('info').textContent=`${data.flock.flock_name||data.flock.name||'گله'} — ${data.records.length} رکورد واقعی؛ آخرین پایش: هفته ${data.records.at(-1)?.weekNumber??'—'}`};$('week').onchange=()=>{if(data)renderWeekly()};$('load').onclick=()=>{if(data){renderWeekly();renderComp()}}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const weekly=b.dataset.tab==='weekly';$('weeklyPane').classList.toggle('active',weekly);$('comprehensivePane').classList.toggle('active',!weekly);if(!weekly&&data)renderComp()});try{await load()}catch(e){console.error(e);$('info').textContent='خطا در دریافت اطلاعات گزارش: '+(e.message||e)}})();</script></body></html>
