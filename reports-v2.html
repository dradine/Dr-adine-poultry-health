<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش هفتگی و جامع گله | مرکز تخصصی سلامت طیور آدینه</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app-core.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="genetics-ui.js"></script><script src="reports-data.js"></script><style>body{background:#f5f7fa;font-family:Tahoma,Arial,sans-serif;color:#172033}.wrap{width:min(1450px,95%);margin:20px auto 60px}.head,.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.head h1{margin:0 0 7px;font-size:25px}.muted{color:#667085;font-size:12px;line-height:1.9}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:800}.field select,.btn{min-height:46px;border:1px solid #d7dde5;border-radius:10px;padding:9px 12px;font:inherit}.btn{cursor:pointer;font-weight:900;background:#173f35;color:#fff}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.tab{background:#fff;color:#173f35;border:1px solid #dfe7e3;border-radius:14px;padding:14px;font:inherit;font-weight:900;cursor:pointer}.tab.active{background:#173f35;color:#fff}.pane{display:none}.pane.active{display:block}.section{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.05)}.title{font-size:19px;font-weight:950;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.kpi{background:#f8faf9;border:1px solid #e3ebe7;border-radius:13px;padding:13px}.kpi b{display:block;font-size:12px;color:#667085}.kpi strong{display:block;font-size:21px;margin-top:6px}.kpi small{display:block;color:#667085;margin-top:5px;line-height:1.7}.compare{margin-top:13px;padding:12px;border-radius:11px;background:#f8fafc;border:1px solid #e6ebef;line-height:1.9;font-size:13px}.table-wrap{overflow:auto}.table-wrap table{min-width:1250px;width:100%;border-collapse:collapse}.table-wrap th,.table-wrap td{padding:9px;border-bottom:1px solid #e5e9ed;text-align:center;white-space:nowrap}.table-wrap th{background:#173f35;color:#fff}.chart{height:330px;position:relative}.notice{padding:12px;border-radius:11px;background:#f8fafc;border:1px solid #e5eaf0;color:#667085;line-height:1.9;font-size:12px}.good{color:#067647;font-weight:900}.bad{color:#b42318;font-weight:900}@media(max-width:850px){.controls,.grid{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:stretch}}@media(max-width:560px){.controls,.grid,.tabs{grid-template-columns:1fr}.chart{height:280px}}@media print{.controls,.tabs{display:none}.pane{display:block!important}.section{box-shadow:none;break-inside:avoid}}</style></head><body><main class="wrap"><header class="head"><div><h1>گزارش و ارزیابی گله</h1><div class="muted">گزارش پایش هفتگی و گزارش جامع/تجمعی — مرکز تخصصی سلامت طیور آدینه</div></div><button class="btn" onclick="window.print()">چاپ گزارش</button></header><section class="card"><div class="controls"><div class="field"><label>گله</label><select id="flock"><option value="">در حال دریافت...</option></select></div><div class="field"><label>هفته گزارش</label><select id="week"><option value="">ابتدا گله را انتخاب کنید</option></select></div><button class="btn" id="load">نمایش گزارش</button></div><div id="info" class="notice">گله و هفته را انتخاب کنید.</div></section><nav class="tabs"><button class="tab active" data-tab="weekly">گزارش پایش هفتگی</button><button class="tab" data-tab="comprehensive">گزارش جامع و تجمعی گله</button></nav><section id="weeklyPane" class="pane active"><div id="weeklyRoot"></div></section><section id="comprehensivePane" class="pane"><div id="compRoot"></div></section></main><script>(async function(){'use strict';const $=id=>document.getElementById(id),N=v=>{const x=Number(v);return Number.isFinite(x)?x:null},FA=(v,d=1,s='')=>N(v)==null?'—':N(v).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d})+s;let data=null;function weeklyFcr(r,i){if(N(r?.fcr)!=null)return N(r.fcr);if(i===0)return null;const p=data.records[i-1],feed=N(r.feedTotalKg),cw=N(r.averageWeight),pw=N(p.averageWeight),cb=N(r.liveBirds),pb=N(p.liveBirds);if(feed==null||feed<=0||cw==null||pw==null||cb==null||pb==null||cb<=0||pb<=0)return null;const gain=(cb*cw-pb*pw)/1000;return gain>0?feed/gain:null}function renderWeekly(){const r=data.records.find(x=>Number(x.weekNumber)===Number($('week').value))||data.records.at(-1);if(!r)return;$('weeklyRoot').innerHTML=`<section class="section"><div class="title">خلاصه عملکرد هفته ${FA(r.weekNumber,0)}</div><div class="grid">${[['سن گله',FA(r.ageDays,0,' روز'),''],['میانگین وزن',FA(r.averageWeight,1,' گرم'),'استاندارد: '+FA(r.standardWeight,1,' گرم')],['CV',FA(r.cv,2,'%'),''],['یکنواختی ±10%',FA(r.uniformity10,1,'%'),''],['دان هفتگی',FA(r.feedTotalKg,1,' کیلوگرم'),''],['آب هفتگی',FA(r.waterTotalLiter,1,' لیتر'),''],['FCR هفتگی',FA(weeklyFcr(r,data.records.indexOf(r)),3),'استاندارد: '+FA(r.standardFCR,3)],['تلفات هفته',FA(r.mortality,0,' قطعه'),'']].map(x=>`<div class="kpi"><b>${x[0]}</b><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="compare"><b>مقایسه وزن:</b> ${FA(r.averageWeight,1,' گرم')} در برابر ${FA(r.standardWeight,1,' گرم')} — اختلاف ${r.weightDifference==null?'—':FA(r.weightDifference,1,' گرم')} (${r.weightDifferencePercent==null?'—':FA(r.weightDifferencePercent,1,'%')})<br><b>مقایسه FCR هفتگی:</b> ${FA(weeklyFcr(r,data.records.indexOf(r)),3)} در برابر ${FA(r.standardFCR,3)} — اختلاف ${r.standardFCR==null||weeklyFcr(r,data.records.indexOf(r))==null?'—':FA(weeklyFcr(r,data.records.indexOf(r))-r.standardFCR,3)}</div></section><section class="section"><div class="title">جدول اطلاعات واقعی همین هفته</div><div class="notice">این گزارش فقط داده‌های ثبت‌شده برای هفته انتخاب‌شده را نمایش می‌دهد؛ هفته آینده یا رکورد گله دیگر هرگز وارد گزارش نمی‌شود.</div></section>`}function renderComp(){const rows=[...data.records].sort((a,b)=>(a.ageDays??0)-(b.ageDays??0)),last=rows.at(-1);const feed=rows.reduce((s,r)=>s+(N(r.feedTotalKg)||0),0),water=rows.reduce((s,r)=>s+(N(r.waterTotalLiter)||0),0),mort=rows.reduce((s,r)=>s+(N(r.mortality)||0),0),cfcr=N(last.cumulativeFCR),sfcr=N(last.standardFCR),delta=cfcr!=null&&sfcr!=null?cfcr-sfcr:null;$('compRoot').innerHTML=`<section class="section"><div class="title">خلاصه تجمعی تا آخرین پایش</div><div class="grid">${[['سن آخرین پایش',FA(last.ageDays,0,' روز'),''],['وزن فعلی',FA(last.averageWeight,1,' گرم'),'استاندارد: '+FA(last.standardWeight,1,' گرم')],['FCR تجمعی',FA(cfcr,3),'استاندارد رسمی: '+FA(sfcr,3)],['دان تجمعی',FA(feed,1,' کیلوگرم'),''],['آب تجمعی',FA(water,1,' لیتر'),''],['تلفات تجمعی',FA(mort,0,' قطعه'),''],['CV آخرین پایش',FA(last.cv,2,'%'),''],['یکنواختی ±10%',FA(last.uniformity10,1,'%'),'']].map(x=>`<div class="kpi"><b>${x[0]}</b><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="compare"><b>FCR تجمعی:</b> ${FA(cfcr,3)} | رسمی: ${FA(sfcr,3)} | اختلاف: ${delta==null?'—':FA(delta,3)} (${delta==null||!sfcr?'—':FA(delta/sfcr*100,1,'%')})</div></section><section class="section"><div class="title">جدول روند واقعی گله</div><div class="table-wrap"><table><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>استاندارد وزن</th><th>CV</th><th>یکنواختی ±10</th><th>دان</th><th>آب</th><th>FCR هفتگی</th><th>FCR تجمعی</th><th>استاندارد FCR</th><th>تلفات</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${FA(r.weekNumber,0)}</td><td>${FA(r.ageDays,0)}</td><td>${FA(r.averageWeight,1)}</td><td>${FA(r.standardWeight,1)}</td><td>${FA(r.cv,2)}%</td><td>${FA(r.uniformity10,1)}%</td><td>${FA(r.feedTotalKg,1)}</td><td>${FA(r.waterTotalLiter,1)}</td><td>${FA(weeklyFcr(r,i),3)}</td><td>${FA(r.cumulativeFCR,3)}</td><td>${FA(r.standardFCR,3)}</td><td>${FA(r.mortality,0)}</td></tr>`).join('')}</tbody></table></div></section><section class="section"><div class="title">Benchmark مدیریتی</div><div class="notice">Benchmark مدیریتی فقط زمانی در این بخش نمایش داده می‌شود که جامعه آماری معتبر برای همین نوع تولید، سویه و سن وجود داشته باشد. در نبود جامعه معتبر، عدد ساخته نمی‌شود.</div></section>`}async function loadFlocks(){await initializeReportsData();const{data:flocks,error}=await supabaseClient.from('flocks').select('id,flock_name,name,production_type,genetics,strain').order('flock_name');if(error)throw error;const b=$('flock');b.innerHTML='<option value="">انتخاب گله</option>'+(flocks||[]).map(f=>`<option value="${f.id}">${f.flock_name||f.name||'گله'} — ${f.strain||f.genetics||''}</option>`).join('');b.onchange=async()=>{if(!b.value)return;data=await getCompleteReportData(b.value);$('week').innerHTML='<option value="">انتخاب هفته</option>'+data.records.map(r=>`<option value="${r.weekNumber}">هفته ${FA(r.weekNumber,0)} — ${FA(r.ageDays,0)} روز</option>`).join('');$('week').value=data.records.at(-1)?.weekNumber??'';renderWeekly();renderComp();$('info').textContent=`${data.flock.flock_name||data.flock.name||'گله'} — ${data.records.length} رکورد واقعی؛ آخرین پایش: هفته ${data.records.at(-1)?.weekNumber??'—'}`};$('week').onchange=()=>{if(data)renderWeekly()};$('load').onclick=()=>{if(data){renderWeekly();renderComp()}}}for(const b of document.querySelectorAll('.tab'))b.onclick=()=>{for(const x of document.querySelectorAll('.tab'))x.classList.remove('active');b.classList.add('active');const weekly=b.dataset.tab==='weekly';$('weeklyPane').classList.toggle('active',weekly);$('comprehensivePane').classList.toggle('active',!weekly);if(!weekly&&data)renderComp()};try{await loadFlocks()}catch(e){console.error(e);$('info').textContent='خطا در دریافت اطلاعات گزارش: '+(e.message||e)}})();</script></body></html>
