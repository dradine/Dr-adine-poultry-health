<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>گزارشات گله | مرکز تخصصی سلامت طیور آدینه</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#17231f;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1450px,95%);margin:18px auto 40px}.panel{background:#fff;border:1px solid #dfe8e3;border-radius:16px;box-shadow:0 5px 18px rgba(20,45,38,.06);margin-bottom:12px}.head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{margin:0;font-size:21px}.muted{margin-top:6px;color:#6b7973;font-size:11px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:900;cursor:pointer;background:#edf2ef;color:#24463b}.btn.primary{background:#173f35;color:#fff}.identity{padding:12px}.identity-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.identity-item{background:#f7faf8;border:1px solid #e0e8e4;border-radius:11px;padding:10px}.identity-item small{display:block;color:#738079;font-size:9px}.identity-item strong{display:block;margin-top:5px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs{display:flex;gap:8px;padding:8px;direction:rtl}.tab{flex:1;padding:12px 10px;border:1px solid #d7e1dc;border-radius:11px;background:#fff;font:inherit;font-weight:900;cursor:pointer;white-space:nowrap;color:#33463f}.tab.active{background:#173f35;color:#fff}.toolbar{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar select{min-width:210px;padding:9px;border:1px solid #d5dfda;border-radius:9px;font:inherit;background:#fff}.badge{padding:6px 10px;border-radius:20px;background:#eef4f1;color:#42665a;font-size:10px;font-weight:900}.section{padding:16px 18px}.section h2{margin:0 0 12px;font-size:17px}.section h3{margin:0 0 10px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{padding:11px;border:1px solid #e0e8e4;border-radius:11px;background:#f9fbfa}.label{font-size:9px;color:#738079;font-weight:800}.value{margin-top:5px;font-size:17px;font-weight:900}.ref{margin-top:4px;font-size:9px;color:#687770;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.box{border:1px solid #e0e8e4;border-radius:12px;padding:11px}.chart{height:320px}.chart canvas{height:275px!important}.table-wrap{overflow:auto}.data{width:100%;min-width:900px;border-collapse:collapse;font-size:10px}.data th,.data td{padding:8px;text-align:center;border-bottom:1px solid #e8eeeb}.data th{background:#173f35;color:#fff}.notice{padding:11px;background:#f7faf8;border:1px solid #e0e8e4;border-radius:10px;font-size:10px;line-height:2;color:#586a63}.error{padding:16px;background:#fff4f4;border:1px solid #efcdca;border-radius:11px;color:#922d29;font-size:11px;line-height:2}.empty{text-align:center;padding:35px;color:#687770}@media(max-width:900px){.identity-grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.identity-grid,.cards{grid-template-columns:1fr 1fr}.head{align-items:stretch;flex-direction:column}.actions .btn{flex:1}.toolbar{align-items:stretch;flex-direction:column}.toolbar select{width:100%}.tabs{gap:5px}.tab{font-size:10px;padding:11px 5px}.chart{height:280px}.chart canvas{height:235px!important}}@media print{.tabs,.toolbar,.actions{display:none!important}.panel{box-shadow:none}}
</style>
</head>
<body>
<main class="wrap">
<header class="panel head"><div><h1>گزارشات گله</h1><div class="muted">گزارش فقط برای همان گله‌ای است که از ثبت هفتگی وارد شده است.</div></div><div class="actions"><button id="back" class="btn">بازگشت به ثبت گزارش</button><button id="print" class="btn primary">چاپ</button></div></header>
<section class="panel identity"><div id="identity" class="identity-grid"></div></section>
<nav class="panel tabs"><button class="tab active" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="overall">گزارش کلی گله</button><button class="tab" data-tab="compare">گزارش مقایسه‌ای</button></nav>
<section class="panel toolbar"><div><b>هفته گزارش:</b> <select id="week"></select></div><span id="scope" class="badge">در حال تعیین گله…</span></section>
<section id="root" class="panel"><div class="empty">در حال بارگذاری…</div></section>
</main>
<script>
'use strict';
(async function(){
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const flockId=params.get('flock_id')||params.get('flockId')||params.get('id');
let flock=null,rows=[],tab='weekly',charts=[];
const num=x=>{if(x===null||x===undefined||x==='')return null;const v=Number(String(x).replace(/,/g,'').trim());return Number.isFinite(v)?v:null};
const fmt=(x,d=1)=>num(x)==null?'—':num(x).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d});
const val=(r,keys)=>{for(const k of keys){const v=num(r&&r[k]);if(v!==null)return v}return null};
const production=x=>{const s=String(x||'').toLowerCase();if(s.includes('broiler')||s.includes('گوشتی'))return 'گوشتی';if(s.includes('pullet')||s.includes('پولت'))return 'پولت';if(s.includes('layer')||s.includes('تخم'))return 'تخم‌گذار';if(s.includes('breeder')||s.includes('مادر'))return 'مادر';return x||'—'};
const flockName=()=>flock?.name||flock?.flock_name||flock?.flock_code||'—';
function destroy(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
function makeChart(canvasId,labels,datasets){const c=$(canvasId);if(!c||!window.Chart)return;charts.push(new Chart(c,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:false}}}}))}
function getStandard(r,metric){try{if(typeof window.resolvePoultryStandard!=='function')return null;const s=window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:num(r.age_days)});return num(s&&s[metric])}catch(e){return null}}
async function load(){
if(!flockId){throw new Error('شناسه گله از ثبت هفتگی به گزارش منتقل نشده است. گزارش متوقف شد تا از نمایش گله اشتباه جلوگیری شود.')}
if(!window.supabaseClient)throw new Error('اتصال پایگاه داده آماده نیست.');
const auth=await supabaseClient.auth.getUser();if(auth.error||!auth.data?.user)throw new Error('کاربر وارد نشده است.');
const fr=await supabaseClient.from('flocks').select('*').eq('id',flockId).maybeSingle();if(fr.error)throw fr.error;if(!fr.data)throw new Error('گله انتخاب‌شده پیدا نشد. هیچ گله دیگری جایگزین نمی‌شود.');
flock=fr.data;
const wr=await supabaseClient.from('weekly_records').select('*').eq('flock_id',flockId).order('week_number',{ascending:true});if(wr.error)throw wr.error;rows=Array.isArray(wr.data)?wr.data:[];
if(!rows.length)throw new Error('برای همین گله هنوز پایش هفتگی ثبت نشده است.');
renderIdentity();populateWeeks();render();
}
function renderIdentity(){const t=production(flock.production_type);$('identity').innerHTML=`<div class="identity-item"><small>گله</small><strong>${flockName()}</strong></div><div class="identity-item"><small>نوع پرورش</small><strong>${t}</strong></div><div class="identity-item"><small>ژنتیک</small><strong>${flock.genetics||flock.genetic_line||'—'}</strong></div><div class="identity-item"><small>سویه</small><strong>${flock.strain||flock.breed||'—'}</strong></div><div class="identity-item"><small>پایش واقعی</small><strong>${fmt(rows.length,0)} هفته</strong></div>`;$('scope').textContent='گله: '+flockName()}
function populateWeeks(){const s=$('week');s.innerHTML=rows.map((r,i)=>`<option value="${i}">هفته ${fmt(r.week_number,0)} — ${fmt(r.age_days,0)} روز</option>`).join('');const wanted=num(params.get('week_number'));if(wanted!==null){const i=rows.findIndex(r=>num(r.week_number)===wanted);if(i>=0)s.value=String(i)}}
function card(a){return '<div class="cards">'+a.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="ref">${x[2]||''}</div></div>`).join('')+'</div>'}
function renderWeekly(){destroy();const r=rows[Number($('week').value)||0];const t=production(flock.production_type);const q=rows.filter(x=>num(x.week_number)<=num(r.week_number));const labels=q.map(x=>'هفته '+fmt(x.week_number,0));const w=getStandard(r,'weight');const fcrStd=getStandard(r,'fcr');const actualWeight=val(r,['average_weight_g','avg_weight_g','weight_g']);const weeklyFcr=val(r,['fcr_weekly','weekly_fcr','fcr']);const cumFcr=val(r,['fcr_cumulative','cumulative_fcr','cum_fcr']);let items=[['سن',fmt(r.age_days,0)+' روز'],['میانگین وزن',fmt(actualWeight,1)+' گرم',w!==null?'مرجع: '+fmt(w,1)+' گرم':'مرجع رسمی در این سن ثبت نشده'],['CV',fmt(val(r,['cv_percent','cv']),2)+' %'],['یکنواختی ±10',fmt(val(r,['uniformity_10_percent','uniformity_10']),1)+' %'],['یکنواختی ±15',fmt(val(r,['uniformity_15_percent','uniformity_15']),1)+' %'],['دان',fmt(val(r,['feed_total_kg','feed_kg']),1)+' kg'],['آب',fmt(val(r,['water_total_liter','water_liter']),1)+' L'],['تلفات',fmt(val(r,['mortality_count','mortality','deaths']),0)+' قطعه']];if(t==='گوشتی')items.push(['FCR هفتگی',fmt(weeklyFcr,3),fcrStd!==null?'مرجع: '+fmt(fcrStd,3):'مرجع رسمی در این سن ثبت نشده'],['FCR تجمعی',fmt(cumFcr,3)]);$('root').innerHTML=`<section class="section"><h2>گزارش هفتگی — هفته ${fmt(r.week_number,0)}</h2>${card(items)}</section><section class="section"><div class="grid"><div class="box chart"><h3>روند وزن تا هفته انتخاب‌شده</h3><canvas id="cw"></canvas></div><div class="box chart"><h3>${t==='گوشتی'?'FCR هفتگی و تجمعی':'CV و یکنواختی'}</h3><canvas id="cq"></canvas></div></div></section>`;makeChart('cw',labels,[{label:'واقعی',data:q.map(x=>val(x,['average_weight_g','avg_weight_g','weight_g']))},{label:'مرجع رسمی',data:q.map(x=>getStandard(x,'weight'))}]);makeChart('cq',labels,t==='گوشتی'?[{label:'FCR هفتگی',data:q.map(x=>val(x,['fcr_weekly','weekly_fcr','fcr']))},{label:'FCR تجمعی',data:q.map(x=>val(x,['fcr_cumulative','cumulative_fcr','cum_fcr']))},{label:'مرجع رسمی',data:q.map(x=>getStandard(x,'fcr'))}]:[{label:'CV %',data:q.map(x=>val(x,['cv_percent','cv']))},{label:'یکنواختی ±10 %',data:q.map(x=>val(x,['uniformity_10_percent','uniformity_10']))}])}
function renderOverall(){destroy();const t=production(flock.production_type);const labels=rows.map(x=>'هفته '+fmt(x.week_number,0));$('root').innerHTML=`<section class="section"><h2>گزارش کلی گله</h2><div class="notice">فقط ${fmt(rows.length,0)} پایش واقعی همین گله در محاسبات استفاده شده است. هیچ رکوردی از گله دیگر وارد گزارش نمی‌شود.</div></section><section class="section"><div class="grid"><div class="box chart"><h3>روند وزن واقعی و مرجع</h3><canvas id="ow"></canvas></div><div class="box chart"><h3>${t==='گوشتی'?'روند FCR هفتگی و تجمعی':'روند شاخص‌های کیفیت'}</h3><canvas id="of"></canvas></div></div></section><section class="section"><div class="table-wrap"><table class="data"><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>CV</th><th>یکنواختی ±10</th><th>دان</th><th>تلفات</th><th>FCR هفتگی</th><th>FCR تجمعی</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmt(r.week_number,0)}</td><td>${fmt(r.age_days,0)}</td><td>${fmt(val(r,['average_weight_g','avg_weight_g','weight_g']),1)}</td><td>${fmt(val(r,['cv_percent','cv']),2)}%</td><td>${fmt(val(r,['uniformity_10_percent','uniformity_10']),1)}%</td><td>${fmt(val(r,['feed_total_kg','feed_kg']),1)}</td><td>${fmt(val(r,['mortality_count','mortality','deaths']),0)}</td><td>${fmt(val(r,['fcr_weekly','weekly_fcr','fcr']),3)}</td><td>${fmt(val(r,['fcr_cumulative','cumulative_fcr','cum_fcr']),3)}</td></tr>`).join('')}</tbody></table></div></section>`;makeChart('ow',labels,[{label:'وزن واقعی',data:rows.map(r=>val(r,['average_weight_g','avg_weight_g','weight_g']))},{label:'مرجع رسمی',data:rows.map(r=>getStandard(r,'weight'))}]);makeChart('of',labels,t==='گوشتی'?[{label:'FCR هفتگی',data:rows.map(r=>val(r,['fcr_weekly','weekly_fcr','fcr']))},{label:'FCR تجمعی',data:rows.map(r=>val(r,['fcr_cumulative','cumulative_fcr','cum_fcr']))},{label:'مرجع رسمی',data:rows.map(r=>getStandard(r,'fcr'))}]:[{label:'CV %',data:rows.map(r=>val(r,['cv_percent','cv']))},{label:'یکنواختی ±10 %',data:rows.map(r=>val(r,['uniformity_10_percent','uniformity_10']))}])}
function renderCompare(){destroy();const labels=rows.map(x=>'هفته '+fmt(x.week_number,0));const t=production(flock.production_type);$('root').innerHTML=`<section class="section"><h2>گزارش مقایسه‌ای</h2><div class="notice">مرجع رسمی در صورت وجود و انطباق با نوع پرورش، ژنتیک، سویه و سن نمایش داده می‌شود. در نبود مرجع رسمی، موتور Benchmark مدیریتی مرجع جایگزین خواهد بود؛ این صفحه هرگز استاندارد یک سویه دیگر را به گله تحمیل نمی‌کند.</div></section><section class="section"><div class="grid"><div class="box chart"><h3>وزن واقعی در برابر مرجع</h3><canvas id="xw"></canvas></div><div class="box chart"><h3>${t==='گوشتی'?'FCR هفتگی، تجمعی و مرجع':'CV و یکنواختی'}</h3><canvas id="xf"></canvas></div></div></section>`;makeChart('xw',labels,[{label:'واقعی',data:rows.map(r=>val(r,['average_weight_g','avg_weight_g','weight_g']))},{label:'مرجع رسمی',data:rows.map(r=>getStandard(r,'weight'))}]);makeChart('xf',labels,t==='گوشتی'?[{label:'FCR هفتگی',data:rows.map(r=>val(r,['fcr_weekly','weekly_fcr','fcr']))},{label:'FCR تجمعی',data:rows.map(r=>val(r,['fcr_cumulative','cumulative_fcr','cum_fcr']))},{label:'مرجع رسمی',data:rows.map(r=>getStandard(r,'fcr'))}]:[{label:'CV %',data:rows.map(r=>val(r,['cv_percent','cv']))},{label:'یکنواختی ±10 %',data:rows.map(r=>val(r,['uniformity_10_percent','uniformity_10']))}])}
function render(){if(tab==='weekly')renderWeekly();else if(tab==='overall')renderOverall();else renderCompare()}
$('week').addEventListener('change',()=>{if(tab==='weekly')renderWeekly()});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()}));$('print').addEventListener('click',()=>window.print());$('back').addEventListener('click',()=>{location.href='weekly.html'+(flockId?'?flock_id='+encodeURIComponent(flockId):'')});
try{await load()}catch(e){console.error(e);$('root').innerHTML=`<div class="error"><b>گزارش بارگذاری نشد.</b><br>${e.message||'خطای ناشناخته'}</div>`;$('identity').innerHTML='';$('scope').textContent='گله مشخص نیست'}
})();
</script>
</body>
</html>
