<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش عملکرد گله | مرکز تخصصی سلامت طیور آدینه</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{box-sizing:border-box}body{margin:0;padding-bottom:88px;background:#f4f7f6;color:#17231f;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1450px,96%);margin:14px auto 30px}.panel{background:#fff;border:1px solid #dfe8e3;border-radius:16px;box-shadow:0 5px 18px rgba(20,45,38,.06);margin-bottom:12px}.head{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{margin:0;font-size:19px}.muted{margin-top:5px;color:#687770;font-size:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font:inherit;font-weight:900;cursor:pointer}.btn.primary{background:#173f35;color:#fff}.btn.secondary{background:#edf2ef;color:#24463b}.identity{padding:11px}.identity-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.identity-item{background:#f7faf8;border:1px solid #e0e8e4;border-radius:10px;padding:9px}.identity-item small{display:block;color:#738079;font-size:8px}.identity-item strong{display:block;margin-top:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs{display:flex;flex-direction:row!important;align-items:stretch;gap:7px;padding:7px}.tab{flex:1;min-width:0;padding:11px 8px;border:1px solid #d7e1dc;border-radius:10px;background:#fff;font:inherit;font-size:11px;font-weight:900;cursor:pointer;white-space:nowrap;color:#33463f}.tab.active{background:#173f35;color:#fff}.toolbar{padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar select{min-width:210px;padding:8px;border:1px solid #d5dfda;border-radius:9px;font:inherit}.badge{padding:6px 9px;border-radius:18px;background:#eef4f1;color:#42665a;font-size:9px;font-weight:900}.section{padding:15px 17px}.section h2{margin:0 0 11px;font-size:16px}.section h3{margin:0 0 9px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:10px;border:1px solid #e0e8e4;border-radius:10px;background:#f9fbfa}.label{font-size:8px;color:#738079;font-weight:800}.value{margin-top:5px;font-size:16px;font-weight:900}.ref{margin-top:3px;font-size:8px;color:#687770;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #e0e8e4;border-radius:11px;padding:10px}.chart{height:300px}.chart canvas{height:255px!important}.notice{padding:10px;background:#f7faf8;border:1px solid #e0e8e4;border-radius:9px;font-size:9px;line-height:2;color:#586a63}.error{padding:15px;background:#fff4f4;border:1px solid #efcdca;border-radius:10px;color:#922d29;font-size:10px;line-height:2}.empty{text-align:center;padding:35px;color:#687770;font-size:10px}.table-wrap{overflow:auto}.data{width:100%;min-width:900px;border-collapse:collapse;font-size:9px}.data th,.data td{padding:7px;text-align:center;border-bottom:1px solid #e8eeeb}.data th{background:#173f35;color:#fff}.bottom-navigation{position:fixed;z-index:1000;right:0;left:0;bottom:0;height:72px;display:flex;align-items:stretch;justify-content:center;gap:0;background:rgba(255,255,255,.97);border-top:1px solid #dfe6e2;box-shadow:0 -5px 20px rgba(20,45,38,.10);padding:6px max(10px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right));backdrop-filter:blur(10px)}.bottom-nav-item{flex:1;max-width:150px;border:0;background:transparent;color:#718079;font:inherit;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:12px}.bottom-nav-item.active{color:#173f35;background:#edf4f1}.bottom-nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}.bottom-nav-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(max-width:850px){.identity-grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.identity-grid,.cards{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:stretch}.actions .btn{flex:1}.tabs{gap:4px}.tab{font-size:9px;padding:10px 3px}.toolbar{flex-direction:column;align-items:stretch}.toolbar select{width:100%}.bottom-navigation{height:68px}.bottom-nav-item{font-size:9px}}@media print{body{padding-bottom:0}.tabs,.toolbar,.actions,.bottom-navigation{display:none!important}.panel{box-shadow:none}}</style></head><body><main class="wrap"><header class="panel head"><div><h1>گزارش عملکرد گله</h1><div class="muted">گزارش فقط از همان گله‌ای ساخته می‌شود که از ثبت هفتگی وارد شده است.</div></div><div class="actions"><button class="btn secondary" id="back">بازگشت به ثبت گزارش</button><button class="btn primary" onclick="window.print()">چاپ</button></div></header><section class="panel identity"><div id="identity" class="identity-grid"></div></section><nav class="panel tabs"><button class="tab active" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="overall">گزارش جامع عملکرد گله</button><button class="tab" data-tab="compare">گزارش مقایسه‌ای</button></nav><section class="panel toolbar"><div><b>هفته گزارش:</b> <select id="week"></select></div><span id="scope" class="badge">در حال بارگذاری…</span></section><section id="root" class="panel"><div class="empty">در حال بارگذاری گله انتخاب‌شده…</div></section></main><nav class="bottom-navigation" aria-label="ناوبری اصلی"><button type="button" class="bottom-nav-item" onclick="location.href='Dashboard.html'" aria-label="خانه"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6"></path></svg></span><span>خانه</span></button><button type="button" class="bottom-nav-item" onclick="location.href='flocks.html'" aria-label="فارم‌ها"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"></path><path d="M7 21v-7h10v7"></path><path d="M9 10h6"></path><path d="M12 7v3"></path></svg></span><span>فارم‌ها</span></button><button type="button" class="bottom-nav-item" onclick="location.href='weekly.html'+(new URLSearchParams(location.search).get('flock_id')?'?flockId='+encodeURIComponent(new URLSearchParams(location.search).get('flock_id')):'')" aria-label="ثبت هفتگی"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h17"></path><path d="M6.5 15l4-4 3 2 5-6"></path><circle cx="6.5" cy="15" r="1"></circle><circle cx="10.5" cy="11" r="1"></circle><circle cx="13.5" cy="13" r="1"></circle><circle cx="18.5" cy="7" r="1"></circle></svg></span><span>ثبت هفتگی</span></button><button type="button" class="bottom-nav-item active" aria-label="گزارش‌ها"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"></path><path d="M15 3v5h5"></path><path d="M9 12h6"></path><path d="M9 16h6"></path><path d="M9 8h2"></path></svg></span><span>گزارش‌ها</span></button></nav><script>'use strict';(async function(){const $=id=>document.getElementById(id);const p=new URLSearchParams(location.search);const flockId=p.get('flock_id')||p.get('flockId')||p.get('id');let flock=null,rows=[],tab='weekly',charts=[];const num=x=>{if(x===null||x===undefined||x==='')return null;const n=Number(String(x).replace(/,/g,'').trim());return Number.isFinite(n)?n:null};const fmt=(x,d=1)=>num(x)==null?'—':num(x).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d});const val=(r,keys)=>{for(const k of keys){const n=num(r?.[k]);if(n!==null)return n}return null};const type=x=>{const s=String(x||'').toLowerCase();if(/broiler|گوشتی|meat/.test(s))return'گوشتی';if(/pullet|پولت/.test(s))return'پولت';if(/layer|تخم/.test(s))return'تخم‌گذار';if(/breeder|مادر/.test(s))return'مادر';return x||'—'};function destroy(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}function standard(r,key){try{if(typeof resolvePoultryStandard!=='function')return null;const s=resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:num(r.age_days)});return num(s?.[key])}catch(e){return null}}function makeChart(id,labels,datasets){const c=$(id);if(!c||!window.Chart)return;charts.push(new Chart(c,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:false}}}}))}async function load(){if(!flockId)throw Error('شناسه گله از ثبت هفتگی منتقل نشده است؛ برای جلوگیری از نمایش گله اشتباه، گزارش متوقف شد.');const au=await supabaseClient.auth.getUser();if(au.error||!au.data?.user)throw Error('کاربر وارد نشده است.');const fr=await supabaseClient.from('flocks').select('*').eq('id',flockId).maybeSingle();if(fr.error)throw fr.error;if(!fr.data)throw Error('گله انتخاب‌شده پیدا نشد؛ هیچ گله دیگری جایگزین نمی‌شود.');flock=fr.data;const wr=await supabaseClient.from('weekly_records').select('*').eq('flock_id',flockId).order('week_number',{ascending:true});if(wr.error)throw wr.error;rows=Array.isArray(wr.data)?wr.data:[];if(!rows.length)throw Error('برای همین گله هنوز گزارش هفتگی ثبت نشده است.');renderIdentity();const wanted=num(p.get('week_number')??p.get('week'));$('week').innerHTML=rows.map((r,i)=>`<option value="${i}">هفته ${fmt(r.week_number,0)} — ${fmt(r.age_days,0)} روز</option>`).join('');const wi=rows.findIndex(r=>num(r.week_number)===wanted);if(wi>=0)$('week').value=String(wi);render()}function renderIdentity(){const name=flock.flock_name||flock.name||flock.flock_code||'—';$('identity').innerHTML=`<div class="identity-item"><small>گله</small><strong>${name}</strong></div><div class="identity-item"><small>نوع پرورش</small><strong>${type(flock.production_type)}</strong></div><div class="identity-item"><small>ژنتیک</small><strong>${flock.genetics||flock.genetic_line||'—'}</strong></div><div class="identity-item"><small>سویه</small><strong>${flock.strain||flock.breed||'—'}</strong></div><div class="identity-item"><small>پایش واقعی</small><strong>${fmt(rows.length,0)} هفته</strong></div>`;$('scope').textContent='گله انتخاب‌شده: '+name}function cards(a){return'<div class="cards">'+a.map(x=>`<div class="metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="ref">${x[2]||''}</div></div>`).join('')+'</div>'}function weekly(){destroy();const r=rows[Number($('week').value)||0],t=type(flock.production_type),qs=rows.filter(x=>num(x.week_number)<=num(r.week_number)),labels=qs.map(x=>'هفته '+fmt(x.week_number,0)),w=standard(r,'weight'),fs=standard(r,'fcr');const items=[['سن',fmt(r.age_days,0)+' روز'],['میانگین وزن',fmt(val(r,['average_weight_g','avg_weight_g','weight_g']),1)+' گرم',w!==null?'استاندارد رسمی: '+fmt(w,1)+' گرم':'مرجع رسمی موجود نیست'],['CV',fmt(val(r,['cv_percent','cv']),2)+' %'],['یکنواختی ±10',fmt(val(r,['uniformity_10_percent','uniformity_10']),1)+' %'],['یکنواختی ±15',fmt(val(r,['uniformity_15_percent','uniformity_15']),1)+' %'],['دان',fmt(val(r,['feed_total_kg','feed_kg']),1)+' kg'],['آب',fmt(val(r,['water_total_liter','water_liter']),1)+' L'],['تلفات',fmt(val(r,['mortality_count','mortality','deaths']),0)+' قطعه']];if(t==='گوشتی')items.push(['FCR هفتگی',fmt(val(r,['fcr_weekly','weekly_fcr','fcr']),3),fs!==null?'استاندارد رسمی: '+fmt(fs,3):'مرجع رسمی موجود نیست'],['FCR تجمعی',fmt(val(r,['fcr_cumulative','cumulative_fcr','cum_fcr']),3)]);$('root').innerHTML=`<section class="section"><h2>گزارش هفتگی — هفته ${fmt(r.week_number,0)}</h2>${cards(items)}</section><section class="section"><div class="grid"><div class="box chart"><h3>وزن واقعی در برابر مرجع</h3><canvas id="w1"></canvas></div><div class="box chart"><h3>${t==='گوشتی'?'FCR هفتگی و تجمعی':'CV و یکنواختی'}</h3><canvas id="w2"></canvas></div></div></section>`;makeChart('w1',labels,[{label:'واقعی',data:qs.map(x=>val(x,['average_weight_g','avg_weight_g','weight_g']))},{label:'استاندارد رسمی',data:qs.map(x=>standard(x,'weight'))}]);makeChart('w2',labels,t==='گوشتی'?[{label:'FCR هفتگی',data:qs.map(x=>val(x,['fcr_weekly','weekly_fcr','fcr']))},{label:'FCR تجمعی',data:qs.map(x=>val(x,['fcr_cumulative','cumulative_fcr','cum_fcr']))},{label:'استاندارد رسمی',data:qs.map(x=>standard(x,'fcr'))}]:[{label:'CV %',data:qs.map(x=>val(x,['cv_percent','cv']))},{label:'یکنواختی ±10 %',data:qs.map(x=>val(x,['uniformity_10_percent','uniformity_10']))}])}function overall(){destroy();const t=type(flock.production_type),labels=rows.map(x=>'هفته '+fmt(x.week_number,0));$('root').innerHTML=`<section class="section"><h2>گزارش جامع عملکرد گله</h2><div class="notice">این گزارش از ${fmt(rows.length,0)} پایش واقعی همین گله ساخته شده است؛ هیچ گله دیگری وارد محاسبات نمی‌شود.</div></section><section class="section"><div class="grid"><div class="box chart"><h3>روند وزن گله</h3><canvas id="o1"></canvas></div><div class="box chart"><h3>${t==='گوشتی'?'روند FCR هفتگی و تجمعی':'روند شاخص‌های اصلی'}</h3><canvas id="o2"></canvas></div></div></section><section class="section"><div class="table-wrap"><table class="data"><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>CV</th><th>یکنواختی</th><th>دان</th><th>آب</th><th>تلفات</th>${t==='گوشتی'?'<th>FCR هفتگی</th><th>FCR تجمعی</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td>${fmt(r.week_number,0)}</td><td>${fmt(r.age_days,0)}</td><td>${fmt(val(r,['average_weight_g','avg_weight_g','weight_g']),1)}</td><td>${fmt(val(r,['cv_percent','cv']),2)}%</td><td>${fmt(val(r,['uniformity_10_percent','uniformity_10']),1)}%</td><td>${fmt(val(r,['feed_total_kg','feed_kg']),1)}</td><td>${fmt(val(r,['water_total_liter','water_liter']),1)}</td><td>${fmt(val(r,['mortality_count','mortality','deaths']),0)}</td>${t==='گوشتی'?`<td>${fmt(val(r,['fcr_weekly','weekly_fcr','fcr']),3)}</td><td>${fmt(val(r,['fcr_cumulative','cumulative_fcr','cum_fcr']),3)}</td>`:''}</tr>`).join('')}</tbody></table></div></section>`;makeChart('o1',labels,[{label:'وزن واقعی',data:rows.map(r=>val(r,['average_weight_g','avg_weight_g','weight_g']))},{label:'استاندارد رسمی',data:rows.map(r=>standard(r,'weight'))}]);makeChart('o2',labels,t==='گوشتی'?[{label:'FCR هفتگی',data:rows.map(r=>val(r,['fcr_weekly','weekly_fcr','fcr']))},{label:'FCR تجمعی',data:rows.map(r=>val(r,['fcr_cumulative','cumulative_fcr','cum_fcr']))},{label:'استاندارد رسمی',data:rows.map(r=>standard(r,'fcr'))}]:[{label:'CV %',data:rows.map(r=>val(r,['cv_percent','cv']))},{label:'یکنواختی ±10 %',data:rows.map(r=>val(r,['uniformity_10_percent','uniformity_10']))}])}function compare(){destroy();const t=type(flock.production_type),r=rows[Number($('week').value)||rows.length-1],w=val(r,['average_weight_g','avg_weight_g','weight_g']),ws=standard(r,'weight'),f=val(r,['fcr_weekly','weekly_fcr','fcr']),fs=standard(r,'fcr');$('root').innerHTML=`<section class="section"><h2>گزارش مقایسه‌ای</h2><div class="notice">مرجع رسمی فقط برای همین نوع پرورش، ژنتیک، سویه و سن استفاده می‌شود؛ در نبود مرجع رسمی، موتور Benchmark مدیریتی باید مرجع جایگزین را فراهم کند.</div>${cards([['وزن واقعی',fmt(w,1)+' گرم'],['مرجع وزن',fmt(ws,1)+' گرم',ws!==null?'استاندارد رسمی':'—'],['اختلاف وزن',w!==null&&ws!==null?fmt(w-ws,1)+' گرم':'—'],...(t==='گوشتی'?[['FCR هفتگی',fmt(f,3)],['مرجع FCR',fmt(fs,3),fs!==null?'استاندارد رسمی':'—'],['اختلاف FCR',f!==null&&fs!==null?fmt(f-fs,3):'—']]:[])])}</section>`}function render(){if(tab==='weekly')weekly();else if(tab==='overall')overall();else compare()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});$('week').onchange=()=>render();$('back').onclick=()=>{location.href='weekly.html'+(flockId?'?flockId='+encodeURIComponent(flockId):'')};try{await load()}catch(e){console.error(e);$('root').innerHTML='<div class="error">'+e.message+'</div>';$('identity').innerHTML='<div class="error">گله انتخاب‌شده از ثبت هفتگی به این صفحه نرسیده است.</div>'}})();</script>    <script src="health-records-runtime-v2.js"></script>
</body></html>
