<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#17231f;font-family:Tahoma,Arial,sans-serif;padding-bottom:30px}.wrap{width:min(1450px,94%);margin:22px auto}.hero,.panel{background:#fff;border:1px solid #e2e9e5;border-radius:18px;box-shadow:0 5px 20px rgba(20,40,35,.06);margin-bottom:14px}.hero{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.hero h1{margin:0 0 6px;font-size:23px}.muted{font-size:11px;color:#687770;line-height:2}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer}.back{background:#edf2ef;color:#24463b}.print{background:#173f35;color:#fff}.identity{padding:14px}.identity-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.identity-item{background:#f7faf9;border:1px solid #e1e9e5;border-radius:11px;padding:10px}.identity-item b{display:block;font-size:9px;color:#74817c}.identity-item span{display:block;margin-top:5px;font-size:13px;font-weight:900}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tab{border:1px solid #d7e0dc;background:#fff;border-radius:12px;padding:13px;font:inherit;font-weight:900;color:#34463f;cursor:pointer}.tab.active{background:#173f35;color:#fff;border-color:#173f35}.toolbar{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.week{display:flex;align-items:center;gap:8px;font-weight:800}.week select{min-width:190px;padding:9px;border:1px solid #d5dfda;border-radius:9px;font:inherit;background:#fff}.section{padding:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2,.section-title h3{margin:0}.badge{font-size:10px;font-weight:900;padding:5px 9px;border-radius:18px;background:#edf4f0;color:#406457}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#f8faf9;border:1px solid #e0e9e5;border-radius:12px;padding:11px;min-height:76px}.label{font-size:9px;color:#718079;font-weight:800}.value{font-size:19px;font-weight:900;margin-top:6px}.ref{font-size:9px;color:#687770;margin-top:4px;line-height:1.6}.comparison{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.compare{border:1px solid #e0e8e4;border-radius:12px;padding:12px}.compare h3{margin:0 0 8px;font-size:13px}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #edf1ef;font-size:11px}.row:last-child{border-bottom:0}.ok{color:#20734e}.bad{color:#a62c2c}.warn{color:#9b6716}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chart-box{height:320px;border:1px solid #e0e8e4;border-radius:13px;padding:10px}.chart-box h3{font-size:12px;margin:3px 6px 8px}.chart-box canvas{height:270px!important}.notice{padding:11px;border:1px solid #e0e8e4;border-radius:10px;background:#f6f9f7;font-size:10px;line-height:2;color:#5e6d67}.table-wrap{overflow:auto}.table{width:100%;min-width:1100px;border-collapse:collapse;font-size:10px}.table th,.table td{padding:8px;text-align:center;border-bottom:1px solid #e5ebe8}.table th{background:#173f35;color:#fff}.error{padding:16px;border-radius:12px;background:#fff4f4;color:#8c2525;border:1px solid #efcccc;line-height:2;font-size:12px}@media(max-width:900px){.identity-grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.comparison,.chart-grid{grid-template-columns:1fr}}@media(max-width:600px){.hero{flex-direction:column;align-items:stretch}.identity-grid,.cards,.tabs{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.week select{width:100%}.chart-box{height:285px}.chart-box canvas{height:235px!important}}@media print{.tabs,.actions,.toolbar{display:none!important}.hero,.panel{box-shadow:none;border:0}}

<body>
<main class="wrap">
<header class="hero"><div><h1>گزارشات گله</h1><div class="muted">گزارش مستقیماً از گله انتخاب‌شده در ثبت هفتگی و سوابق واقعی همان گله ساخته می‌شود.</div></div><div class="actions"><button class="btn back" id="back">بازگشت به ثبت گزارش</button><button class="btn print" onclick="window.print()">چاپ</button></div></header>
<section class="panel identity"><div id="identity" class="identity-grid"></div></section>
<nav class="tabs"><button class="tab active" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="comprehensive">گزارش کلی گله</button><button class="tab" data-tab="comparison">گزارش مقایسه‌ای</button></nav>
<section class="panel toolbar"><div class="week"><label for="week">هفته گزارش:</label><select id="week"></select></div><span id="scope" class="badge">گله انتخاب‌شده</span></section>
<section id="root" class="panel"></section>
</main>
<script>
'use strict';
(async function(){
const $=id=>document.getElementById(id),num=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:null},fmt=(v,d=1,u='')=>num(v)==null?'—':num(v).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d})+u;
const TYPES={broiler:'گوشتی',pullet:'پولت',layer:'تخم‌گذار',breeder:'مادر'};
let flock=null,rows=[],built=[],tab='weekly',charts=[];const params=new URLSearchParams(location.search);const requestedId=params.get('flock_id');
function engine(){const t=String(flock?.production_type||'').toLowerCase();if(/broiler|گوشتی|meat/.test(t))return window.BROILER_REPORT_ENGINE;if(/pullet|پولت/.test(t))return window.PULLET_REPORT_ENGINE;if(/layer|تخم/.test(t))return window.LAYER_REPORT_ENGINE;if(/breeder|مادر/.test(t))return window.BREEDER_REPORT_ENGINE;return null}
function destroy(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
function standard(age,metric){if(!flock||!window.resolvePoultryStandard)return null;const s=window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:age});return metric==='weight'?num(s?.weight):metric==='fcr'?num(s?.fcr):null}
async function reference(age,metric){const official=standard(age,metric);if(official!=null)return{value:official,source:'استاندارد رسمی'};if(window.AdineBenchmark?.resolve){const r=await window.AdineBenchmark.resolve({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:age,metric,official:null});if(r&&num(r.value)!=null)return{value:num(r.value),source:'استاندارد مدیریتی'};}return{value:null,source:'مرجع موجود نیست'}}
function delta(actual,ref,lowerBetter=false){if(actual==null||ref==null)return{txt:'—',cls:'warn'};const d=actual-ref,p=ref?d/ref*100:0;const bad=lowerBetter?d>0:d<0;return{txt:fmt(d,2)+' ('+fmt(p,1)+'%)',cls:bad?'bad':'ok'}}
function identity(){const t=String(flock?.production_type||'').toLowerCase();let k=Object.keys(TYPES).find(x=>t.includes(x)||({broiler:'گوشتی',pullet:'پولت',layer:'تخم',breeder:'مادر'}[x]&&t.includes({broiler:'گوشتی',pullet:'پولت',layer:'تخم',breeder:'مادر'}[x])));$('identity').innerHTML=`<div class="identity-item"><b>گله</b><span>${flock?.flock_name||'—'}</span></div><div class="identity-item"><b>نوع پرورش</b><span>${TYPES[k]||flock?.production_type||'—'}</span></div><div class="identity-item"><b>ژنتیک</b><span>${flock?.genetics||'—'}</span></div><div class="identity-item"><b>سویه</b><span>${flock?.strain||'—'}</span></div><div class="identity-item"><b>پایش واقعی</b><span>${fmt(rows.length,0)} هفته</span></div>`}
function draw(id,labels,datasets){const el=$(id);if(!el)return;charts.push(new Chart(el,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:false}}}}))}
function commonCards(r,x,w){return [['سن',fmt(r.age_days,0,' روز'),''],['وزن',fmt(r.average_weight_g,1,' گرم'),`${w.source}: ${fmt(w.value,1,' گرم')}`],['اختلاف وزن',delta(num(r.average_weight_g),w.value).txt,''],['CV',fmt(r.cv_percent,2,'%'),''],['یکنواختی ±10%',fmt(r.uniformity_10_percent,1,'%'),''],['یکنواختی ±15%',fmt(r.uniformity_15_percent,1,'%'),''],['دان',fmt(r.feed_total_kg,1,' کیلوگرم'),''],['آب',fmt(r.water_total_liter,1,' لیتر'),''],['تلفات',fmt(r.mortality_count,0,' قطعه'),'']].concat(x)}
async function renderWeekly(){destroy();const wi=rows.findIndex(r=>String(r.week_number)===String($('week').value));const r=rows[wi>=0?wi:rows.length-1],t=engine(),w=await reference(num(r.age_days),'weight');let extra=[];if(t===window.BROILER_REPORT_ENGINE){const x=built[wi>=0?wi:built.length-1]||{};const f=await reference(num(r.age_days),'fcr');extra=[['FCR هفتگی',fmt(x.weeklyFcr??r.fcr,3),`${f.source}: ${fmt(f.value,3)}`],['FCR تجمعی',fmt(x.cumulativeFcr??r.cumulative_fcr,3),'تجمعی از سوابق واقعی همین گله']];}else if(t===window.LAYER_REPORT_ENGINE)extra=[['تولید تخم',fmt(r.hen_day_production??r.egg_production_percent,1,'%'),''],['وزن تخم',fmt(r.egg_weight_g,1,' گرم'),''],['Egg Mass',fmt(r.egg_mass_g,1,' گرم'),''],['FCR',fmt(r.fcr,3),'']];else if(t===window.BREEDER_REPORT_ENGINE)extra=[['تولید روزانه',fmt(r.hen_day_production,1,'%'),''],['باروری',fmt(r.fertility_percent,1,'%'),''],['هچ‌پذیری',fmt(r.hatchability_percent,1,'%'),'']];else extra=[['دان/پرنده',fmt(r.feed_per_bird_g,1,' گرم'),'']];
$('root').innerHTML=`<section class="section"><div class="section-title"><h2>گزارش هفتگی — هفته ${fmt(r.week_number,0)}</h2><span class="badge">فقط داده ثبت‌شده همین گله</span></div><div class="cards">${commonCards(r,extra,w).map(a=>`<div class="card"><div class="label">${a[0]}</div><div class="value">${a[1]}</div><div class="ref">${a[2]}</div></div>`).join('')}</div></section><section class="section"><div class="section-title"><h3>مقایسه با مرجع</h3><span class="badge">${w.source}</span></div><div class="comparison"><div class="compare"><h3>وزن</h3><div class="row"><span>واقعی</span><b>${fmt(r.average_weight_g,1,' گرم')}</b></div><div class="row"><span>مرجع</span><b>${fmt(w.value,1,' گرم')}</b></div><div class="row"><span>اختلاف</span><b class="${delta(num(r.average_weight_g),w.value).cls}">${delta(num(r.average_weight_g),w.value).txt}</b></div></div>${t===window.BROILER_REPORT_ENGINE?`<div class="compare"><h3>FCR هفتگی</h3><div class="row"><span>واقعی</span><b>${fmt(built[wi>=0?wi:built.length-1]?.weeklyFcr??r.fcr,3)}</b></div><div class="row"><span>مرجع</span><b>${fmt((await reference(num(r.age_days),'fcr')).value,3)}</b></div><div class="row"><span>اختلاف</span><b class="${delta(built[wi>=0?wi:built.length-1]?.weeklyFcr??r.fcr,(await reference(num(r.age_days),'fcr')).value,true).cls}">${delta(built[wi>=0?wi:built.length-1]?.weeklyFcr??r.fcr,(await reference(num(r.age_days),'fcr')).value,true).txt}</b></div></div>`:''}<div class="compare"><h3>کیفیت نمونه</h3><div class="row"><span>CV</span><b>${fmt(r.cv_percent,2,'%')}</b></div><div class="row"><span>یکنواختی ±10</span><b>${fmt(r.uniformity_10_percent,1,'%')}</b></div><div class="row"><span>تلفات هفته</span><b>${fmt(r.mortality_count,0,' قطعه')}</b></div></div></div></section><section class="section"><div class="section-title"><h3>نمودار روند تا هفته انتخاب‌شده</h3><span class="badge">هیچ هفته‌ای خارج از سوابق واقعی اضافه نمی‌شود</span></div><div class="chart-grid"><div class="chart-box"><h3>وزن واقعی / مرجع</h3><canvas id="weightChart"></canvas></div><div class="chart-box"><h3>${t===window.BROILER_REPORT_ENGINE?'FCR هفتگی / تجمعی / مرجع':'CV / یکنواختی'}</h3><canvas id="qualityChart"></canvas></div></div></section>`;
const q=rows.filter(z=>num(z.week_number)<=num(r.week_number)),labels=q.map(z=>'هفته '+num(z.week_number));draw('weightChart',labels,[{label:'وزن واقعی',data:q.map(z=>num(z.average_weight_g))},{label:'مرجع',data:q.map(z=>standard(num(z.age_days),'weight'))}]);if(t===window.BROILER_REPORT_ENGINE)draw('qualityChart',labels,[{label:'FCR هفتگی',data:q.map((z,j)=>built[rows.indexOf(z)]?.weeklyFcr??num(z.fcr))},{label:'FCR تجمعی',data:q.map((z,j)=>built[rows.indexOf(z)]?.cumulativeFcr??num(z.cumulative_fcr))},{label:'FCR مرجع',data:q.map(z=>standard(num(z.age_days),'fcr'))}]);else draw('qualityChart',labels,[{label:'CV %',data:q.map(z=>num(z.cv_percent))},{label:'یکنواختی ±10 %',data:q.map(z=>num(z.uniformity_10_percent))}]);}
async function renderComprehensive(){destroy();const t=engine(),last=rows.at(-1),w=await reference(num(last.age_days),'weight'),f=t===window.BROILER_REPORT_ENGINE?await reference(num(last.age_days),'fcr'):null;const x=built.at(-1)||{};$('root').innerHTML=`<section class="section"><div class="section-title"><h2>گزارش کلی و تجمعی گله</h2><span class="badge">از اولین تا آخرین پایش واقعی</span></div><div class="cards">${commonCards(last,t===window.BROILER_REPORT_ENGINE?[['FCR تجمعی',fmt(x.cumulativeFcr??last.cumulative_fcr,3),`${f?.source||''}: ${fmt(f?.value,3)}`]]:[],w).map(a=>`<div class="card"><div class="label">${a[0]}</div><div class="value">${a[1]}</div><div class="ref">${a[2]}</div></div>`).join('')}</div></section><section class="section"><div class="section-title"><h3>روند تجمعی واقعی</h3></div><div class="chart-grid"><div class="chart-box"><h3>وزن واقعی و مرجع</h3><canvas id="cw"></canvas></div><div class="chart-box"><h3>${t===window.BROILER_REPORT_ENGINE?'FCR تجمعی و مرجع':'شاخص‌های کیفی'}</h3><canvas id="cf"></canvas></div></div></section><section class="section"><div class="section-title"><h3>جدول سوابق واقعی گله</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>مرجع وزن</th><th>CV</th><th>یکنواختی</th><th>دان</th><th>آب</th><th>تلفات</th>${t===window.BROILER_REPORT_ENGINE?'<th>FCR هفتگی</th><th>FCR تجمعی</th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${fmt(r.week_number,0)}</td><td>${fmt(r.age_days,0)}</td><td>${fmt(r.average_weight_g,1)}</td><td>${fmt(standard(num(r.age_days),'weight'),1)}</td><td>${fmt(r.cv_percent,2)}%</td><td>${fmt(r.uniformity_10_percent,1)}%</td><td>${fmt(r.feed_total_kg,1)}</td><td>${fmt(r.water_total_liter,1)}</td><td>${fmt(r.mortality_count,0)}</td>${t===window.BROILER_REPORT_ENGINE?`<td>${fmt(built[i]?.weeklyFcr??r.fcr,3)}</td><td>${fmt(built[i]?.cumulativeFcr??r.cumulative_fcr,3)}</td>`:''}</tr>`).join('')}</tbody></table></div></section>`;const labels=rows.map(r=>'هفته '+num(r.week_number));draw('cw',labels,[{label:'وزن واقعی',data:rows.map(r=>num(r.average_weight_g))},{label:'مرجع',data:rows.map(r=>standard(num(r.age_days),'weight'))}]);if(t===window.BROILER_REPORT_ENGINE)draw('cf',labels,[{label:'FCR تجمعی',data:rows.map((r,i)=>built[i]?.cumulativeFcr??num(r.cumulative_fcr))},{label:'FCR مرجع',data:rows.map(r=>standard(num(r.age_days),'fcr'))}]);else draw('cf',labels,[{label:'CV %',data:rows.map(r=>num(r.cv_percent))},{label:'یکنواختی ±10 %',data:rows.map(r=>num(r.uniformity_10_percent))}]);}
async function renderComparison(){destroy();const last=rows.at(-1),t=engine(),w=await reference(num(last.age_days),'weight'),f=t===window.BROILER_REPORT_ENGINE?await reference(num(last.age_days),'fcr'):null,x=built.at(-1)||{};const actualWeight=num(last.average_weight_g),actualF=t===window.BROILER_REPORT_ENGINE?num(x.cumulativeFcr??last.cumulative_fcr):null;const dw=delta(actualWeight,w.value),df=delta(actualF,f?.value,true);$('root').innerHTML=`<section class="section"><div class="section-title"><h2>گزارش مقایسه‌ای</h2><span class="badge">مرجع: ${w.source}</span></div><div class="notice">منبع رسمی در صورت وجود اولویت دارد. اگر برای شاخص/سویه/سن استاندارد رسمی قابل‌انطباق موجود نباشد، استاندارد مدیریتی استفاده می‌شود. اگر هیچ مرجع معتبر موجود نباشد، عدد ساختگی نمایش داده نمی‌شود.</div><div class="comparison" style="margin-top:12px"><div class="compare"><h3>وزن</h3><div class="row"><span>واقعی</span><b>${fmt(actualWeight,1,' گرم')}</b></div><div class="row"><span>${w.source}</span><b>${fmt(w.value,1,' گرم')}</b></div><div class="row"><span>اختلاف</span><b class="${dw.cls}">${dw.txt}</b></div></div>${t===window.BROILER_REPORT_ENGINE?`<div class="compare"><h3>FCR تجمعی</h3><div class="row"><span>واقعی</span><b>${fmt(actualF,3)}</b></div><div class="row"><span>${f?.source||'—'}</span><b>${fmt(f?.value,3)}</b></div><div class="row"><span>اختلاف</span><b class="${df.cls}">${df.txt}</b></div></div>`:''}<div class="compare"><h3>شاخص‌های کیفیت</h3><div class="row"><span>CV</span><b>${fmt(last.cv_percent,2,'%')}</b></div><div class="row"><span>یکنواختی ±10</span><b>${fmt(last.uniformity_10_percent,1,'%')}</b></div><div class="row"><span>تلفات</span><b>${fmt(last.mortality_count,0,' قطعه')}</b></div></div></div></section><section class="section"><div class="section-title"><h3>نمودار مقایسه‌ای کل دوره</h3></div><div class="chart-grid"><div class="chart-box"><h3>وزن واقعی در برابر مرجع</h3><canvas id="pw"></canvas></div><div class="chart-box"><h3>${t===window.BROILER_REPORT_ENGINE?'FCR تجمعی در برابر مرجع':'CV و یکنواختی'}</h3><canvas id="pf"></canvas></div></div></section>`;const labels=rows.map(r=>'هفته '+num(r.week_number));draw('pw',labels,[{label:'وزن واقعی',data:rows.map(r=>num(r.average_weight_g))},{label:w.source,data:rows.map(r=>standard(num(r.age_days),'weight'))}]);if(t===window.BROILER_REPORT_ENGINE)draw('pf',labels,[{label:'FCR تجمعی واقعی',data:rows.map((r,i)=>built[i]?.cumulativeFcr??num(r.cumulative_fcr))},{label:f?.source||'مرجع FCR',data:rows.map(r=>standard(num(r.age_days),'fcr'))}]);else draw('pf',labels,[{label:'CV %',data:rows.map(r=>num(r.cv_percent))},{label:'یکنواختی ±10 %',data:rows.map(r=>num(r.uniformity_10_percent))}]);}
async function render(){if(!flock){destroy();$('identity').innerHTML='';$('root').innerHTML='<div class="error">گله‌ای برای گزارش مشخص نشده است. گزارش فقط از گله‌ای که در ثبت هفتگی انتخاب شده باز می‌شود؛ گله دیگری به‌صورت خودکار انتخاب نخواهد شد.</div>';return}identity();$('scope').textContent='گله: '+(flock.flock_name||'—');if(tab==='weekly')await renderWeekly();else if(tab==='comprehensive')await renderComprehensive();else await renderComparison()}
async function init(){try{await initializeReportsData();if(!requestedId){$('root').innerHTML='<div class="error">شناسه گله از ثبت هفتگی دریافت نشده است. لطفاً از همان صفحه ثبت هفتگی وارد گزارش شوید.</div>';return}flock=await getReportFlock(requestedId);if(!flock){$('root').innerHTML='<div class="error">گله انتخاب‌شده پیدا نشد یا دسترسی به آن وجود ندارد.</div>';return}rows=await getReportWeeklyRecords(requestedId);if(!rows.length){identity();$('root').innerHTML='<div class="notice">برای این گله هنوز گزارش هفتگی ثبت نشده است.</div>';return}const e=engine();if(e?.build)built=e.build(flock,rows,(age)=>window.resolvePoultryStandard?window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:age}):null);else built=rows;$('week').innerHTML=rows.map(r=>`<option value="${r.week_number}">هفته ${fmt(r.week_number,0)} — ${fmt(r.age_days,0)} روز</option>`).join('');const requestedWeek=params.get('week');if(requestedWeek&&rows.some(r=>String(r.week_number)===requestedWeek))$('week').value=requestedWeek;await render();}catch(err){console.error(err);$('root').innerHTML='<div class="error">خطا در بارگذاری گزارش گله انتخاب‌شده. لطفاً از ثبت هفتگی دوباره وارد گزارش شوید.</div>'}}
$('back').onclick=()=>{const q='?flock_id='+encodeURIComponent(flock?.id||requestedId||'')+($('week').value?'&week='+encodeURIComponent($('week').value):'');location.href='weekly.html'+q};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;await render()});$('week').onchange=()=>{if(tab==='weekly')renderWeekly()};await init();
})();
