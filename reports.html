<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش عملکرد گله | مرکز تخصصی سلامت طیور آدینه</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;padding:14px 0 88px;background:#f4f7f6;color:#17231f;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1450px,96%);margin:auto}.panel{background:#fff;border:1px solid #dfe8e3;border-radius:16px;box-shadow:0 5px 18px rgba(20,45,38,.06);margin-bottom:12px}.head{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{margin:0;font-size:19px}.muted{margin-top:5px;color:#687770;font-size:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font:inherit;font-weight:900;cursor:pointer}.primary{background:#173f35;color:#fff}.secondary{background:#edf2ef;color:#24463b}.identity{padding:11px}.identity-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.identity-item{background:#f7faf8;border:1px solid #e0e8e4;border-radius:10px;padding:9px}.identity-item small{display:block;color:#738079;font-size:8px}.identity-item strong{display:block;margin-top:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs{display:flex!important;gap:7px;padding:7px}.tab{flex:1;padding:11px 8px;border:1px solid #d7e1dc;border-radius:10px;background:#fff;font:inherit;font-size:11px;font-weight:900;cursor:pointer;color:#33463f}.tab.active{background:#173f35;color:#fff}.toolbar{padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar select{min-width:220px;padding:8px;border:1px solid #d5dfda;border-radius:9px;font:inherit}.badge{padding:6px 9px;border-radius:18px;background:#eef4f1;color:#42665a;font-size:9px;font-weight:900}.section{padding:15px 17px}.section h2{margin:0 0 11px;font-size:16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:10px;border:1px solid #e0e8e4;border-radius:10px;background:#f9fbfa}.label{font-size:8px;color:#738079;font-weight:800}.value{margin-top:5px;font-size:16px;font-weight:900}.ref{margin-top:3px;font-size:8px;color:#687770;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #e0e8e4;border-radius:11px;padding:10px}.chart{height:300px}.notice{padding:10px;background:#f7faf8;border:1px solid #e0e8e4;border-radius:9px;font-size:9px;line-height:2;color:#586a63}.error{padding:15px;background:#fff4f4;border:1px solid #efcdca;border-radius:10px;color:#922d29;font-size:10px;line-height:2}.empty{text-align:center;padding:35px;color:#687770;font-size:10px}.table-wrap{overflow:auto}.data{width:100%;min-width:900px;border-collapse:collapse;font-size:9px}.data th,.data td{padding:7px;text-align:center;border-bottom:1px solid #e8eeeb}.data th{background:#173f35;color:#fff}.bottom-navigation{position:fixed;z-index:1000;right:0;left:0;bottom:0;height:72px;display:flex;align-items:stretch;justify-content:center;background:rgba(255,255,255,.97);border-top:1px solid #dfe6e2;padding:6px 10px}.bottom-nav-item{flex:1;max-width:150px;border:0;background:transparent;color:#718079;font:inherit;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:12px}.bottom-nav-item.active{color:#173f35;background:#edf4f1}@media(max-width:850px){.identity-grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.identity-grid,.cards{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:stretch}.tab{font-size:9px;padding:10px 3px}.toolbar{flex-direction:column;align-items:stretch}.toolbar select{width:100%}}@media print{.tabs,.toolbar,.actions,.bottom-navigation{display:none!important}}</style></head><body><main class="wrap"><header class="panel head"><div><h1>گزارش عملکرد گله</h1><div class="muted">گزارش فقط از همان گله‌ای ساخته می‌شود که از ثبت هفتگی وارد شده است.</div></div><div class="actions"><button class="btn secondary" id="back">بازگشت به ثبت گزارش</button><button class="btn primary" onclick="window.print()">چاپ</button></div></header><section class="panel identity"><div id="identity" class="identity-grid"></div></section><nav class="panel tabs"><button class="tab active" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="overall">گزارش جامع عملکرد گله</button><button class="tab" data-tab="compare">گزارش مقایسه‌ای</button></nav><section class="panel toolbar"><div><b>هفته گزارش:</b> <select id="week"></select></div><span id="scope" class="badge">در حال بارگذاری…</span></section><section id="root" class="panel"><div class="empty">در حال بارگذاری گله انتخاب‌شده…</div></section></main><nav class="bottom-navigation"><button class="bottom-nav-item" onclick="location.href='Dashboard.html'">خانه</button><button class="bottom-nav-item" onclick="location.href='flocks.html'">فارم‌ها</button><button class="bottom-nav-item" id="weeklyNav">ثبت هفتگی</button><button class="bottom-nav-item active">گزارش‌ها</button></nav><script>
'use strict';
(async()=>{
 const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);
 const db=window.supabaseClient;
 let flock=null,rows=[],charts=[];
 const n=v=>{if(v==null||v==='')return null;let s=String(v).replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776)).replace(/[٬,]/g,'').replace('٫','.');let x=Number(s);return Number.isFinite(x)?x:null};
 const fmt=(v,d=1)=>n(v)==null?'—':n(v).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d});
 const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pick=(r,ks)=>{for(const k of ks){let x=n(r?.[k]);if(x!==null)return x}return null};
 function getId(){return p.get('flockId')||p.get('flock_id')||p.get('id')||(()=>{try{let x=JSON.parse(localStorage.getItem('adine_poultry_current_selection')||'null');return x?.flockId||x?.flock_id}catch(e){return null}})()}
 function destroy(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
 async function init(){
   if(!db)throw Error('اتصال Supabase در صفحه گزارشات بارگذاری نشده است.');
   const id=getId(); if(!id)throw Error('شناسه گله دریافت نشد. لطفاً از ثبت هفتگی با همان گله وارد گزارش شوید.');
   const fr=await db.from('flocks').select('*').eq('id',id).maybeSingle(); if(fr.error)throw fr.error; if(!fr.data)throw Error('گله انتخاب‌شده پیدا نشد.'); flock=fr.data;
   const wr=await db.from('weekly_records').select('*').eq('flock_id',id).order('week_number',{ascending:true}); if(wr.error)throw wr.error; rows=wr.data||[]; if(!rows.length)throw Error('برای این گله هنوز گزارش هفتگی ثبت نشده است.');
   identity(); fillWeeks(); bind(); render('weekly');
 }
 function identity(){const name=flock.flock_name||flock.name||flock.flock_code||'—';$('identity').innerHTML=`<div class="identity-item"><small>گله</small><strong>${esc(name)}</strong></div><div class="identity-item"><small>نوع پرورش</small><strong>${esc(flock.production_type||'—')}</strong></div><div class="identity-item"><small>ژنتیک</small><strong>${esc(flock.genetics||flock.genetic_line||'—')}</strong></div><div class="identity-item"><small>سویه</small><strong>${esc(flock.strain||flock.breed||'—')}</strong></div><div class="identity-item"><small>پایش واقعی</small><strong>${fmt(rows.length,0)} هفته</strong></div>`;$('scope').textContent='گله انتخاب‌شده: '+name}
 function fillWeeks(){const wanted=n(p.get('week')||p.get('weekNumber'));$('week').innerHTML=rows.map((r,i)=>`<option value="${i}" ${(wanted!==null&&n(r.week_number)===wanted)||(wanted===null&&i===rows.length-1)?'selected':''}>هفته ${fmt(r.week_number,0)}</option>`).join('')}
 function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.tab)});$('week').onchange=()=>render('weekly');$('back').onclick=()=>location.href='weekly.html?flockId='+encodeURIComponent(flock.id);$('weeklyNav').onclick=()=>location.href='weekly.html?flockId='+encodeURIComponent(flock.id)}
 function card(label,value,ref=''){return`<div class="metric"><div class="label">${label}</div><div class="value">${value}</div><div class="ref">${ref}</div></div>`}
 function standardWeight(r){try{if(typeof resolvePoultryStandard!=='function')return null;const s=resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:n(r.age_days)});return n(s?.weight)}catch(e){return null}}
 function fcr(r){return pick(r,['fcr_weekly','weekly_fcr','fcr'])} function cum(r){return pick(r,['fcr_cumulative','cumulative_fcr','cum_fcr'])}
 function render(tab){destroy();if(tab==='overall')return overall();if(tab==='compare')return compare();weekly()}
 function weekly(){const i=Number($('week').value)||0,r=rows[i],w=pick(r,['average_weight_g','avg_weight_g','weight_g']),std=standardWeight(r),prev=i?pick(rows[i-1],['average_weight_g','avg_weight_g','weight_g']):null,gain=prev!=null&&w!=null?w-prev:null,feed=pick(r,['feed_total_kg','feed_kg','feed_total']),water=pick(r,['water_total_liter','water_liter','water_total']),mort=pick(r,['mortality_count','mortality_week']),cv=pick(r,['cv_percent','cv']),u10=pick(r,['uniformity_10_percent','uniformity_10']),u15=pick(r,['uniformity_15_percent','uniformity_15']),ratio=feed&&water?water/feed:null,f=fcr(r),c=cum(r);$('root').innerHTML=`<div class="section"><h2>گزارش هفتگی — هفته ${fmt(r.week_number,0)}</h2>${card('', '')}</div><div class="section">${card([['سن',fmt(r.age_days,0)+' روز'],['میانگین وزن',fmt(w)+' گرم',std==null?'':'استاندارد رسمی: '+fmt(std)+' گرم'],['افزایش وزن هفتگی',gain==null?'—':fmt(gain)+' گرم','روش: اختلاف وزن این هفته و هفته قبل'],['CV',fmt(cv,2)+' %'],['یکنواختی ±10',fmt(u10,1)+' %'],['یکنواختی ±15',fmt(u15,1)+' %'],['دان',fmt(feed,1)+' kg'],['آب',fmt(water,1)+' L'],['تلفات',mort==null?'—':fmt(mort,0)+' قطعه'],['FCR هفتگی',fmt(f,3)],['FCR تجمعی',fmt(c,3)],['نسبت آب به دان هفتگی',ratio==null?'—':fmt(ratio*100,1)+' %','آب: '+(ratio==null?'—':fmt(ratio,2))+' برابر دان']].map(x=>card(...x)).join('')}</div><div class="section"><div class="grid"><div class="box chart"><canvas id="weightChart"></canvas></div><div class="box chart"><canvas id="fcrChart"></canvas></div></div></div>`;chartLine('weightChart',rows.slice(0,i+1).map(x=>'هفته '+fmt(x.week_number,0)),[{label:'وزن واقعی',data:rows.slice(0,i+1).map(x=>pick(x,['average_weight_g','avg_weight_g','weight_g']))},{label:'استاندارد رسمی',data:rows.slice(0,i+1).map(x=>standardWeight(x))}]);chartLine('fcrChart',rows.slice(0,i+1).map(x=>'هفته '+fmt(x.week_number,0)),[{label:'FCR واقعی',data:rows.slice(0,i+1).map(x=>fcr(x))},{label:'FCR تجمعی',data:rows.slice(0,i+1).map(x=>cum(x))}])}
 function chartLine(id,labels,datasets){const c=$(id);if(!c)return;charts.push(new Chart(c,{type:'line',data:{labels,datasets:datasets.map(d=>({...d,tension:.25,borderWidth:2}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false}}}))}
 function overall(){$('root').innerHTML=`<div class="section"><h2>گزارش جامع عملکرد گله</h2><div class="table-wrap"><table class="data"><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>CV</th><th>یکنواختی ±10</th><th>FCR</th><th>FCR تجمعی</th><th>دان</th><th>آب</th><th>تلفات</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmt(r.week_number,0)}</td><td>${fmt(r.age_days,0)}</td><td>${fmt(pick(r,['average_weight_g','avg_weight_g','weight_g']))}</td><td>${fmt(pick(r,['cv_percent','cv']),2)}%</td><td>${fmt(pick(r,['uniformity_10_percent','uniformity_10']),1)}%</td><td>${fmt(fcr(r),3)}</td><td>${fmt(cum(r),3)}</td><td>${fmt(pick(r,['feed_total_kg','feed_kg','feed_total']),1)}</td><td>${fmt(pick(r,['water_total_liter','water_liter','water_total']),1)}</td><td>${fmt(pick(r,['mortality_count','mortality_week']),0)}</td></tr>`).join('')}</tbody></table></div></div>`}
 function compare(){const r=rows[Number($('week').value)||rows.length-1],w=pick(r,['average_weight_g','avg_weight_g','weight_g']),std=standardWeight(r),f=fcr(r),c=cum(r);$('root').innerHTML=`<div class="section"><h2>گزارش مقایسه‌ای — هفته ${fmt(r.week_number,0)}</h2><div class="cards">${card('وزن واقعی',fmt(w)+' گرم')}${card('استاندارد رسمی',std==null?'—':fmt(std)+' گرم')}${card('اختلاف وزن',w!=null&&std!=null?fmt(w-std)+' گرم':'—')}${card('FCR واقعی',fmt(f,3))}${card('FCR تجمعی',fmt(c,3))}</div><div class="notice">مقایسه بر پایه داده واقعی همین گله و استانداردهای موجود در سیستم انجام می‌شود. عدد ساختگی تولید نمی‌شود.</div></div>`}
 try{await init()}catch(e){console.error(e);$('scope').textContent='خطا در بارگذاری';$('root').innerHTML=`<div class="error"><b>گزارش بارگذاری نشد.</b><br>${esc(e.message||e)}<br><button class="btn secondary" onclick="history.back()">بازگشت</button></div>`}
})();</script></body></html>
