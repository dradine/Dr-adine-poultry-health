<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>
<main class="reports-shell">
<header class="report-card report-header"><div><h1>گزارش عملکرد گله</h1><p>گزارش فقط از همان گله‌ای ساخته می‌شود که از ثبت هفتگی وارد شده است.</p></div><div class="report-actions"><button class="report-btn secondary" id="back">بازگشت به ثبت گزارش</button><button class="report-btn primary" id="print">چاپ گزارش</button></div></div></header>
<section class="report-card flock-identity"><div id="identity" class="identity-grid"><div class="empty">در حال دریافت اطلاعات گله…</div></div></section>
<nav class="report-card report-tabs" aria-label="انواع گزارش"><button class="report-tab active" data-tab="weekly">گزارش هفتگی</button><button class="report-tab" data-tab="overall">گزارش جامع عملکرد گله</button><button class="report-tab" data-tab="compare">گزارش مقایسه‌ای</button></nav>
<section class="report-card report-toolbar"><div class="toolbar-left"><b>هفته گزارش:</b><select id="week" aria-label="هفته گزارش"></select></div><span id="scope" class="scope-badge">در حال بارگذاری…</span></section>
<section id="root" class="report-card"><div class="empty">در حال بارگذاری اطلاعات گله…</div></section>
</main>
