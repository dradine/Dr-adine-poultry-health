<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارشات گله | مرکز تخصصی سلامت طیور آدینه</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="reports-data.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="report-benchmark-runtime-v1.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#17231f;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1450px,94%);margin:18px auto 40px}.panel{background:#fff;border:1px solid #e0e8e4;border-radius:16px;box-shadow:0 5px 18px rgba(20,45,38,.06);margin-bottom:12px}.head{padding:17px 19px;display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{margin:0;font-size:22px}.muted{margin-top:6px;color:#6a7973;font-size:11px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:900;cursor:pointer;background:#edf2ef;color:#24463b}.btn.primary{background:#173f35;color:#fff}.identity{padding:12px}.identity-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.identity-item{background:#f7faf8;border:1px solid #e0e8e4;border-radius:11px;padding:10px}.identity-item small{display:block;color:#738079;font-size:9px}.identity-item strong{display:block;margin-top:5px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs{display:flex;gap:8px;padding:8px;overflow-x:auto}.tab{flex:1;min-width:160px;padding:12px;border:1px solid #d7e1dc;border-radius:11px;background:#fff;font:inherit;font-weight:900;cursor:pointer;white-space:nowrap;color:#33463f}.tab.active{background:#173f35;color:#fff}.toolbar{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar select{min-width:210px;padding:9px;border:1px solid #d5dfda;border-radius:9px;font:inherit;background:#fff}.badge{padding:5px 9px;border-radius:20px;background:#eef4f1;color:#42665a;font-size:9px;font-weight:900}.section{padding:16px 18px}.section h2,.section h3{margin:0 0 12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{padding:11px;border:1px solid #e0e8e4;border-radius:11px;background:#f9fbfa}.label{font-size:9px;color:#738079;font-weight:800}.value{margin-top:5px;font-size:18px;font-weight:900}.ref{margin-top:4px;font-size:9px;color:#687770;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.box{border:1px solid #e0e8e4;border-radius:12px;padding:11px}.chart{height:310px}.chart canvas{height:270px!important}.table-wrap{overflow:auto}.data{width:100%;min-width:950px;border-collapse:collapse;font-size:10px}.data th,.data td{padding:8px;text-align:center;border-bottom:1px solid #e8eeeb}.data th{background:#173f35;color:#fff}.notice{padding:11px;background:#f7faf8;border:1px solid #e0e8e4;border-radius:10px;font-size:10px;line-height:2;color:#586a63}.error{padding:16px;background:#fff4f4;border:1px solid #efcdca;border-radius:11px;color:#922d29;font-size:11px;line-height:2}.empty{text-align:center;padding:32px;color:#687770}@media(max-width:900px){.identity-grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.identity-grid,.cards{grid-template-columns:1fr 1fr}.head{align-items:stretch;flex-direction:column}.actions .btn{flex:1}.toolbar{align-items:stretch;flex-direction:column}.toolbar select{width:100%}.tabs{display:flex}.tab{min-width:125px}.chart{height:280px}.chart canvas{height:240px!important}}@media print{.tabs,.toolbar,.actions{display:none!important}.panel{box-shadow:none}}</style></head><body><main class="wrap"><header class="panel head"><div><h1>گزارشات گله</h1><div class="muted">این گزارش فقط به همان گله‌ای متصل است که از ثبت هفتگی وارد شده است.</div></div><div class="actions"><button id="back" class="btn">بازگشت به ثبت گزارش</button><button id="print" class="btn primary">چاپ گزارش</button></div></header><section class="panel identity"><div id="identity" class="identity-grid"></div></section><nav class="panel tabs"><button class="tab active" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="overall">گزارش کلی گله</button><button class="tab" data-tab="compare">گزارش مقایسه‌ای</button></nav><section class="panel toolbar"><div><b>هفته گزارش:</b> <select id="week"></select></div><span id="scope" class="badge">گله انتخاب‌شده</span></section><section id="root" class="panel"><div class="empty">در حال بارگذاری…</div></section></main><script>(async()=>{const $=x=>document.getElementById(x),P=new URLSearchParams(location.search),id=P.get('flock_id')||P.get('flockId');let flock=null,rows=[],tab='weekly',charts=[];const n=x=>{if(x===null||x===undefined||x==='')return null;const v=Number(String(x).replace(/,/g,''));return Number.isFinite(v)?v:null},f=(x,d=1)=>n(x)==null?'—':n(x).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d}),v=(r,ks)=>{for(const k of ks){const x=n(r?.[k]);if(x!=null)return x}return null},type=x=>{const s=String(x||'').toLowerCase();return s.includes('broiler')||s.includes('گوشتی')?'گوشتی':s.includes('pullet')||s.includes('پولت')?'پولت':s.includes('layer')||s.includes('تخم')?'تخم‌گذار':s.includes('breeder')||s.includes('مادر')?'مادر':x||'—'},std=(r,m)=>{try{if(!window.resolvePoultryStandard)return null;const s=window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:n(r.age_days)});return n(s?.[m])}catch(e){return null}},destroy=()=>{charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]},chart=(id,labels,ds)=>{const e=$(id);if(!e||!window.Chart)return;charts.push(new Chart(e,{type:'line',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:false}}}}))};function ident(){const t=type(flock.production_type);$('identity').innerHTML=`<div class="identity-item"><small>گله</small><strong>${flock.name||flock.flock_name||flock.flock_code||'—'}</strong></div><div class="identity-item"><small>نوع پرورش</small><strong>${t}</strong></div><div class="identity-item"><small>ژنتیک</small><strong>${flock.genetics||flock.genetic_line||'—'}</strong></div><div class="identity-item"><small>سویه</small><strong>${flock.strain||flock.breed||'—'}</strong></div><div class="identity-item"><small>پایش واقعی</small><strong>${f(rows.length,0)} هفته</strong></div>`;$('scope').textContent='گله: '+(flock.name||flock.flock_name||flock.flock_code||'انتخاب‌شده')}function cards(a){return'<div class="cards">'+a.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="ref">${x[2]||''}</div></div>`).join('')+'</div>'}function renderWeekly(){destroy();const r=rows[Number($('week').value)||0];if(!r){$('root').innerHTML='<div class="empty">پایش هفتگی برای این گله ثبت نشده است.</div>';return}const w=std(r,'weight'),t=type(flock.production_type),items=[['سن',f(r.age_days,0)+' روز',''],['میانگین وزن',f(v(r,['average_weight_g','avg_weight_g','weight_g']),1)+' گرم',w!=null?'رسمی: '+f(w,1)+' گرم':'مدیریتی/مرجع'],['CV',f(v(r,['cv_percent','cv']),2)+' %',''],['یکنواختی ±10',f(v(r,['uniformity_10_percent','uniformity_10']),1)+' %',''],['یکنواختی ±15',f(v(r,['uniformity_15_percent','uniformity_15']),1)+' %',''],['دان',f(v(r,['feed_total_kg','feed_kg']),1)+' kg',''],['آب',f(v(r,['water_total_liter','water_liter']),1)+' L',''],['تلفات',f(v(r,['mortality_count','mortality','deaths']),0)+' قطعه','']];if(t==='گوشتی')items.push(['FCR هفتگی',f(v(r,['fcr_weekly','weekly_fcr','fcr']),3),''],['FCR تجمعی',f(v(r,['fcr_cumulative','cumulative_fcr','cum_fcr']),3),'']);$('root').innerHTML=`<section class="section"><h2>گزارش هفتگی — هفته ${f(r.week_number,0)}</h2>${cards(items)}</section><section class="section"><div class="grid"><div class="box chart"><h3>وزن واقعی و مرجع</h3><canvas id="cw"></canvas></div><div class="box chart"><h3>${t==='گوشتی'?'FCR هفتگی، FCR تجمعی و مرجع':'CV و یکنواختی'}</h3><canvas id="cq"></canvas></div></div></section>`;const q=rows.filter(x=>n(x.week_number)<=n(r.week_number)),lab=q.map(x=>'هفته '+n(x.week_number));chart('cw',lab,[{label:'واقعی',data:q.map(x=>v(x,['average_weight_g','avg_weight_g','weight_g']))},{label:'مرجع رسمی',data:q.map(x=>std(x,'weight'))}]);chart('cq',lab,t==='گوشتی'?[{label:'FCR هفتگی',data:q.map(x=>v(x,['fcr_weekly','weekly_fcr','fcr']))},{label:'FCR تجمعی',data:q.map(x=>v(x,['fcr_cumulative','cumulative_fcr','cum_fcr']))},{label:'مرجع',data:q.map(x=>std(x,'fcr'))}]:[{label:'CV %',data:q.map(x=>v(x,['cv_percent','cv']))},{label:'یکنواختی ±10 %',data:q.map(x=>v(x,['uniformity_10_percent','uniformity_10']))}])}function renderOverall(){destroy();const lab=rows.map(x=>'هفته '+n(x.week_number));$('root').innerHTML=`<section class="section"><h2>گزارش کلی گله</h2><div class="notice">تمام روندها فقط از ${f(rows.length,0)} پایش واقعی همین گله ساخته شده‌اند. هیچ هفته‌ای از گله دیگر یا آینده وارد نمودار نمی‌شود.</div></section><section class="section"><div class="grid"><div class="box chart"><h3>روند وزن</h3><canvas id="ow"></canvas></div><div class="box chart"><h3>روند FCR</h3><canvas id="of"></canvas></div></div></section><section class="section"><div class="table-wrap"><table class="data"><tr><th>هفته</th><th>سن</th><th>وزن</th><th>CV</th><th>یکنواختی ±10</th><th>دان</th><th>تلفات</th><th>FCR هفتگی</th><th>FCR تجمعی</th></tr>${rows.map(r=>`<tr><td>${f(r.week_number,0)}</td><td>${f(r.age_days,0)}</td><td>${f(v(r,['average_weight_g','avg_weight_g','weight_g']),1)}</td><td>${f(v(r,['cv_percent','cv']),2)}%</td><td>${f(v(r,['uniformity_10_percent','uniformity_10']),1)}%</td><td>${f(v(r,['feed_total_kg','feed_kg']),1)}</td><td>${f(v(r,['mortality_count','mortality']),0)}</td><td>${f(v(r,['fcr_weekly','weekly_fcr','fcr']),3)}</td><td>${f(v(r,['fcr_cumulative','cumulative_fcr','cum_fcr']),3)}</td></tr>`).join('')}</table></div></section>`;chart('ow',lab,[{label:'وزن واقعی',data:rows.map(r=>v(r,['average_weight_g','avg_weight_g','weight_g']))},{label:'مرجع رسمی',data:rows.map(r=>std(r,'weight'))}]);chart('of',lab,[{label:'FCR هفتگی',data:rows.map(r=>v(r,['fcr_weekly','weekly_fcr','fcr']))},{label:'FCR تجمعی',data:rows.map(r=>v(r,['fcr_cumulative','cumulative_fcr','cum_fcr']))},{label:'مرجع',data:rows.map(r=>std(r,'fcr'))}])}function renderCompare(){destroy();const lab=rows.map(x=>'هفته '+n(x.week_number));$('root').innerHTML=`<section class="section"><h2>گزارش مقایسه‌ای</h2><div class="notice">مرجع هر شاخص ابتدا استاندارد رسمی همان نوع/ژنتیک/سویه/سن است؛ در صورت نبود مرجع رسمی، موتور Benchmark مدیریتی می‌تواند مرجع جایگزین را فراهم کند.</div></section><section class="section"><div class="grid"><div class="box chart"><h3>وزن: واقعی / مرجع</h3><canvas id="xw"></canvas></div><div class="box chart"><h3>FCR: هفتگی / تجمعی / مرجع</h3><canvas id="xf"></canvas></div></div></section>`;chart('xw',lab,[{label:'واقعی',data:rows.map(r=>v(r,['average_weight_g','avg_weight_g','weight_g']))},{label:'مرجع',data:rows.map(r=>std(r,'weight'))}]);chart('xf',lab,[{label:'FCR هفتگی',data:rows.map(r=>v(r,['fcr_weekly','weekly_fcr','fcr']))},{label:'FCR تجمعی',data:rows.map(r=>v(r,['fcr_cumulative','cumulative_fcr','cum_fcr']))},{label:'مرجع',data:rows.map(r=>std(r,'fcr'))}])}function render(){tab==='weekly'?renderWeekly():tab==='overall'?renderOverall():renderCompare()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});$('week').onchange=render;$('print').onclick=()=>window.print();$('back').onclick=()=>location.href='weekly.html?flock_id='+encodeURIComponent(flock.id);if(!id)throw new Error('شناسه گله از ثبت هفتگی دریافت نشد؛ برای جلوگیری از نمایش گله اشتباه، گزارش متوقف شد.');await initializeReportsData();flock=await getReportFlock(id);if(!flock)throw new Error('گله انتخاب‌شده پیدا نشد؛ هیچ گله دیگری جایگزین نشد.');rows=await getReportWeeklyRecords(id);ident();$('week').innerHTML=rows.map((r,i)=>`<option value="${i}">هفته ${f(r.week_number,0)} — سن ${f(r.age_days,0)} روز</option>`).join('');if(rows.length)$('week').value=String(Math.max(0,rows.length-1));render()})().catch(e=>{$('identity').innerHTML='<div class="identity-item"><small>وضعیت</small><strong>گله مشخص نشده</strong></div>';$('root').innerHTML='<div class="error"><b>گزارش بارگذاری نشد.</b><br>'+String(e.message||e)+'</div>';console.error(e)})</script>    <script src="health-records-runtime-v2.js"></script>
