gn-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section h2{margin:0;font-size:17px}.section h3{margin:0 0 10px;font-size:12px}.eyebrow{font-size:9px;color:#5f776d;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{padding:12px;border:1px solid var(--r-line);border-radius:13px;background:#f9fbfa;min-width:0}.metric-label{font-size:8px;color:var(--r-muted);font-weight:900}.metric-value{margin-top:5px;font-size:17px;font-weight:900}.metric-ref{margin-top:4px;color:#66766f;font-size:8px;line-height:1.7}.metric.good{border-color:#cfe7dc;background:#f3faf6}.metric.warn{border-color:#ead8c0;background:#fffaf2}.charts{display:grid;grid-template-columns:1fr 1fr;gap:11px}.chart-box{border:1px solid var(--r-line);border-radius:14px;padding:12px;background:#fff}.chart-box.wide{grid-column:1/-1}.chart-area{height:290px;position:relative}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.insight{border:1px solid var(--r-line);border-radius:13px;padding:12px;background:#f9fbfa}.insight strong{display:block;font-size:10px;margin-bottom:5px}.insight span{font-size:9px;color:#5d6e67;line-height:1.9}.table-wrap{overflow:auto}.data{width:100%;min-width:900px;border-collapse:separate;border-spacing:0;font-size:9px}.data th,.data td{padding:9px;text-align:center;border-bottom:1px solid #e7eeea}.data th{background:var(--r-brand);color:#fff;position:sticky;top:0}.data th:first-child{border-radius:0 9px 0 0}.data th:last-child{border-radius:9px 0 0 0}.status-good{color:var(--r-good);font-weight:900}.status-warn{color:var(--r-warn);font-weight:900}.status-neutral{color:#687770;font-weight:800}.empty{text-align:center;padding:45px;color:var(--r-muted);font-size:10px}.error{padding:15px;background:#fff4f4;border:1px solid #efcdca;border-radius:12px;color:#922d29;font-size:10px;line-height:2}.bottom-navigation{position:fixed;z-index:1000;right:0;left:0;bottom:0;height:72px;display:flex;align-items:stretch;justify-content:center;background:rgba(255,255,255,.97);border-top:1px solid #dfe6e2;box-shadow:0 -5px 20px rgba(20,45,38,.1);padding:6px 10px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.bottom-nav-item{flex:1;max-width:150px;border:0;background:transparent;color:#718079;font:inherit;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:12px}.bottom-nav-item.active{color:var(--r-brand);background:#edf4f1}.bottom-nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}.bottom-nav-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(max-width:900px){.identity-grid{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.chart-box.wide{grid-column:auto}.insights{grid-template-columns:1fr}}@media(max-width:600px){.r-head{flex-direction:column;align-items:stretch}.r-actions .r-btn{flex:1}.identity-grid{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar-left{justify-content:space-between}.toolbar select{width:100%;min-width:0}.tab{font-size:9px;padding:11px 3px}.section{padding:14px 12px}}@media print{body{padding:0}.tabs,.toolbar,.r-actions,.bottom-navigation{display:none!important}.r-card{box-shadow:none}.chart-area{height:240px}}

<body>
<main class="reports-wrap">
<header class="r-card r-head"><div><h1>گزارش عملکرد گله</h1><div class="r-muted">گزارش فقط از همان گله‌ای ساخته می‌شود که از ثبت هفتگی وارد شده است.</div></div><div class="r-actions"><button class="r-btn r-btn-secondary" id="back">بازگشت به ثبت گزارش</button><button class="r-btn r-btn-primary" id="print">چاپ گزارش</button></div></header>
<section class="r-card identity"><div id="identity" class="identity-grid"></div></section>
<nav class="r-card tabs" aria-label="انواع گزارش"><button class="tab active" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="overall">گزارش جامع عملکرد گله</button><button class="tab" data-tab="compare">گزارش مقایسه‌ای</button></nav>
<section class="r-card toolbar"><div class="toolbar-left"><b>هفته گزارش:</b><select id="week"></select></div><span id="scope" class="scope">در حال بارگذاری…</span></section>

<script>
'use strict';
(async()=>{
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);let flock=null,rows=[],tab='weekly',charts=[];
const n=v=>{if(v===null||v===undefined||v==='')return null;const s=String(v).replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776)).replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632)).replace(/[٬,]/g,'').replace('٫','.');const x=Number(s);return Number.isFinite(x)?x:null};
const fmt=(v,d=1)=>n(v)==null?'—':n(v).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pick=(r,keys)=>{for(const k of keys){const x=n(r?.[k]);if(x!==null)return x}return null};
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const type=x=>{const s=String(x||'').toLowerCase();if(/broiler|گوشتی|meat/.test(s))return'گوشتی';if(/pullet|پولت/.test(s))return'پولت';if(/layer|تخم/.test(s))return'تخم‌گذار';if(/breeder|مادر/.test(s))return'مادر';return x||'—'};
const weight=r=>pick(r,['average_weight_g','avg_weight_g','weight_g']);
const fcr=(r,cum=false)=>pick(r,cum?['fcr_cumulative','cumulative_fcr','cum_fcr']:['fcr_weekly','weekly_fcr','fcr']);
const standard=(r,key)=>{try{if(typeof resolvePoultryStandard!=='function')return null;const s=resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:n(r.age_days)});return n(s?.[key])}catch(e){return null}};
const mgmtFcr=r=>{try{const w=n(r.week_number),cur=resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:n(r.age_days)}),pr=rows.find(x=>n(x.week_number)===w-1);if(!cur||!pr)return null;const prev=resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:n(pr.age_days)});const cc=n(cur?.fcr),pc=n(prev?.fcr),cw=n(cur?.weight),pw=n(prev?.weight);if([cc,pc,cw,pw].some(x=>x===null)||cw<=pw)return null;const gain=cw-pw;return (cc*(cw-pw)-pc*pw)/gain}catch(e){return null}};
const gain=(r,i)=>{const direct=pick(r,['weekly_weight_gain_g','weight_gain_g','weekly_gain_g','weight_gain']);if(direct!==null)return direct;if(i===0)return null;const p=rows[i-1],a=weight(r),b=weight(p);return a!==null&&b!==null?a-b:null};
const standardGain=(r,i)=>{if(i===0)return null;const a=standard(r,'weight'),b=standard(rows[i-1],'weight');return a!==null&&b!==null?a-b:null};
function destroy(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
function draw(id,labels,datasets,opts={}){const el=$(id);if(!el)return;const c=new Chart(el,{type:opts.type||'line',data:{labels,datasets:datasets.map(d=>({label:d.label,data:d.data,borderWidth:2,pointRadius:3,tension:.28,fill:false,spanGaps:true}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{font:{family:'Tahoma',size:10}}},tooltip:{rtl:true,bodyFont:{family:'Tahoma'},titleFont:{family:'Tahoma'}}},scales:{x:{grid:{display:false},ticks:{font:{family:'Tahoma',size:9}}},y:{beginAtZero:opts.zero||false,ticks:{font:{family:'Tahoma',size:9}}}}}});charts.push(c)}
function identity(){const name=flock.flock_name||flock.name||flock.flock_code||'—';$('identity').innerHTML=`<div class="identity-item"><small>گله</small><strong>${esc(name)}</strong></div><div class="identity-item"><small>نوع پرورش</small><strong>${esc(type(flock.production_type))}</strong></div><div class="identity-item"><small>ژنتیک</small><strong>${esc(flock.genetics||flock.genetic_line||'—')}</strong></div><div class="identity-item"><small>سویه</small><strong>${esc(flock.strain||flock.breed||'—')}</strong></div><div class="identity-item"><small>پایش</small><strong>${fmt(rows.length,0)} هفته واقعی</strong></div>`;$('scope').textContent='گله انتخاب‌شده: '+name}
function metric(label,value,ref='',cls=''){return `<div class="metric ${cls}"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-ref">${ref}</div></div>`}
function weekly(){destroy();const i=Number($('week').value)||0,r=rows[i];if(!r){$('root').innerHTML='<div class="empty">برای این گله هنوز ثبت هفتگی وجود ندارد.</div>';return}const w=weight(r),sw=standard(r,'weight'),ff=fcr(r),fc=fcr(r,true),sf=standard(r,'fcr'),mf=mgmtFcr(r),feed=pick(r,['feed_total_kg','feed_kg','feed_total']),water=pick(r,['water_total_liter','water_liter','water_total']),ratio=feed>0&&water!==null?water/feed:null,cv=pick(r,['cv_percent','cv']),u10=pick(r,['uniformity_10_percent','uniformity_10']),u15=pick(r,['uniformity_15_percent','uniformity_15']),mort=pick(r,['mortality_count','mortality','deaths']);const all=rows.slice(0,i+1),labels=all.map(x=>'هفته '+fmt(x.week_number,0));
let cards=[metric('سن',fmt(r.age_days,0)+' روز'),metric('میانگین وزن',fmt(w,1)+' گرم',sw!==null?'استاندارد رسمی: '+fmt(sw,1)+' گرم':''),metric('افزایش وزن هفتگی',fmt(gain(r,i),1)+' گرم',i===0?'هفته اول؛ مبنای هفته قبل وجود ندارد':'هدف مدیریتی: '+fmt(standardGain(r,i),1)+' گرم'),metric('CV',fmt(cv,2)+' %'),metric('یکنواختی ±10',fmt(u10,1)+' %'),metric('یکنواختی ±15',fmt(u15,1)+' %'),metric('دان',fmt(feed,1)+' kg'),metric('آب',fmt(water,1)+' L'),metric('تلفات',fmt(mort,0)+' قطعه')];if(type(flock.production_type)==='گوشتی')cards.push(metric('FCR هفتگی',fmt(ff,3),mf!==null?'هدف مدیریتی: '+fmt(mf,3):'هدف مدیریتی: —',mf!==null&&ff!==null?(ff<=mf?'good':'warn'):''),metric('FCR تجمعی',fmt(fc,3),sf!==null?'استاندارد رسمی تجمعی: '+fmt(sf,3):''),metric('نسبت آب به دان هفتگی',ratio===null?'—':fmt(ratio*100,1)+' %',ratio===null?'':'آب: '+fmt(ratio,2)+' برابر دان') );
$('root').innerHTML=`<section class="section"><div class="section-title"><div><div class="eyebrow">WEEKLY PERFORMANCE</div><h2>گزارش هفتگی — هفته ${fmt(r.week_number,0)}</h2></div><span class="scope">هفته انتخاب‌شده: ${fmt(r.week_number,0)}</span></div><div class="metrics">${cards.join('')}</div></section><section class="section"><div class="charts"><div class="chart-box"><h3>میانگین وزن — واقعی در برابر استاندارد رسمی</h3><div class="chart-area"><canvas id="cWeight"></canvas></div></div><div class="chart-box"><h3>افزایش وزن — واقعی در برابر مرجع</h3><div class="chart-area"><canvas id="cGain"></canvas></div></div><div class="chart-box"><h3>FCR هفتگی — واقعی در برابر هدف مدیریتی</h3><div class="chart-area"><canvas id="cFcrW"></canvas></div></div><div class="chart-box"><h3>FCR تجمعی — واقعی در برابر استاندارد رسمی</h3><div class="chart-area"><canvas id="cFcrC"></canvas></div></div><div class="chart-box wide"><h3>CV و یکنواختی گله</h3><div class="chart-area"><canvas id="cQuality"></canvas></div></div></div></section>`;
draw('cWeight',labels,[{label:'وزن واقعی (g)',data:all.map(weight)},{label:'استاندارد رسمی (g)',data:all.map(x=>standard(x,'weight'))}]);draw('cGain',labels,[{label:'افزایش وزن واقعی (g)',data:all.map((x,j)=>gain(x,j))},{label:'افزایش وزن مرجع (g)',data:all.map((x,j)=>standardGain(x,j))}]);draw('cFcrW',labels,[{label:'FCR هفتگی واقعی',data:all.map(x=>fcr(x))},{label:'هدف مدیریتی',data:all.map(x=>mgmtFcr(x))}]);draw('cFcrC',labels,[{label:'FCR تجمعی واقعی',data:all.map(x=>fcr(x,true))},{label:'استاندارد رسمی',data:all.map(x=>standard(x,'fcr'))}]);draw('cQuality',labels,[{label:'CV %',data:all.map(x=>pick(x,['cv_percent','cv']))},{label:'یکنواختی ±10 %',data:all.map(x=>pick(x,['uniformity_10_percent','uniformity_10']))},{label:'یکنواختی ±15 %',data:all.map(x=>pick(x,['uniformity_15_percent','uniformity_15']))}]);}
function overall(){destroy();const t=type(flock.production_type),labels=rows.map(x=>'هفته '+fmt(x.week_number,0)),last=rows[rows.length-1];if(!last){$('root').innerHTML='<div class="empty">داده‌ای برای گزارش جامع وجود ندارد.</div>';return}const w=weight(last),sw=standard(last,'weight'),fc=fcr(last,true),sf=standard(last,'fcr'),cv=pick(last,['cv_percent','cv']),u10=pick(last,['uniformity_10_percent','uniformity_10']),u15=pick(last,['uniformity_15_percent','uniformity_15']),mort=pick(last,['mortality_count','mortality','deaths']);$('root').innerHTML=`<section class="section"><div class="section-title"><div><div class="eyebrow">FLOCK PERFORMANCE</div><h2>گزارش جامع عملکرد گله</h2></div><span class="scope">هفته ۱ تا ${fmt(last.week_number,0)}</span></div><div class="metrics">${metric('آخرین میانگین وزن',fmt(w,1)+' گرم',sw!==null?'استاندارد رسمی: '+fmt(sw,1)+' گرم')}${metric('FCR تجمعی نهایی',fmt(fc,3),sf!==null?'استاندارد رسمی: '+fmt(sf,3):'')}${metric('CV آخرین هفته',fmt(cv,2)+' %')}${metric('یکنواختی ±10',fmt(u10,1)+' %')}${metric('یکنواختی ±15',fmt(u15,1)+' %')}${metric('تلفات آخرین هفته',fmt(mort,0)+' قطعه')}${metric('تعداد هفته ثبت‌شده',fmt(rows.length,0)+' هفته')}${metric('سویه',esc(flock.strain||flock.breed||'—'))}</div></section><section class="section"><div class="charts"><div class="chart-box wide"><h3>روند وزن واقعی و استاندارد رسمی</h3><div class="chart-area"><canvas id="oWeight"></canvas></div></div><div class="chart-box"><h3>روند CV</h3><div class="chart-area"><canvas id="oCv"></canvas></div></div><div class="chart-box"><h3>روند یکنواختی</h3><div class="chart-area"><canvas id="oUni"></canvas></div></div>${t==='گوشتی'?'<div class="chart-box"><h3>روند FCR هفتگی و هدف مدیریتی</h3><div class="chart-area"><canvas id="oFcrW"></canvas></div></div><div class="chart-box"><h3>روند FCR تجمعی و استاندارد رسمی</h3><div class="chart-area"><canvas id="oFcrC"></canvas></div></div>':''}</div></section><section class="section"><div class="section-title"><h2>جدول روند عملکرد</h2><span class="eyebrow">داده واقعی ثبت‌شده</span></div><div class="table-wrap"><table class="data"><thead><tr><th>هفته</th><th>سن</th><th>وزن واقعی</th><th>استاندارد وزن</th><th>CV</th><th>±10</th><th>±15</th>${t==='گوشتی'?'<th>FCR هفتگی</th><th>هدف مدیریتی</th><th>FCR تجمعی</th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${fmt(r.week_number,0)}</td><td>${fmt(r.age_days,0)} روز</td><td>${fmt(weight(r),1)}</td><td>${fmt(standard(r,'weight'),1)}</td><td>${fmt(pick(r,['cv_percent','cv']),2)}%</td><td>${fmt(pick(r,['uniformity_10_percent','uniformity_10']),1)}%</td><td>${fmt(pick(r,['uniformity_15_percent','uniformity_15']),1)}%</td>${t==='گوشتی'?`<td>${fmt(fcr(r),3)}</td><td>${fmt(mgmtFcr(r),3)}</td><td>${fmt(fcr(r,true),3)}</td>`:''}</tr>`).join('')}</tbody></table></div></section>`;
draw('oWeight',labels,[{label:'وزن واقعی (g)',data:rows.map(weight)},{label:'استاندارد رسمی (g)',data:rows.map(x=>standard(x,'weight'))}]);draw('oCv',labels,[{label:'CV %',data:rows.map(x=>pick(x,['cv_percent','cv']))}]);draw('oUni',labels,[{label:'یکنواختی ±10 %',data:rows.map(x=>pick(x,['uniformity_10_percent','uniformity_10']))},{label:'یکنواختی ±15 %',data:rows.map(x=>pick(x,['uniformity_15_percent','uniformity_15']))}]);if(t==='گوشتی'){draw('oFcrW',labels,[{label:'FCR هفتگی',data:rows.map(x=>fcr(x))},{label:'هدف مدیریتی',data:rows.map(x=>mgmtFcr(x))}]);draw('oFcrC',labels,[{label:'FCR تجمعی',data:rows.map(x=>fcr(x,true))},{label:'استاندارد رسمی',data:rows.map(x=>standard(x,'fcr'))}]);}}
function compare(){destroy();const t=type(flock.production_type),last=rows[rows.length-1];if(!last){$('root').innerHTML='<div class="empty">برای مقایسه، حداقل یک هفته ثبت‌شده لازم است.</div>';return}const rowsHtml=rows.map(r=>{const w=weight(r),sw=standard(r,'weight'),ff=fcr(r),mf=mgmtFcr(r),fc=fcr(r,true),sf=standard(r,'fcr');const wdiff=w!==null&&sw!==null?w-sw:null,fdiff=ff!==null&&mf!==null?ff-mf:null;const wStatus=wdiff===null?'—':wdiff>=0?'بالاتر/مطلوب':'پایین‌تر';const fStatus=fdiff===null?'—':fdiff<=0?'مطابق/بهتر':'بالاتر از هدف';return `<tr><td>هفته ${fmt(r.week_number,0)}</td><td>${fmt(w,1)} g</td><td>${fmt(sw,1)} g</td><td class="${wStatus==='پایین‌تر'?'status-warn':'status-good'}">${wStatus}</td>${t==='گوشتی'?`<td>${fmt(ff,3)}</td><td>${fmt(mf,3)}</td><td class="${fStatus==='بالاتر از هدف'?'status-warn':'status-good'}">${fStatus}</td><td>${fmt(fc,3)}</td><td>${fmt(sf,3)}</td>`:''}</tr>`}).join('');$('root').innerHTML=`<section class="section"><div class="section-title"><div><div class="eyebrow">BENCHMARK COMPARISON</div><h2>گزارش مقایسه‌ای</h2></div><span class="scope">همان گله — ${fmt(rows.length,0)} هفته</span></div><div class="insights"><div class="insight"><strong>مرجع رسمی</strong><span>استاندارد رسمی مربوط به ژنتیک و سویه همین گله، بدون جایگزینی با عدد ساختگی.</span></div><div class="insight"><strong>هدف مدیریتی</strong><span>برای شاخص‌های دارای هدف مدیریتی، مقدار هدف از همان موتور موجود سامانه خوانده می‌شود.</span></div><div class="insight"><strong>اصل مقایسه</strong><span>گزارش فقط از داده‌های واقعی ثبت‌شده همین گله استفاده می‌کند.</span></div></div></section><section class="section"><div class="table-wrap"><table class="data"><thead><tr><th>هفته</th><th>وزن واقعی</th><th>استاندارد رسمی</th><th>وضعیت وزن</th>${t==='گوشتی'?'<th>FCR واقعی</th><th>هدف مدیریتی</th><th>وضعیت FCR</th><th>FCR تجمعی</th><th>استاندارد تجمعی</th>':''}</tr></thead><tbody>${rowsHtml}</tbody></table></div></section><section class="section"><div class="charts"><div class="chart-box wide"><h3>وزن واقعی در برابر استاندارد رسمی</h3><div class="chart-area"><canvas id="xWeight"></canvas></div></div>${t==='گوشتی'?'<div class="chart-box"><h3>FCR هفتگی در برابر هدف مدیریتی</h3><div class="chart-area"><canvas id="xFcrW"></canvas></div></div><div class="chart-box"><h3>FCR تجمعی در برابر استاندارد رسمی</h3><div class="chart-area"><canvas id="xFcrC"></canvas></div></div>':''}</div></section>`;const labels=rows.map(x=>'هفته '+fmt(x.week_number,0));draw('xWeight',labels,[{label:'وزن واقعی',data:rows.map(weight)},{label:'استاندارد رسمی',data:rows.map(x=>standard(x,'weight'))}]);if(t==='گوشتی'){draw('xFcrW',labels,[{label:'FCR واقعی',data:rows.map(x=>fcr(x))},{label:'هدف مدیریتی',data:rows.map(x=>mgmtFcr(x))}]);draw('xFcrC',labels,[{label:'FCR تجمعی واقعی',data:rows.map(x=>fcr(x,true))},{label:'استاندارد رسمی تجمعی',data:rows.map(x=>standard(x,'fcr'))}]);}}
function render(){tab==='weekly'?weekly():tab==='overall'?overall():compare()}
function selectedId(){const direct=params.get('flock_id')||params.get('flockId')||params.get('id');if(direct)return direct;try{const raw=localStorage.getItem('adine_poultry_current_selection');if(raw){const o=JSON.parse(raw);return o?.flockId||o?.flock_id||null}}catch(e){}return null}
const flockId=selectedId();
$('print').onclick=()=>window.print();$('back').onclick=()=>location.href=flockId?`weekly.html?flock_id=${encodeURIComponent(flockId)}`:'weekly.html';$('weeklyNav').onclick=()=>location.href=flockId?`weekly.html?flock_id=${encodeURIComponent(flockId)}`:'weekly.html';
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()}));$('week').addEventListener('change',render);
async function load(){if(!flockId){$('root').innerHTML='<div class="empty">شناسه گله از ثبت هفتگی دریافت نشده است.</div>';return}try{const fr=await supabaseClient.from('flocks').select('*').eq('id',flockId).maybeSingle();if(fr.error)throw fr.error;if(!fr.data)throw new Error('گله انتخاب‌شده پیدا نشد.');flock=fr.data;const wr=await supabaseClient.from('weekly_monitoring').select('*').eq('flock_id',flockId).order('week_number',{ascending:true});if(wr.error)throw wr.error;rows=wr.data||[];identity();$('week').innerHTML=rows.map((r,i)=>`<option value="${i}">هفته ${esc(r.week_number)} — روز ${esc(r.age_days)}</option>`).join('');const q=n(params.get('week'));if(q!==null){const idx=rows.findIndex(r=>n(r.week_number)===q);if(idx>=0)$('week').value=idx}render()}catch(e){console.error(e);$('root').innerHTML=`<div class="error">خطا در بارگذاری گزارش: ${esc(e.message||e)}</div>`}}
await load();
})();
