ing:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar select{min-width:220px;padding:8px;border:1px solid #d5dfda;border-radius:9px;font:inherit}.badge{padding:6px 9px;border-radius:18px;background:#eef4f1;color:#42665a;font-size:9px;font-weight:900}.section{padding:15px 17px}.section h2{margin:0 0 11px;font-size:16px}.section h3{margin:0 0 9px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:10px;border:1px solid #e0e8e4;border-radius:10px;background:#f9fbfa}.label{font-size:8px;color:#738079;font-weight:800}.value{margin-top:5px;font-size:16px;font-weight:900}.ref{margin-top:3px;font-size:8px;color:#687770;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #e0e8e4;border-radius:11px;padding:10px}.chart{height:300px}.notice{padding:10px;background:#f7faf8;border:1px solid #e0e8e4;border-radius:9px;font-size:9px;line-height:2;color:#586a63}.error{padding:15px;background:#fff4f4;border:1px solid #efcdca;border-radius:10px;color:#922d29;font-size:10px;line-height:2}.empty{text-align:center;padding:35px;color:#687770;font-size:10px}.table-wrap{overflow:auto}.data{width:100%;min-width:900px;border-collapse:collapse;font-size:9px}.data th,.data td{padding:7px;text-align:center;border-bottom:1px solid #e8eeeb}.data th{background:#173f35;color:#fff}.bottom-navigation{position:fixed;z-index:1000;right:0;left:0;bottom:0;height:72px;display:flex;align-items:stretch;justify-content:center;background:rgba(255,255,255,.97);border-top:1px solid #dfe6e2;box-shadow:0 -5px 20px rgba(20,45,38,.10);padding:6px max(10px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right));backdrop-filter:blur(10px)}.bottom-nav-item{flex:1;max-width:150px;border:0;background:transparent;color:#718079;font:inherit;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:12px}.bottom-nav-item.active{color:#173f35;background:#edf4f1}.bottom-nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}.bottom-nav-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(max-width:850px){.identity-grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.identity-grid,.cards{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:stretch}.actions .btn{flex:1}.tab{font-size:9px;padding:10px 3px}.toolbar{flex-direction:column;align-items:stretch}.toolbar select{width:100%}}@media print{body{padding-bottom:0}.tabs,.toolbar,.actions,.bottom-navigation{display:none!important}}</style></head><body><main class="wrap"><header class="panel head"><div><h1>گزارش عملکرد گله</h1><div class="muted">گزارش فقط از همان گله‌ای ساخته می‌شود که از ثبت هفتگی وارد شده است.</div></div><div class="actions"><button class="btn secondary" id="back">بازگشت به ثبت گزارش</button><button class="btn primary" onclick="window.print()">چاپ</button></div></header><section class="panel identity"><div id="identity" class="identity-grid"></div></section><nav class="panel tabs"><button class="tab active" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="overall">گزارش جامع عملکرد گله</button><button class="tab" data-tab="compare">گزارش مقایسه‌ای</button></nav><section class="panel toolbar"><div><b>هفته گزارش:</b> <select id="week"></select></div><span id="scope" class="badge">در حال بارگذاری…</span></section><section id="root" class="panel"><div class="empty">در حال بارگذاری گله انتخاب‌شده…</div></section></main><nav class="bottom-navigation" aria-label="ناوبری اصلی"><button type="button" class="bottom-nav-item" onclick="location.href='Dashboard.html'"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6"></path></svg></span><span>خانه</span></button><button type="button" class="bottom-nav-item" onclick="location.href='flocks.html'"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"></path><path d="M7 21v-7h10v7"></path><path d="M9 10h6"></path><path d="M12 7v3"></path></svg></span><span>فارم‌ها</span></button><button type="button" class="bottom-nav-item" id="weeklyNav"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h17"></path><path d="M6.5 15l4-4 3 2 5-6"></path></svg></span><span>ثبت هفتگی</span></button><button type="button" class="bottom-nav-item active"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"></path><path d="M15 3v5h5"></path><path d="M9 12h6"></path><path d="M9 16h6"></path></svg></span><span>گزارش‌ها</span></button></nav><script>'use strict';(async()=>{const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);function selectedId(){const direct=p.get('flock_id')||p.get('flockId')||p.get('id');if(direct)return direct;try{const raw=localStorage.getItem('adine_poultry_current_selection');if(raw){const o=JSON.parse(raw);return o?.flockId||o?.flock_id||null}}catch(e){}return null}const flockId=selectedId();let flock=null,rows=[],tab='weekly',charts=[];const n=v=>{if(v===null||v===undefined||v==='')return null;const x=Number(String(v).replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776)).replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632)).replace(/[٬,]/g,'').replace('٫','.'));return Number.isFinite(x)?x:null},fmt=(v,d=1)=>n(v)==null?'—':n(v).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d}),pick=(r,ks)=>{for(const k of ks){const x=n(r?.[k]);if(x!==null)return x}return null},esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),type=x=>{const s=String(x||'').toLowerCase();if(/broiler|گوشتی|meat/.test(s))return'گوشتی';if(/pullet|پولت/.test(s))return'پولت';if(/layer|تخم/.test(s))return'تخم‌گذار';if(/breeder|مادر/.test(s))return'مادر';return x||'—'};function destroy(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}function standard(r,key){try{if(typeof resolvePoultryStandard!=='function')return null;const s=resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:n(r.age_days)});return n(s?.[key])}catch(e){return null}}function chart(id,labels,datasets){const c=$(id);if(!c||!window.Chart)return;charts.push(new Chart(c,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:false}}}}))}function fcr(r,kind){return pick(r,kind==='cum'?['fcr_cumulative','cumulative_fcr','cum_fcr']:['fcr_weekly','weekly_fcr','fcr'])}function weeklyGain(r,index,sourceRows){const direct=pick(r,['weekly_weight_gain_g','weight_gain_g','weekly_gain_g','weight_gain']);if(direct!==null)return direct;const prev=sourceRows[index-1];if(!prev)return null;const cur=pick(r,['average_weight_g','avg_weight_g','weight_g']);const pw=pick(prev,['average_weight_g','avg_weight_g','weight_g']);return cur!==null&&pw!==null?cur-pw:null}function standardWeeklyGain(r,sourceRows,index){const cur=standard(r,'weight');if(cur===null)return null;if(index<=0)return null;const prev=standard(sourceRows[index-1],'weight');return prev===null?null:cur-prev}function fcrManagementTarget(r){const week=n(r?.week_number);try{if(typeof resolvePoultryStandard==='function'){const cur=resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:n(r.age_days)});const prevRow=rows.find(x=>n(x.week_number)===week-1);const prev=prevRow?resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:n(prevRow.age_days)}):null;const curCum=n(cur?.fcr),prevCum=prev?n(prev.fcr):null,curW=n(cur?.weight),prevW=prev?n(prev.weight):null;if(curCum!=null&&prevCum!=null&&curW!=null&&prevW!=null&&curW>prevW){const gain=curW-prevW;const feedCur=curCum*(curW-(prevW||0));const feedPrev=prevCum*(prevW||0);return(feedCur-feedPrev)/gain}}}catch(e){}return null}function identity(){const name=flock.flock_name||flock.name||flock.flock_code||'—';$('identity').innerHTML=`<div class="identity-item"><small>گله</small><strong>${esc(name)}</strong></div><div class="identity-item"><small>نوع پرورش</small><strong>${esc(type(flock.production_type))}</strong></div><div class="identity-item"><small>ژنتیک</small><strong>${esc(flock.genetics||flock.genetic_line||'—')}</strong></div><div class="identity-item"><small>سویه</small><strong>${esc(flock.strain||flock.breed||'—')}</strong></div><div class="identity-item"><small>پایش واقعی</small><strong>${fmt(rows.length,0)} هفته</strong></div>`;$('scope').textContent='گله انتخاب‌شده: '+name}function card(a){return'<div class="cards">'+a.map(x=>`<div class="metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="ref">${x[2]||''}</div></div>`).join('')+'</div>'}function weekly(){destroy();const r=rows[Number($('week').value)||0];if(!r)return;const t=type(flock.production_type),rs=rows.filter(x=>n(x.week_number)<=n(r.week_number)),labels=rs.map(x=>'هفته '+fmt(x.week_number,0)),water=pick(r,['water_total_liter','water_liter','water_total']),feed=pick(r,['feed_total_kg','feed_kg','feed_total']),ratio=water!=null&&feed!=null&&feed>0?water/feed:null,items=[['سن',fmt(r.age_days,0)+' روز'],['میانگین وزن',fmt(pick(r,['average_weight_g','avg_weight_g','weight_g']),1)+' گرم',standard(r,'weight')!==null?'استاندارد رسمی: '+fmt(standard(r,'weight'),1)+' گرم':''],['CV',fmt(pick(r,['cv_percent','cv']),2)+' %'],['یکنواختی ±10',fmt(pick(r,['uniformity_10_percent','uniformity_10']),1)+' %'],['یکنواختی ±15',fmt(pick(r,['uniformity_15_percent','uniformity_15']),1)+' %'],['دان',fmt(feed,1)+' kg'],['آب',fmt(water,1)+' L'],['نسبت آب به دان هفتگی',ratio==null?'—':fmt(ratio*100,1)+' %',ratio==null?'':'آب: '+fmt(ratio,2)+' برابر دان'],['تلفات',fmt(pick(r,['mortality_count','mortality','deaths']),0)+' قطعه']];if(t==='گوشتی'){const fs=standard(r,'fcr');items.push(['FCR هفتگی',fmt(fcr(r,'week'),3),'هدف مدیریتی: '+fmt(fcrManagementTarget(r),3)],['FCR تجمعی',fmt(fcr(r,'cum'),3),fs!==null?'استاندارد رسمی: '+fmt(fs,3):''])}$('root').innerHTML=`<section class="section"><h2>گزارش هفتگی — هفته ${fmt(r.week_number,0)}</h2>${card(items)}</section><section class="section"><div class="grid"><div class="box chart"><h3>میانگین وزن — واقعی و استاندارد رسمی</h3><canvas id="wWeight"></canvas></div><div class="box chart"><h3>افزایش وزن هفتگی — واقعی و استاندارد رسمی</h3><canvas id="wGain"></canvas></div><div class="box chart"><h3>FCR تجمعی — واقعی و استاندارد رسمی</h3><canvas id="wFcrCum"></canvas></div><div class="box chart"><h3>FCR هفتگی — واقعی و هدف مدیریتی</h3><canvas id="wFcrWeek"></canvas></div></div></section>`;chart('wWeight',labels,[{label:'میانگین وزن واقعی',data:rs.map(x=>pick(x,['average_weight_g','avg_weight_g','weight_g']))},{label:'استاندارد رسمی وزن',data:rs.map(x=>standard(x,'weight'))}]);chart('wGain',labels,[{label:'افزایش وزن واقعی',data:rs.map((x,i)=>weeklyGain(x,i,rows))},{label:'استاندارد رسمی افزایش وزن',data:rs.map((x,i)=>standardWeeklyGain(x,rows,i))}]);chart('wFcrCum',labels,[{label:'FCR تجمعی واقعی',data:rs.map(x=>fcr(x,'cum'))},{label:'استاندارد رسمی FCR تجمعی',data:rs.map(x=>standard(x,'fcr'))}]);chart('wFcrWeek',labels,[{label:'FCR هفتگی واقعی',data:rs.map(x=>fcr(x,'week'))},{label:'هدف مدیریتی FCR هفتگی',data:rs.map(x=>fcrManagementTarget(x))}])}function overall(){destroy();const t=type(flock.production_type),labels=rows.map(x=>'هفته '+fmt(x.week_number,0));$('root').innerHTML=`<section class="section"><h2>گزارش جامع عملکرد گله</h2><div class="grid"><div class="box chart"><h3>روند وزن</h3><canvas id="o1"></canvas></div><div class="box chart"><h3>${t==='گوشتی'?'روند FCR':'روند CV'}</h3><canvas id="o2"></canvas></div></div></section>`;chart('o1',labels,[{label:'وزن واقعی',data:rows.map(x=>pick(x,['average_weight_g','avg_weight_g','weight_g']))},{label:'استاندارد رسمی',data:rows.map(x=>standard(x,'weight'))}]);chart('o2',labels,t==='گوشتی'?[{label:'FCR هفتگی',data:rows.map(x=>fcr(x,'week'))},{label:'هدف مدیریتی FCR هفتگی',data:rows.map(x=>fcrManagementTarget(x))},{label:'FCR تجمعی',data:rows.map(x=>fcr(x,'cum'))},{label:'استاندارد رسمی FCR تجمعی',data:rows.map(x=>standard(x,'fcr'))}]:[{label:'CV %',data:rows.map(x=>pick(x,['cv_percent','cv']))}])}function compare(){destroy();$('root').innerHTML='<section class="section"><h2>گزارش مقایسه‌ای</h2><div class="notice">این بخش طبق ساختار فعلی سامانه بدون تغییر محتوایی نمایش داده می‌شود.</div></section>'}async function load(){if(!flockId){$('root').innerHTML='<div class="empty">شناسه گله در دسترس نیست.</div>';return}try{const fr=await supabaseClient.from('flocks').select('*').eq('id',flockId).maybeSingle();if(fr.error)throw fr.error;flock=fr.data;const wr=await supabaseClient.from('weekly_monitoring').select('*').eq('flock_id',flockId).order('week_number',{ascending:true});if(wr.error)throw wr.error;rows=wr.data||[];identity();$('week').innerHTML=rows.map((r,i)=>`<option value="${i}">هفته ${esc(r.week_number)} — روز ${esc(r.age_days)}</option>`).join('');const q=Number(p.get('week'));if(Number.isFinite(q)&&q>0){const idx=rows.findIndex(r=>n(r.week_number)===q);if(idx>=0)$('week').value=idx}weekly()}catch(e){console.error(e);$('root').innerHTML=`<div class="error">خطا در بارگذاری گزارش: ${esc(e.message||e)}</div>`}}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;tab==='weekly'?weekly():tab==='overall'?overall():compare()}));$('week').addEventListener('change',weekly);$('back').onclick=()=>location.href=flockId?`weekly.html?flock_id=${encodeURIComponent(flockId)}`:'weekly.html';$('weeklyNav').onclick=()=>location.href=flockId?`weekly.html?flock_id=${encodeURIComponent(flockId)}`:'weekly.html';await load()})()</script><script src="health-records-runtime-v2.js"></script></body></html>
