<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارشات گله | مرکز تخصصی سلامت طیور آدینه</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="report-engine-broiler-v1.js"></script><script src="report-engine-pullet-v1.js"></script><script src="report-engine-layer-v1.js"></script><script src="report-engine-breeder-v1.js"></script><script src="report-benchmark-runtime-v1.js"></script><script src="report-standard-source-registry-v1.js"></script><style>body{margin:0;background:#f4f7f6;color:#18232d;font-family:Tahoma,Arial,sans-serif;padding-bottom:70px}.wrap{width:min(1500px,95%);margin:18px auto}.hero,.panel{background:#fff;border:1px solid #e5ebe8;border-radius:18px;box-shadow:0 5px 20px rgba(20,40,35,.06);margin-bottom:14px}.hero{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.hero h1{margin:0 0 6px;font-size:23px}.muted{font-size:12px;color:#66756f;line-height:1.9}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer}.back{background:#edf2ef;color:#24463b}.print{background:#173f35;color:#fff}.identity{padding:14px}.identity-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.identity-item{background:#f7faf9;border:1px solid #e1e9e5;border-radius:12px;padding:10px}.identity-item b{display:block;color:#718079;font-size:10px}.identity-item span{display:block;font-weight:900;margin-top:5px;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tab{border:1px solid #d9e2de;background:#fff;border-radius:13px;padding:14px;font:inherit;font-weight:900;color:#33443e;cursor:pointer}.tab.active{background:#173f35;color:#fff;border-color:#173f35}.toolbar{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.week-select{display:flex;align-items:center;gap:8px;font-weight:800}.week-select select{min-width:180px;border:1px solid #d7dfdc;border-radius:10px;padding:10px;font:inherit;background:#fff}.section{padding:18px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section-title h2,.section-title h3{margin:0}.badge{border-radius:20px;padding:5px 9px;font-size:10px;font-weight:900;background:#eef4f1;color:#41675b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#f8faf9;border:1px solid #e1e9e5;border-radius:13px;padding:12px;min-height:78px}.card .label{font-size:10px;color:#718079;font-weight:800}.card .value{font-size:20px;font-weight:900;margin-top:6px}.card .ref{font-size:10px;color:#66756f;line-height:1.7;margin-top:3px}.comparison-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare-card{border:1px solid #e1e9e5;border-radius:14px;padding:14px;background:#fff}.compare-card h3{margin:0 0 9px;font-size:14px}.compare-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #edf1ef;font-size:12px}.compare-row:last-child{border-bottom:0}.status{font-weight:900}.ok{color:#21734e}.warn{color:#a26512}.bad{color:#a32929}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chart-box{height:320px;border:1px solid #e3e9e7;border-radius:14px;padding:10px;background:#fff}.chart-box h3{font-size:13px;margin:4px 7px 8px}.chart-box canvas{height:270px!important}.notice{border-radius:12px;padding:12px;font-size:11px;line-height:2;background:#f5f8f7;border:1px solid #e0e8e4;color:#53635d}.table-wrap{overflow:auto}.data-table{width:100%;min-width:1150px;border-collapse:collapse;font-size:11px}.data-table th,.data-table td{padding:8px;text-align:center;border-bottom:1px solid #e6ece9}.data-table th{background:#173f35;color:#fff;position:sticky;top:0}.data-table tr:hover td{background:#f7faf9}.empty{text-align:center;padding:35px;color:#66756f}@media(max-width:900px){.identity-grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.comparison-grid,.chart-grid{grid-template-columns:1fr}}@media(max-width:560px){.identity-grid,.cards,.tabs{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:19px}.chart-box{height:285px}.chart-box canvas{height:235px!important}}@media print{.tabs,.actions,.toolbar{display:none!important}.hero,.panel{box-shadow:none;border:0}}
</style></head><body><main class="wrap"><header class="hero"><div><h1>گزارشات گله</h1><div class="muted">گزارش یکپارچه متصل به ثبت هفتگی؛ تمام اعداد از سوابق واقعی همین گله محاسبه می‌شوند.</div></div><div class="actions"><button class="btn back" id="back">بازگشت به ثبت گزارش</button><button class="btn print" onclick="window.print()">چاپ گزارش</button></div></header><section class="panel identity"><div id="identity" class="identity-grid"></div></section><nav class="tabs" aria-label="گزارشات"><button class="tab active" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="comprehensive">گزارش کلی گله</button><button class="tab" data-tab="comparison">گزارش مقایسه‌ای</button></nav><section class="panel toolbar"><div class="week-select"><label for="week">هفته گزارش:</label><select id="week"></select></div><button class="btn print" id="recalc">محاسبه مجدد</button></section><section id="root" class="panel"></section></main><script>(async()=>{const $=id=>document.getElementById(id),N=x=>{const n=Number(x);return Number.isFinite(n)?n:null},fmt=(x,d=1,u='')=>N(x)==null?'—':N(x).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d})+u,TYPE={broiler:'گوشتی',pullet:'پولت',layer:'تخم‌گذار',breeder:'مادر'},ENG={broiler:window.BROILER_REPORT_ENGINE,pullet:window.PULLET_REPORT_ENGINE,layer:window.LAYER_REPORT_ENGINE,breeder:window.BREEDER_REPORT_ENGINE};let flock=null,rows=[],built=[],tab='weekly',charts=[];const type=()=>window.normalizePoultryProductionType?window.normalizePoultryProductionType(flock?.production_type):(flock?.production_type||'broiler');const metric=(r,keys)=>{for(const k of keys){const v=N(r?.[k]??(r?.production_metrics||{})[k]);if(v!=null)return v}return null};const std=(age,m)=>{if(!flock||!window.resolvePoultryStandard)return null;const s=window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:age});return m==='weight'?s?.weight??null:m==='fcr'?s?.fcr??null:null};async function reference(age,m){const official=std(age,m);if(window.AdineBenchmark?.resolve)return window.AdineBenchmark.resolve({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:age,metric:m,official});return official==null?null:{value:official,source:'official'}}function destroy(){charts.forEach(c=>c.destroy());charts=[]}function line(id,labels,datasets){const el=$(id);if(!el)return;charts.push(new Chart(el,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}},elements:{line:{tension:.25},point:{radius:3}},scales:{x:{ticks:{maxRotation:0}},y:{beginAtZero:false}}}}))}function card(a){return a.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="ref">${x[2]||''}</div></div>`).join('')}function delta(a,b,reverse=false){if(a==null||b==null)return{txt:'—',cls:'warn'};const d=a-b,p=b?d/b*100:0;const bad=reverse?d>0:d<0;return{txt:`${fmt(d,2)} (${fmt(p,1)}%)`,cls:bad?'bad':'ok'}}function identity(){const t=type();$('identity').innerHTML=`<div class="identity-item"><b>گله</b><span>${flock?.flock_name||'—'}</span></div><div class="identity-item"><b>نوع پرورش</b><span>${TYPE[t]||t}</span></div><div class="identity-item"><b>ژنتیک</b><span>${flock?.genetics||'—'}</span></div><div class="identity-item"><b>سویه</b><span>${flock?.strain||'—'}</span></div><div class="identity-item"><b>پایش واقعی</b><span>${fmt(rows.length,0)} هفته</span></div>`}function weekly(r,i,t,x,bw,bf){const weight=delta(N(r.average_weight_g),bw?.value),fcr=t==='broiler'?delta(x.weeklyFcr??r.fcr,bf?.value,true):null;let extras=t==='broiler'?[['FCR هفتگی',fmt(x.weeklyFcr??r.fcr,3),`${bf?.source==='official'?'رسمی':'مدیریتی'}: ${fmt(bf?.value,3)}`],['FCR تجمعی',fmt(x.cumulativeFcr??r.cumulative_fcr,3),'محاسبه تجمعی بر پایه سوابق واقعی'],['دان/پرنده',fmt(r.feed_per_bird_g,1,' گرم'),'']]:t==='layer'?[['تولید تخم',fmt(metric(r,['hen_day_production','henDayProduction','egg_production_percent']),1,'%'),''],['وزن تخم',fmt(metric(r,['egg_weight_g','eggWeightG']),1,' گرم'),''],['Egg Mass',fmt(metric(r,['egg_mass_g','eggMassG']),1,' گرم'),''],['FCR',fmt(metric(r,['egg_mass_fcr','eggMassFcr','fcr']),3),'']]:t==='breeder'?[['تولید روزانه',fmt(metric(r,['hen_day_production','henDayProduction']),1,'%'),''],['باروری',fmt(metric(r,['fertility_percent','fertilityPercent']),1,'%'),''],['هچ‌پذیری',fmt(metric(r,['hatchability_percent','hatchabilityPercent']),1,'%'),'']]:[['دان/پرنده',fmt(r.feed_per_bird_g,1,' گرم'),'']];$('root').innerHTML=`<section class="section"><div class="section-title"><h2>گزارش پایش هفتگی — هفته ${fmt(r.week_number,0)}</h2><span class="badge">داده واقعی ثبت‌شده</span></div><div class="cards">${card([['سن',fmt(r.age_days,0,' روز'),''],['وزن',fmt(r.average_weight_g,1,' گرم'),`${bw?.source==='official'?'استاندارد رسمی':'استاندارد مدیریتی'}: ${fmt(bw?.value,1,' گرم')}`],['اختلاف وزن',weight.txt,`وضعیت: ${weight.cls==='ok'?'مطلوب/قابل قبول':'نیازمند بررسی'}`],['CV',fmt(r.cv_percent,2,'%'),''],['یکنواختی ±10%',fmt(r.uniformity_10_percent,1,'%'),''],['یکنواختی ±15%',fmt(r.uniformity_15_percent,1,'%'),''],['دان',fmt(r.feed_total_kg,1,' کیلوگرم'),''],['آب',fmt(r.water_total_liter,1,' لیتر'),''],['تلفات',fmt(r.mortality_count,0,' قطعه'),''],...extras])}</div></section><section class="section"><div class="section-title"><h3>ارزیابی مرجع</h3><span class="badge">${bw?.source==='official'?'استاندارد رسمی':'استاندارد مدیریتی'}</span></div><div class="comparison-grid"><div class="compare-card"><h3>وزن</h3><div class="compare-row"><span>واقعی</span><b>${fmt(r.average_weight_g,1,' گرم')}</b></div><div class="compare-row"><span>مرجع</span><b>${fmt(bw?.value,1,' گرم')}</b></div><div class="compare-row"><span>اختلاف</span><b class="status ${weight.cls}">${weight.txt}</b></div></div>${t==='broiler'?`<div class="compare-card"><h3>FCR هفتگی</h3><div class="compare-row"><span>واقعی</span><b>${fmt(x.weeklyFcr??r.fcr,3)}</b></div><div class="compare-row"><span>مرجع</span><b>${fmt(bf?.value,3)}</b></div><div class="compare-row"><span>اختلاف</span><b class="status ${fcr?.cls||'warn'}">${fcr?.txt||'—'}</b></div></div>`:''}</div></section><section class="section"><div class="section-title"><h3>روند هفتگی تا هفته انتخاب‌شده</h3><span class="badge">فقط رکوردهای واقعی گله</span></div><div class="chart-grid"><div class="chart-box"><h3>وزن واقعی در برابر مرجع</h3><canvas id="wWeight"></canvas></div>${t==='broiler'?'<div class="chart-box"><h3>FCR هفتگی و تجمعی در برابر مرجع</h3><canvas id="wFcr"></canvas></div>':'<div class="chart-box"><h3>CV و یکنواختی</h3><canvas id="wQuality"></canvas></div>'}</div></section>`;const q=rows.filter(z=>N(z.week_number)<=N(r.week_number)),lab=q.map(z=>'هفته '+N(z.week_number));line('wWeight',lab,[{label:'وزن واقعی',data:q.map(z=>N(z.average_weight_g))},{label:'مرجع وزن',data:q.map(z=>std(N(z.age_days),'weight'))}]);if(t==='broiler')line('wFcr',lab,[{label:'FCR هفتگی واقعی',data:q.map(z=>built[rows.indexOf(z)]?.weeklyFcr??N(z.fcr))},{label:'FCR تجمعی واقعی',data:q.map(z=>built[rows.indexOf(z)]?.cumulativeFcr??N(z.cumulative_fcr))},{label:'مرجع FCR',data:q.map(z=>std(N(z.age_days),'fcr'))}]);else line('wQuality',lab,[{label:'CV %',data:q.map(z=>N(z.cv_percent))},{label:'یکنواختی ±10 %',data:q.map(z=>N(z.uniformity_10_percent))}])}function comprehensive(last,t){const x=built.at(-1)||{};$('root').innerHTML=`<section class="section"><div class="section-title"><h2>گزارش کلی و تجمعی گله</h2><span class="badge">از اولین تا آخرین رکورد واقعی</span></div><div class="cards">${card([['تعداد پایش',fmt(rows.length,0),''],['آخرین سن',fmt(last.age_days,0,' روز'),''],['آخرین وزن',fmt(last.average_weight_g,1,' گرم'),''],['CV آخرین پایش',fmt(last.cv_percent,2,'%'),''],['یکنواختی ±10',fmt(last.uniformity_10_percent,1,'%'),''],['دان کل ثبت‌شده',fmt(rows.reduce((a,r)=>a+(N(r.feed_total_kg)||0),0),1,' کیلوگرم'),''],['آب کل ثبت‌شده',fmt(rows.reduce((a,r)=>a+(N(r.water_total_liter)||0),0),1,' لیتر'),''],['تلفات ثبت‌شده',fmt(rows.reduce((a,r)=>a+(N(r.mortality_count)||0),0),0,' قطعه'),''],...(t==='broiler'?[['FCR تجمعی',fmt(x.cumulativeFcr??last.cumulative_fcr,3),'']]:[])])}</div></section><section class="section"><div class="section-title"><h3>روند تجمعی</h3></div><div class="chart-grid"><div class="chart-box"><h3>وزن گله و مرجع</h3><canvas id="cWeight"></canvas></div><div class="chart-box"><h3>${t==='broiler'?'FCR تجمعی و مرجع':'CV و یکنواختی'}</h3><canvas id="cMetric"></canvas></div></div></section><section class="section"><div class="section-title"><h3>جدول کامل سوابق ثبت هفتگی</h3></div><div class="table-wrap"><table class="data-table"><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>CV</th><th>یکنواختی ±10</th><th>دان kg</th><th>آب L</th><th>تلفات</th>${t==='broiler'?'<th>FCR هفتگی</th><th>FCR تجمعی</th>':''}</tr></thead><tbody>${rows.map((r,i)=>{const x=built[i]||{};return`<tr><td>${fmt(r.week_number,0)}</td><td>${fmt(r.age_days,0)}</td><td>${fmt(r.average_weight_g,1)}</td><td>${fmt(r.cv_percent,2)}%</td><td>${fmt(r.uniformity_10_percent,1)}%</td><td>${fmt(r.feed_total_kg,1)}</td><td>${fmt(r.water_total_liter,1)}</td><td>${fmt(r.mortality_count,0)}</td>${t==='broiler'?`<td>${fmt(x.weeklyFcr??r.fcr,3)}</td><td>${fmt(x.cumulativeFcr??r.cumulative_fcr,3)}</td>`:''}</tr>`}).join('')}</tbody></table></div></section>`;const lab=rows.map(r=>'هفته '+N(r.week_number));line('cWeight',lab,[{label:'وزن واقعی',data:rows.map(r=>N(r.average_weight_g))},{label:'مرجع وزن',data:rows.map(r=>std(N(r.age_days),'weight'))}]);if(t==='broiler')line('cMetric',lab,[{label:'FCR تجمعی',data:rows.map((r,i)=>built[i]?.cumulativeFcr??N(r.cumulative_fcr))},{label:'مرجع FCR',data:rows.map(r=>std(N(r.age_days),'fcr'))}]);else line('cMetric',lab,[{label:'CV %',data:rows.map(r=>N(r.cv_percent))},{label:'یکنواختی ±10 %',data:rows.map(r=>N(r.uniformity_10_percent))}])}async function comparison(last,t){const x=built.at(-1)||{},spec=t==='broiler'?[['وزن',N(last.average_weight_g),'weight'],['FCR هفتگی',N(x.weeklyFcr??last.fcr),'fcr'],['FCR تجمعی',N(x.cumulativeFcr??last.cumulative_fcr),'cumulative_fcr']]:[['وزن',N(last.average_weight_g),'weight']];let html=`<section class="section"><div class="section-title"><h2>گزارش مقایسه‌ای</h2><span class="badge">رسمی ← مدیریتی</span></div><div class="notice">مرجع هر شاخص بر اساس نوع پرورش، ژنتیک، سویه، واریانت و سن تعیین می‌شود. اگر استاندارد رسمی معتبر وجود نداشته باشد، Benchmark مدیریتی جایگزین می‌شود. برای شاخص بدون مرجع معتبر، عدد ساختگی تولید نمی‌شود.</div><div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>شاخص</th><th>واقعی</th><th>مرجع</th><th>منبع</th><th>اختلاف</th><th>ارزیابی</th></tr></thead><tbody>`;for(const [name,a,m] of spec){const r=await reference(N(last.age_days),m==='cumulative_fcr'?'fcr':m),rv=r?.value??null,reverse=m.includes('fcr'),d=delta(a,rv,reverse);html+=`<tr><td>${name}</td><td>${fmt(a,m.includes('fcr')?3:1)}</td><td>${fmt(rv,m.includes('fcr')?3:1)}</td><td>${r?(r.source==='official'?'استاندارد رسمی':'استاندارد مدیریتی'):'بدون مرجع'}</td><td>${d.txt}</td><td class="status ${d.cls}">${d.cls==='ok'?'مطلوب/قابل قبول':d.cls==='bad'?'نیازمند بررسی':'بدون ارزیابی'}</td></tr>`}html+='</tbody></table></div></section>';if(t==='broiler')html+=`<section class="section"><div class="section-title"><h3>نمودار مقایسه‌ای FCR</h3></div><div class="chart-box"><canvas id="cmpFcr"></canvas></div></section>`;$('root').innerHTML=html;if(t==='broiler'){const lab=rows.map(r=>'هفته '+N(r.week_number));line('cmpFcr',lab,[{label:'FCR هفتگی واقعی',data:rows.map((r,i)=>built[i]?.weeklyFcr??N(r.fcr))},{label:'FCR تجمعی واقعی',data:rows.map((r,i)=>built[i]?.cumulativeFcr??N(r.cumulative_fcr))},{label:'مرجع FCR',data:rows.map(r=>std(N(r.age_days),'fcr'))}])}}async function render(){destroy();if(!flock||!rows.length){$('root').innerHTML='<div class="empty">برای این گله هنوز گزارش هفتگی ثبت نشده است.</div>';return}const i=Math.max(0,rows.findIndex(r=>N(r.week_number)===N($('week').value))),r=rows[i]||rows.at(-1),t=type(),bw=await reference(N(r.age_days),'weight'),bf=t==='broiler'?await reference(N(r.age_days),'fcr'):null;identity();if(tab==='weekly')weekly(r,i,t,built[i]||{},bw,bf);else if(tab==='comprehensive')comprehensive(r,t);else await comparison(r,t)}async function init(){const {data:fs,error}=await supabaseClient.from('flocks').select('*').order('created_at',{ascending:false});if(error){$('root').innerHTML=`<div class="empty">${error.message}</div>`;return}const p=new URLSearchParams(location.search),wanted=p.get('flock_id')||localStorage.getItem('active_flock_id');flock=(fs||[]).find(f=>String(f.id)===String(wanted))||(fs||[])[0]||null;if(!flock){$('root').innerHTML='<div class="empty">گله‌ای پیدا نشد.</div>';return}const q=await supabaseClient.from('weekly_records').select('*').eq('flock_id',flock.id).order('week_number',{ascending:true});if(q.error){$('root').innerHTML=`<div class="empty">${q.error.message}</div>`;return}rows=q.data||[];const e=ENG[type()];const resolver=age=>window.resolvePoultryStandard?window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:age}):null;built=e?.build?e.build(flock,rows,resolver):rows;$('week').innerHTML=rows.map(r=>`<option value="${N(r.week_number)}">هفته ${fmt(r.week_number,0)} — ${fmt(r.age_days,0)} روز</option>`).join('')||'<option>—</option>';if(p.get('week'))$('week').value=p.get('week');$('back').onclick=()=>{const u=new URL('weekly.html',location.href);u.searchParams.set('flock_id',flock.id);location.href=u.href};await render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;await render()});$('week').onchange=render;$('recalc').onclick=render;await init()})()</script><script src="health-records-runtime-v2.js"></script></body></html>
