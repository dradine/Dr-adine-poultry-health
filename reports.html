d:#1d3557;color:#fff}.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.weekbar select{border:1px solid #d7dde5;border-radius:10px;padding:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k{background:#f8faf9;border:1px solid #e3ebe7;border-radius:12px;padding:12px}.k b{display:block;color:#667085;font-size:11px}.k strong{display:block;font-size:20px;margin:5px 0}.k small{display:block;color:#667085;line-height:1.7}.compare{background:#f8fafc;border:1px solid #e6ebef;border-radius:11px;padding:13px;line-height:2;font-size:12px;margin-top:12px}.chart{height:310px;margin:15px 0}.table-wrap{overflow:auto}.table-wrap table{border-collapse:collapse;width:100%;min-width:1100px}.table-wrap th,.table-wrap td{padding:8px;border-bottom:1px solid #e5e9ed;text-align:center}.table-wrap th{background:#1d3557;color:#fff}.notice{padding:12px;border-radius:10px;background:#fff8e8;border:1px solid #f1dfaa;line-height:1.9;font-size:12px}.good{background:#eef9f1;border-color:#cce8d2}.danger{background:#fff1f1;border-color:#efcaca}@media(max-width:800px){.context,.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.context,.grid,.tabs{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}@media print{.tabs,.actions,.weekbar{display:none}.head,.panel,.report-pane{box-shadow:none}}</style></head><body><main class="wrap"><header class="head"><div><h1>گزارشات گله</h1><div class="muted">گزارش مستقیماً بر پایه سوابق ثبت هفتگی همین گله ساخته می‌شود.</div></div><div class="actions"><button class="btn secondary" onclick="location.href='weekly.html'">بازگشت به ثبت هفتگی</button><button class="btn primary" onclick="window.print()">چاپ گزارش</button></div></header><section class="panel"><div id="context" class="context"></div></section><nav class="tabs" aria-label="نوع گزارش"><button class="tab active" data-tab="weekly">گزارش هفتگی</button><button class="tab" data-tab="comprehensive">گزارش کلی گله</button><button class="tab" data-tab="comparison">گزارش مقایسه‌ای</button></nav><section class="panel"><div class="weekbar"><label for="week">هفته گزارش:</label><select id="week"></select><button class="btn primary" id="recalc">محاسبه مجدد</button></div></section><section id="root" class="report-pane"></section></main><script>(async()=>{const $=id=>document.getElementById(id),N=x=>{const n=Number(x);return Number.isFinite(n)?n:null},F=(x,d=1,u='')=>N(x)==null?'—':N(x).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d})+u;const TYPE={broiler:'گوشتی',pullet:'پولت',layer:'تخم‌گذار',breeder:'مادر'},ENG={broiler:window.BROILER_REPORT_ENGINE,pullet:window.PULLET_REPORT_ENGINE,layer:window.LAYER_REPORT_ENGINE,breeder:window.BREEDER_REPORT_ENGINE};let flock=null,rows=[],built=[],tab='weekly',charts=[];function normalize(x){return window.normalizePoultryProductionType?window.normalizePoultryProductionType(x):x}function type(){return normalize(flock?.production_type)||'broiler'}function standard(age,metric){if(!flock||!window.resolvePoultryStandard)return null;const s=window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:age});return metric==='weight'?s?.weight??null:metric==='fcr'?s?.fcr??null:null}async function ref(age,metric){if(window.AdineBenchmark?.resolve)return window.AdineBenchmark.resolve({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:age,metric,official:standard(age,metric)});const o=standard(age,metric);return o==null?null:{value:o,source:'official'}}function destroy(){charts.forEach(c=>c.destroy());charts=[]}function chart(id,labels,datasets){const e=$(id);if(!e)return;charts.push(new Chart(e,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top'}}}}))}function value(r,keys){for(const k of keys){const v=N(r[k]??(r.production_metrics||{})[k]);if(v!=null)return v}return null}function cards(a){return a.map(x=>`<div class="k"><b>${x[0]}</b><strong>${x[1]}</strong><small>${x[2]||''}</small></div>`).join('')}function cmp(actual,r){if(actual==null||r==null)return '—';const d=actual-r,p=(d/r)*100;return `${F(d,1)} (${F(p,1)}%)`}async function render(){destroy();if(!flock||!rows.length){$('root').innerHTML='<div class="notice">برای این گله هنوز رکورد هفتگی ثبت نشده است.</div>';return}const selected=N($('week').value),i=Math.max(0,rows.findIndex(r=>N(r.week_number)===selected)),r=rows[i]||rows.at(-1),t=type(),e=ENG[t],x=built[i]||{},bw=await ref(N(r.age_days),'weight'),bf=t==='broiler'?await ref(N(r.age_days),'fcr'):null;$('context').innerHTML=`<div class="item"><b>گله</b><span>${flock.flock_name||'—'}</span></div><div class="item"><b>نوع پرورش</b><span>${TYPE[t]||t}</span></div><div class="item"><b>ژنتیک / سویه</b><span>${flock.genetics||'—'} / ${flock.strain||'—'}</span></div><div class="item"><b>تعداد پایش واقعی</b><span>${F(rows.length,0)} رکورد</span></div>`;if(tab==='weekly')return weekly(r,i,t,x,bw,bf);if(tab==='comprehensive')return comprehensive(r,t,bw,bf);return comparison(r,t)}async function weekly(r,i,t,x,bw,bf){const extra=t==='broiler'?[['FCR هفتگی',F(x.weeklyFcr??r.fcr,3),`مرجع: ${F(bf?.value,3)} — ${bf?.source==='official'?'رسمی':'مدیریتی'}`],['FCR تجمعی',F(x.cumulativeFcr??r.cumulative_fcr,3),'بر پایه سوابق واقعی همین گله']]:t==='layer'?[['تولید تخم',F(value(r,['hen_day_production','henDayProduction','egg_production_percent']),1,'%'),''],['وزن تخم',F(value(r,['egg_weight_g','eggWeightG']),1,' گرم'),''],['Egg Mass',F(value(r,['egg_mass_g','eggMassG']),1,' گرم'),''],['FCR',F(value(r,['egg_mass_fcr','eggMassFcr','fcr']),3),'']]:t==='breeder'?[['تولید روزانه',F(value(r,['hen_day_production','henDayProduction']),1,'%'),''],['باروری',F(value(r,['fertility_percent','fertilityPercent']),1,'%'),''],['هچ‌پذیری',F(value(r,['hatchability_percent','hatchabilityPercent']),1,'%'),'']]:[['دان/پرنده',F(r.feed_per_bird_g,1,' گرم'),'']];$('root').innerHTML=`<h2>گزارش هفتگی — هفته ${F(r.week_number,0)}</h2><div class="grid">${cards([['سن',F(r.age_days,0,' روز'),''],['وزن',F(r.average_weight_g,1,' گرم'),`${bw?.source==='official'?'استاندارد رسمی':'استاندارد مدیریتی'}: ${F(bw?.value,1,' گرم')}`],['CV',F(r.cv_percent,2,'%'),''],['یکنواختی ±10%',F(r.uniformity_10_percent,1,'%'),''],['دان',F(r.feed_total_kg,1,' کیلوگرم'),''],['آب',F(r.water_total_liter,1,' لیتر'),''],['تلفات',F(r.mortality_count,0,' قطعه'),''],...extra])}</div><div class="compare">مقایسه وزن: ${cmp(N(r.average_weight_g),bw?.value)}<br>${t==='broiler'?`مقایسه FCR هفتگی: ${cmp(x.weeklyFcr??r.fcr,bf?.value)}<br>FCR تجمعی واقعی: ${F(x.cumulativeFcr??r.cumulative_fcr,3)}`:'مرجع هر شاخص فقط در صورت وجود استاندارد معتبر همان نوع/ژنتیک/سویه/سن نمایش داده می‌شود.'}</div><div class="chart"><canvas id="chart1"></canvas></div>${t==='broiler'?'<div class="chart"><canvas id="chart2"></canvas></div>':''}`;const q=rows.filter(z=>N(z.week_number)<=N(r.week_number)),lab=q.map(z=>'هفته '+N(z.week_number));chart('chart1',lab,[{label:'وزن واقعی',data:q.map(z=>N(z.average_weight_g))},{label:'استاندارد/مدیریتی وزن',data:q.map(z=>standard(N(z.age_days),'weight'))}]);if(t==='broiler')chart('chart2',lab,[{label:'FCR هفتگی',data:q.map(z=>built[rows.indexOf(z)]?.weeklyFcr??N(z.fcr))},{label:'FCR تجمعی',data:q.map(z=>built[rows.indexOf(z)]?.cumulativeFcr??N(z.cumulative_fcr))},{label:'استاندارد/مدیریتی FCR',data:q.map(z=>standard(N(z.age_days),'fcr'))}])}async function comprehensive(last,t,bw,bf){const x=built.at(-1)||{};$('root').innerHTML=`<h2>گزارش کلی و تجمعی گله</h2><div class="grid">${cards([['تعداد پایش',F(rows.length,0),'فقط سوابق همین گله'],['آخرین سن',F(last.age_days,0,' روز'),''],['آخرین وزن',F(last.average_weight_g,1,' گرم'),`مرجع: ${F(bw?.value,1,' گرم')}`],t==='broiler'?['FCR تجمعی',F(x.cumulativeFcr??last.cumulative_fcr,3),`مرجع: ${F(bf?.value,3)} — ${bf?.source==='official'?'رسمی':'مدیریتی'}`]:['تلفات ثبت‌شده',F(rows.reduce((a,z)=>a+(N(z.mortality_count)||0),0),0,' قطعه'),'']])}</div><div class="compare">این گزارش از اولین تا آخرین رکورد واقعی همین گله ساخته شده و هیچ هفته‌ای خارج از سوابق گله به نمودار اضافه نمی‌شود.</div><div class="chart"><canvas id="chart1"></canvas></div>${t==='broiler'?'<div class="chart"><canvas id="chart2"></canvas></div>':''}<div class="table-wrap"><table><thead><tr><th>هفته</th><th>سن</th><th>وزن</th><th>CV</th><th>یکنواختی</th><th>دان</th><th>آب</th><th>تلفات</th>${t==='broiler'?'<th>FCR هفتگی</th><th>FCR تجمعی</th>':''}</tr></thead><tbody>${rows.map((z,j)=>{const q=built[j]||{};return`<tr><td>${F(z.week_number,0)}</td><td>${F(z.age_days,0)}</td><td>${F(z.average_weight_g,1)}</td><td>${F(z.cv_percent,2)}%</td><td>${F(z.uniformity_10_percent,1)}%</td><td>${F(z.feed_total_kg,1)}</td><td>${F(z.water_total_liter,1)}</td><td>${F(z.mortality_count,0)}</td>${t==='broiler'?`<td>${F(q.weeklyFcr??z.fcr,3)}</td><td>${F(q.cumulativeFcr??z.cumulative_fcr,3)}</td>`:''}</tr>`}).join('')}</tbody></table></div>`;const lab=rows.map(z=>'هفته '+N(z.week_number));chart('chart1',lab,[{label:'وزن واقعی',data:rows.map(z=>N(z.average_weight_g))},{label:'استاندارد/مدیریتی وزن',data:rows.map(z=>standard(N(z.age_days),'weight'))}]);if(t==='broiler')chart('chart2',lab,[{label:'FCR تجمعی',data:rows.map((z,j)=>built[j]?.cumulativeFcr??N(z.cumulative_fcr))},{label:'استاندارد/مدیریتی FCR',data:rows.map(z=>standard(N(z.age_days),'fcr'))}])}async function comparison(last,t){const metrics=t==='broiler'?['وزن','FCR هفتگی','FCR تجمعی','CV','یکنواختی ±10','دان','آب','تلفات']:t==='layer'?['وزن','CV','یکنواختی ±10','دان','آب','تولید تخم','وزن تخم','Egg Mass','FCR']:t==='breeder'?['وزن','CV','یکنواختی ±10','دان','آب','تلفات','تولید','باروری','هچ‌پذیری']:['وزن','CV','یکنواختی ±10','دان','آب','تلفات'];$('root').innerHTML=`<h2>گزارش مقایسه‌ای</h2><div class="notice">در این بخش عملکرد گله در برابر مرجع رسمی یا مدیریتی همان دسته، ژنتیک، سویه و سن نمایش داده می‌شود. برای شاخصی که مرجع معتبر ندارد، «بدون مرجع» نمایش داده می‌شود؛ عدد ساختگی تولید نمی‌شود.</div><div class="table-wrap"><table><thead><tr><th>شاخص</th><th>واقعی</th><th>مرجع</th><th>منبع</th><th>اختلاف</th><th>وضعیت</th></tr></thead><tbody>${await rowsForComparison(last,t,metrics)}</tbody></table></div>`}async function rowsForComparison(r,t,metrics){const x=built.at(-1)||{},out=[];for(const m of metrics){let actual=null,metric=null,unit='';if(m==='وزن'){actual=N(r.average_weight_g);metric='weight';unit=' گرم'}else if(m==='FCR هفتگی'){actual=N(x.weeklyFcr??r.fcr);metric='fcr'}else if(m==='FCR تجمعی'){actual=N(x.cumulativeFcr??r.cumulative_fcr);metric='cumulative_fcr'}else if(m==='CV'){actual=N(r.cv_percent)}else if(m==='یکنواختی ±10'){actual=N(r.uniformity_10_percent)}else if(m==='دان'){actual=N(r.feed_total_kg);unit=' kg'}else if(m==='آب'){actual=N(r.water_total_liter);unit=' L'}else if(m==='تلفات'){actual=N(r.mortality_count)}else if(m==='تولید تخم')actual=value(r,['hen_day_production','henDayProduction','egg_production_percent']);else if(m==='وزن تخم')actual=value(r,['egg_weight_g','eggWeightG']);else if(m==='Egg Mass')actual=value(r,['egg_mass_g','eggMassG']);else if(m==='FCR')actual=value(r,['egg_mass_fcr','eggMassFcr','fcr']);else if(m==='تولید')actual=value(r,['hen_day_production','henDayProduction']);else if(m==='باروری')actual=value(r,['fertility_percent','fertilityPercent']);else if(m==='هچ‌پذیری')actual=value(r,['hatchability_percent','hatchabilityPercent']);const rr=metric?await ref(N(r.age_days),metric):null;const refv=rr?.value??null;const d=actual!=null&&refv!=null?actual-refv:null;const bad=d!=null&&((metric==='fcr'||m==='FCR')?d>0:d<0);out.push(`<tr><td>${m}</td><td>${F(actual,metric?.includes('fcr')||m==='FCR'?3:1)}${unit}</td><td>${F(refv,metric?.includes('fcr')||m==='FCR'?3:1)}${unit}</td><td>${rr?rr.source==='official'?'رسمی':'مدیریتی':'بدون مرجع'}</td><td>${d==null?'—':F(d,metric?.includes('fcr')||m==='FCR'?3:1)+unit}</td><td>${d==null?'بدون ارزیابی':bad?'نیازمند بررسی':'مطلوب/قابل قبول'}</td></tr>`)}return out.join('')}async function init(){const {data:flocks,error}=await supabaseClient.from('flocks').select('*').order('created_at',{ascending:false});if(error){$('root').innerHTML=`<div class="notice danger">${error.message}</div>`;return}const params=new URLSearchParams(location.search),wanted=params.get('flock_id')||localStorage.getItem('active_flock_id');flock=(flocks||[]).find(x=>String(x.id)===String(wanted))||(flocks||[])[0]||null;if(!flock){$('root').innerHTML='<div class="notice">گله‌ای پیدا نشد.</div>';return}const {data,error:e}=await supabaseClient.from('weekly_records').select('*').eq('flock_id',flock.id).order('week_number',{ascending:true});if(e){$('root').innerHTML=`<div class="notice danger">${e.message}</div>`;return}rows=data||[];const eng=ENG[type()],std=(age)=>window.resolvePoultryStandard?window.resolvePoultryStandard({productionType:flock.production_type,genetics:flock.genetics,strain:flock.strain,variant:flock.variant,ageDays:age}):null;built=eng?.build?eng.build(flock,rows,std):rows;$('week').innerHTML=rows.map(r=>`<option value="${N(r.week_number)}">هفته ${F(r.week_number,0)} — ${F(r.age_days,0)} روز</option>`).join('')||'<option>—</option>';const savedWeek=params.get('week');if(savedWeek)$('week').value=savedWeek;await render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;await render()});$('week').onchange=render;$('recalc').onclick=render;await init()})()</script></body></html>
