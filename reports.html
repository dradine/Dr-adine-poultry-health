<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش هفتگی</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="standard-data.js"></script><script src="standards.js"></script><script src="broiler-fcr-engine-v11.js?v=11.3"></script></head><body><main id="app" style="max-width:1200px;margin:24px auto;padding:16px"><div class="card" style="text-align:center">در حال بارگذاری گزارش هفتگی…</div></main><script>
'use strict';
(async function(){
 const app=document.getElementById('app'), qs=new URLSearchParams(location.search);
 const db=window.supabaseClient;
 const norm=v=>{if(v==null||v==='')return null;let s=String(v).replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776)).replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632)).replace(/[٬,]/g,'').replace('٫','.');const n=Number(s);return Number.isFinite(n)?n:null};
 const fmt=(v,d=1)=>norm(v)==null?'—':norm(v).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d});
 const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const getId=()=>qs.get('flockId')||qs.get('flock_id')||qs.get('id')||(()=>{try{return JSON.parse(localStorage.getItem('adine_poultry_current_selection')||'{}').flockId||null}catch(e){return null}})();
 try{
   if(!db)throw Error('اتصال Supabase در دسترس نیست.');
   const flockId=getId(); if(!flockId)throw Error('شناسه گله دریافت نشد. از صفحه ثبت هفتگی با همان گله وارد گزارش شوید.');
   const fr=await db.from('flocks').select('*').eq('id',flockId).maybeSingle(); if(fr.error)throw fr.error; if(!fr.data)throw Error('گله انتخاب‌شده پیدا نشد.');
   const flock=fr.data;
   const wr=await db.from('weekly_records').select('*').eq('flock_id',flockId).order('week_number',{ascending:true}); if(wr.error)throw wr.error; const rows=wr.data||[]; if(!rows.length)throw Error('برای این گله هنوز گزارش هفتگی ثبت نشده است.');
   let wanted=norm(qs.get('week')||qs.get('weekNumber')), index=wanted==null?rows.length-1:rows.findIndex(r=>norm(r.week_number)===wanted); if(index<0)index=0;
   const r=rows[index];
   const pick=(...ks)=>{for(const k of ks){const x=norm(r[k]);if(x!==null)return x}return null};
   const name=flock.flock_name||flock.name||flock.flock_code||'—';
   const weight=pick('average_weight_g','avg_weight_g','weight_g'), cv=pick('cv_percent','cv'), u10=pick('uniformity_10_percent','uniformity_10'),u15=pick('uniformity_15_percent','uniformity_15'),feed=pick('feed_total_kg','feed_kg','feed_total'),water=pick('water_total_liter','water_liter','water_total'),mort=pick('mortality_count','mortality_week'),fcr=pick('fcr_weekly','weekly_fcr','fcr'),cum=pick('fcr_cumulative','cumulative_fcr','cum_fcr');
   const prev=index>0?norm(rows[index-1].average_weight_g):null; const gain=weight!=null&&prev!=null?weight-prev:null;
   const ratio=feed&&water?water/feed:null;
   app.innerHTML=`<header class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h1 style="margin:0">گزارش عملکرد گله</h1><p style="margin:7px 0 0;color:#687770">گزارش هفتگی — هفته ${fmt(r.week_number,0)}</p></div><div><button class="btn btn-secondary" onclick="location.href='weekly.html?flockId=${encodeURIComponent(flock.id)}'">بازگشت به ثبت هفتگی</button><button class="btn btn-primary" onclick="window.print()">چاپ</button></div></div></header><section class="card"><div class="metrics-grid">${card('گله',esc(name))}${card('نوع پرورش',esc(flock.production_type||'—'))}${card('ژنتیک',esc(flock.genetics||'—'))}${card('سویه',esc(flock.strain||'—'))}</div></section><section class="card"><h2>گزارش هفتگی — هفته ${fmt(r.week_number,0)}</h2><div class="metrics-grid">${card('سن',fmt(r.age_days,0)+' روز')}${card('میانگین وزن',fmt(weight)+' گرم')}${card('افزایش وزن هفتگی',gain==null?'—':fmt(gain)+' گرم')}${card('CV',cv==null?'—':fmt(cv,2)+' %')}${card('یکنواختی ±10',u10==null?'—':fmt(u10,1)+' %')}${card('یکنواختی ±15',u15==null?'—':fmt(u15,1)+' %')}${card('دان',feed==null?'—':fmt(feed,1)+' kg')}${card('آب',water==null?'—':fmt(water,1)+' L')}${card('تلفات',mort==null?'—':fmt(mort,0)+' قطعه')}${card('FCR هفتگی',fcr==null?'—':fmt(fcr,3))}${card('FCR تجمعی',cum==null?'—':fmt(cum,3))}${card('نسبت آب به دان',ratio==null?'—':fmt(ratio*100,1)+' %','آب: '+fmt(ratio,2)+' برابر دان')}</div></section>`;
 }catch(e){console.error('Weekly report load:',e);app.innerHTML=`<section class="card"><div style="padding:18px;color:#922d29;background:#fff4f4;border-radius:10px"><b>گزارش بارگذاری نشد.</b><br>${esc(e.message||e)}<br><button class="btn btn-secondary" onclick="history.back()">بازگشت</button></div></section>`}
 function card(label,value,ref=''){return`<div class="metric-card"><div class="metric-label">${label}</div><div class="metric-value">${value}</div>${ref?`<div style="font-size:11px;color:#687770;margin-top:5px">${ref}</div>`:''}</div>`}
})();
</script><style>.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric-card{padding:15px;background:#f7f9fb;border:1px solid #e5eaf0;border-radius:12px}.metric-label{font-size:12px;color:#667085}.metric-value{font-size:19px;font-weight:800;margin-top:7px;word-break:break-word}.btn{border:0;border-radius:9px;padding:10px 14px;margin:2px;cursor:pointer;font-family:inherit}.btn-primary{background:#1d3557;color:#fff}.btn-secondary{background:#eef2f6;color:#243447}@media(max-width:800px){.metrics-grid{grid-template-columns:repeat(2,1fr)}}@media print{button{display:none!important}}</style></body></html>
