
<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#123b2a"
    >

    <title>
        بازیابی رمز عبور | آدینه
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="auth-page">

    <main class="auth-wrapper">

        <section class="auth-card">

            <div class="auth-logo">

                <img
                    src="logo.png"
                    alt="مرکز تخصصی سلامت طیور آدینه"
                >

            </div>

            <h1>
                بازیابی رمز عبور
            </h1>

            <p class="auth-subtitle">
                ایمیل حساب کاربری خود را وارد کنید
            </p>

            <div
                id="message"
                class="message hidden"
            ></div>

            <form id="resetForm">

                <div class="form-group">

                    <label for="email">
                        ایمیل
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        placeholder="ایمیل حساب کاربری"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="resetButton"
                    class="primary-button"
                >
                    ارسال لینک بازیابی
                </button>

            </form>

            <div class="auth-links">

                <a href="login.html">
                    بازگشت به ورود
                </a>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="reset-password.js?v=20260819"></script>

</body>

</html>
