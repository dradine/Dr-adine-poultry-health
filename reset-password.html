<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123b2a">
<meta name="description" content="بازیابی رمز عبور - مرکز تخصصی سلامت طیور آدینه">
<title>بازیابی رمز عبور | سامانه مدیریت و پایش فارم‌های طیور</title>
<link rel="stylesheet" href="style.css?v=20260924.20">
<link rel="stylesheet" href="auth-compact.css?v=20260924.20">
</head>
<body class="auth-page">
<main class="auth-wrapper">
<section class="auth-card" aria-labelledby="resetTitle">
<div class="auth-logo"><img src="IMG_4309.png" alt="لوگوی مرکز تخصصی سلامت طیور آدینه"></div>
<h1 id="resetTitle">بازیابی رمز عبور</h1>
<p class="auth-subtitle">ایمیل حساب کاربری خود را وارد کنید</p>
<div id="message" class="message hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>
<form id="resetForm" novalidate autocomplete="on">
<div class="form-group"><label for="email">ایمیل</label><input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="ایمیل حساب کاربری" dir="ltr" required></div>
<button type="submit" id="resetButton" class="primary-button"><span id="resetButtonText">ارسال لینک بازیابی</span></button>
</form>
<div class="auth-links"><a href="login.html">بازگشت به ورود</a><span aria-hidden="true">|</span><a href="register.html">ثبت‌نام</a></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="reset-password.js?v=20260924.20"></script>
</body>
</html>
