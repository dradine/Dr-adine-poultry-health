<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123b2a">
<meta name="description" content="بازیابی رمز عبور - مرکز تخصصی سلامت طیور آدینه">
<title>بازیابی رمز عبور | سامانه مدیریت و پایش فارم‌های طیور</title>
<link rel="stylesheet" href="style.css?v=20260924.20">
<link rel="stylesheet" href="auth-compact.css?v=20260924.20">
<style>
.auth-page .auth-logo img{
  border-radius:18px!important;
  overflow:hidden!important;
  clip-path:inset(0 round 18px)!important;
}
@media(max-width:480px){
  .auth-page .auth-logo img{
    border-radius:15px!important;
    clip-path:inset(0 round 15px)!important;
  }
}
</style>
<style>
.auth-page .recovery-modal{position:fixed!important;inset:0!important;z-index:9999!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:20px!important;background:rgba(8,28,20,.48)!important;backdrop-filter:blur(3px)!important}
.auth-page .recovery-modal[hidden]{display:none!important}
.auth-page .recovery-modal-card{width:min(420px,100%)!important;box-sizing:border-box!important;padding:24px 22px 20px!important;border:1px solid #c8e1d3!important;border-radius:18px!important;background:#fff!important;box-shadow:0 22px 60px rgba(0,0,0,.22)!important;text-align:center!important;animation:recoveryModalIn .2s ease-out!important}
.auth-page .recovery-modal-icon{width:52px!important;height:52px!important;margin:0 auto 12px!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;background:#1f6045!important;color:#fff!important;font-size:27px!important;font-weight:900!important;box-shadow:0 7px 18px rgba(31,96,69,.18)!important}
.auth-page .recovery-modal-title{margin:0 0 8px!important;color:#163d2c!important;font-size:18px!important;font-weight:900!important}
.auth-page .recovery-modal-text{margin:0 auto 18px!important;max-width:340px!important;color:#52665d!important;font-size:12.5px!important;font-weight:600!important;line-height:2!important}
.auth-page .recovery-modal-button{width:100%!important;min-height:43px!important;border:0!important;border-radius:11px!important;background:#1f6045!important;color:#fff!important;font-size:13px!important;font-weight:900!important;cursor:pointer!important;box-shadow:0 7px 18px rgba(31,96,69,.18)!important}
.auth-page .recovery-modal-button:hover{background:#174c37!important}
@keyframes recoveryModalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){.auth-page .recovery-modal{padding:15px!important}.auth-page .recovery-modal-card{padding:22px 17px 17px!important;border-radius:16px!important}.auth-page .recovery-modal-title{font-size:17px!important}}
</style>
</head>
<body class="auth-page">
<main class="auth-wrapper">
<section class="auth-card" aria-labelledby="resetTitle">
<div class="auth-logo"><img src="IMG_4309.png" alt="لوگوی مرکز تخصصی سلامت طیور آدینه"></div>
<h1 id="resetTitle">بازیابی رمز عبور</h1>
<p class="auth-subtitle">ایمیل حساب کاربری خود را وارد کنید</p>
<div id="message" class="message hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>
<form id="resetForm" novalidate autocomplete="on">
<div class="form-group"><label for="email">ایمیل</label><input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="ایمیل حساب کاربری" dir="ltr" required></div>
<button type="submit" id="resetButton" class="primary-button"><span id="resetButtonText">ارسال لینک بازیابی</span></button>
</form>
<div class="auth-links"><a href="login.html">بازگشت به ورود</a><span aria-hidden="true">|</span><a href="register.html">ثبت‌نام</a></div>
</section>
</main>

<div id="recoverySuccessModal" class="recovery-modal" hidden role="dialog" aria-modal="true" aria-labelledby="recoverySuccessTitle">
  <div class="recovery-modal-card">
    <div class="recovery-modal-icon" aria-hidden="true">✓</div>
    <h2 id="recoverySuccessTitle" class="recovery-modal-title">لینک بازیابی ارسال شد</h2>
    <p class="recovery-modal-text">اگر این ایمیل در سامانه ثبت شده باشد، لینک بازیابی رمز عبور برای شما ارسال شد. صندوق ورودی و پوشه هرزنامه را بررسی کنید.</p>
    <button type="button" id="recoverySuccessOk" class="recovery-modal-button">تأیید</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="reset-password.js?v=20260924.20"></script>
</body>
</html>
