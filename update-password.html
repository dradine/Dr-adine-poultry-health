<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#123b2a"
    >

    <title>
        تغییر رمز عبور | آدینه
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="auth-page">

    <main class="auth-wrapper">

        <section class="auth-card">

            <div class="auth-logo">

                <img
                    src="logo.png"
                    alt="مرکز تخصصی سلامت طیور آدینه"
                >

            </div>

            <h1>
                تعیین رمز عبور جدید
            </h1>

            <div
                id="message"
                class="message hidden"
            ></div>

            <form id="updatePasswordForm">

                <div class="form-group">

                    <label for="password">
                        رمز عبور جدید
                    </label>

                    <input
                        id="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="حداقل ۸ کاراکتر"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        تکرار رمز عبور
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="تکرار رمز عبور"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="updateButton"
                    class="primary-button"
                >
                    ذخیره رمز جدید
                </button>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="update-password.js"></script>

</body>

</html>
