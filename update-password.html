<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123b2a">
<meta name="description" content="تعیین رمز عبور جدید | مرکز تخصصی سلامت طیور آدینه">
<title>تعیین رمز عبور جدید | آدینه</title>
<link rel="stylesheet" href="style.css">
<style>
.auth-page.auth-update-page{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;background:linear-gradient(145deg,#f4f7f5 0%,#eaf1ed 100%);}
.auth-update-page .auth-wrapper{width:100%;max-width:440px;margin:0;}
.auth-update-page .auth-card{box-sizing:border-box;width:100%;padding:28px 26px 24px;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 18px 50px rgba(18,59,42,.13);border:1px solid rgba(18,59,42,.09);}
.auth-update-page .auth-logo{width:92px;height:92px;margin:0 auto 17px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(18,59,42,.12);display:flex;align-items:center;justify-content:center;}
.auth-update-page .auth-logo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:22px;clip-path:inset(0 round 22px);}
.auth-update-page h1{margin:0;text-align:center;color:#173f2e;font-size:25px;line-height:1.5;font-weight:800;}
.auth-update-page .auth-subtitle{margin:6px 0 20px;text-align:center;color:#66756e;font-size:14px;line-height:1.8;}
.auth-update-page .form-group{margin-bottom:15px;}
.auth-update-page label{display:block;margin:0 0 7px;color:#29483c;font-size:14px;font-weight:700;}
.auth-update-page .password-field{position:relative;display:flex;align-items:center;}
.auth-update-page input{box-sizing:border-box;width:100%;min-height:50px;padding:0 14px;border:1px solid #d5dfda;border-radius:13px;background:#fff;color:#173f2e;font-size:16px!important;outline:none;transition:border-color .2s,box-shadow .2s;}
.auth-update-page .password-field input{padding-left:72px;}
.auth-update-page input:focus{border-color:#2f7656;box-shadow:0 0 0 3px rgba(47,118,86,.11);}
.auth-update-page .password-toggle{position:absolute;left:8px;min-width:55px;border:0;background:transparent;color:#2f7656;font-size:12px;font-weight:700;cursor:pointer;padding:8px;z-index:2;}
.auth-update-page .primary-button{width:100%;min-height:51px;margin-top:5px;border:0;border-radius:13px;background:#245d43;color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(36,93,67,.18);}
.auth-update-page .primary-button:hover{background:#1d5139;}
.auth-update-page .primary-button:disabled{opacity:.65;cursor:wait;}
.auth-update-page .message{margin:0 0 15px;padding:11px 13px;border-radius:12px;text-align:center;font-size:13px;line-height:1.8;}
.auth-update-page .message.hidden{display:none;}
.auth-update-page .message.info{background:#eef5f1;color:#315746;}
.auth-update-page .message.error{background:#fff1f0;color:#9b3b34;}
.auth-update-page .message.success{background:#edf8f1;color:#277044;}
.auth-update-page .security-note{margin-top:17px;text-align:center;color:#87948f;font-size:11px;line-height:1.8;}
@media(max-width:480px){.auth-page.auth-update-page{padding:16px 12px;}.auth-update-page .auth-card{padding:23px 18px 19px;border-radius:19px;}.auth-update-page .auth-logo{width:78px;height:78px;border-radius:18px;margin-bottom:13px;}.auth-update-page .auth-logo img{border-radius:18px;clip-path:inset(0 round 18px);}.auth-update-page h1{font-size:22px;}.auth-update-page .auth-subtitle{margin-bottom:16px;}}
</style>
</head>
<body class="auth-page auth-update-page">
<main class="auth-wrapper">
<section class="auth-card" aria-labelledby="updatePasswordTitle">
<div class="auth-logo"><img src="IMG_4309.png" alt="لوگوی مرکز تخصصی سلامت طیور آدینه"></div>
<h1 id="updatePasswordTitle">تعیین رمز عبور جدید</h1>
<p class="auth-subtitle">مرکز تخصصی سلامت طیور آدینه</p>
<div id="message" class="message hidden" role="status" aria-live="polite"></div>
<form id="updatePasswordForm" novalidate>
<div class="form-group"><label for="password">رمز عبور جدید</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="حداقل ۸ کاراکتر" dir="ltr" required><button type="button" id="togglePassword" class="password-toggle" aria-label="نمایش رمز عبور">نمایش</button></div></div>
<div class="form-group"><label for="confirmPassword">تکرار رمز عبور</label><div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="تکرار رمز عبور" dir="ltr" required><button type="button" id="toggleConfirmPassword" class="password-toggle" aria-label="نمایش تکرار رمز عبور">نمایش</button></div></div>
<button type="submit" id="updateButton" class="primary-button">ذخیره رمز جدید</button>
</form>
<p class="security-note">پس از تغییر موفق رمز عبور، به صفحه ورود منتقل می‌شوید.</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="update-password.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  function bindToggle(buttonId,inputId){
    const button=document.getElementById(buttonId),input=document.getElementById(inputId);
    if(!button||!input)return;
    button.addEventListener('click',function(){
      const visible=input.type==='text';
      input.type=visible?'password':'text';
      button.textContent=visible?'نمایش':'پنهان';
      button.setAttribute('aria-label',visible?'نمایش رمز عبور':'پنهان کردن رمز عبور');
    });
  }
  bindToggle('togglePassword','password');
  bindToggle('toggleConfirmPassword','confirmPassword');
});
</script>
</body>
</html>
