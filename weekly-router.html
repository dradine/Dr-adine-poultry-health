<!doctype html><html lang="fa" dir="rtl"><head><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://vzcczkavlopznljnnehp.supabase.co" crossorigin><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پایش هفتگی گله</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#f3f6f4}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="supabase-config.js"></script><script defer src="offline-core.js?v=20261105.2"></script><script defer src="auth.js"></script><script defer src="app-core.js"></script></head><body><div id="routeLoading" role="status" style="position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f3f6f4;color:#173f35;font:700 15px/2 Tahoma,Arial,sans-serif">در حال آماده‌سازی پایش هفتگی و دریافت اطلاعات گله…</div><iframe id="frame" title="پایش هفتگی"></iframe><script>

document.addEventListener('DOMContentLoaded',()=>{(async function(){
  const frame=document.getElementById('frame');
  frame.addEventListener('load',()=>{if(frame.getAttribute('src'))document.getElementById('routeLoading')?.remove();});
  const q=new URLSearchParams(location.search);
  const norm=v=>String(v||'').normalize('NFKC').trim().toLowerCase();
  function routeUnavailable(){
    document.body.innerHTML='<main dir="rtl" style="font:15px/2 Tahoma,Arial,sans-serif;padding:24px;text-align:center;color:#173f35"><h2>نوع گله مشخص نشد</h2><p>برای جلوگیری از باز شدن فرم اشتباه، نوع گله از اطلاعات ذخیره‌شده قابل تشخیص نیست. اتصال اینترنت را برقرار کنید و دوباره تلاش کنید.</p><button id="retryRoute" type="button" style="padding:10px 18px;border:0;border-radius:10px;background:#1f6b45;color:#fff;font:inherit">تلاش مجدد</button></main>';
    document.getElementById('retryRoute').addEventListener('click',()=>location.reload());
  }
  async function cachedType(id){
    try{
      const session=await window.AdineAuth?.getSession?.();
      const userId=session?.user?.id;
      if(!userId||!window.AdineOffline?.getRows)return '';
      const rows=await window.AdineOffline.getRows('flocks',String(userId));
      const flock=rows.find(row=>String(row.id)===String(id));
      return norm(flock?.production_type);
    }catch(e){console.warn('Weekly router cached flock lookup:',e);return '';}
  }
  async function flockType(id){
    const local=await cachedType(id);
    if(local)return local;
    try{
      const request=supabaseClient.from('flocks').select('production_type').eq('id',id).maybeSingle();
      const r=window.AdineOffline?.withTimeout?await window.AdineOffline.withTimeout(request,3500,'ROUTER_FLOCK'):await request;
      if(!r.error&&r.data?.production_type)return norm(r.data.production_type);
    }catch(e){console.warn('Flock type lookup:',e);}
    return '';
  }
  try{
    const selection=(typeof getCurrentSelection==='function'?getCurrentSelection():{})||{};
    const id=q.get('flock_id')||q.get('flockId')||selection.flockId||selection.flock_id||selection.id||'';
    if(!id){const params=new URLSearchParams(location.search);params.set('v','20261105.2');frame.src='weekly-core.html?'+params.toString();return;}
    const type=await flockType(id);
    if(!type){routeUnavailable();return;}
    const params=new URLSearchParams(location.search);params.set('v','20261105.2');frame.src=(type==='layer'||type.includes('تخم'))?'layer-weekly-core.html?'+params.toString():'weekly-core.html?'+params.toString();
  }catch(e){console.error('Weekly router:',e);routeUnavailable();}
})();},{once:true});;
</script></body></html>
