<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت روزانه و هفتگی | مرکز تخصصی سلامت طیور آدینه</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;color:#172033}body{padding:0 0 76px}.weekly-entry-shell{width:min(1400px,94%);margin:20px auto 40px}.entry-tabs{display:flex;gap:8px;background:#fff;border-radius:16px;padding:8px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #e5eaf0}.entry-tab{flex:1;border:0;background:transparent;color:#667085;font:700 15px Tahoma,Arial,sans-serif;border-radius:11px;padding:13px 12px;cursor:pointer}.entry-tab.active{background:#1d3557;color:#fff}.entry-panel{display:none}.entry-panel.active{display:block}.daily-empty{background:#fff;border-radius:16px;padding:48px 22px;min-height:260px;box-shadow:0 4px 18px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;text-align:center;color:#667085}.daily-empty strong{display:block;color:#172033;font-size:20px;margin-bottom:10px}.daily-empty p{margin:0;line-height:1.9}.weekly-frame{width:100%;height:calc(100vh - 135px);min-height:760px;border:0;display:block;background:#f5f7fa;border-radius:16px}.bottom-navigation{position:fixed;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #e5eaf0;display:grid;grid-template-columns:repeat(4,1fr);z-index:10000}.bottom-nav-item{border:0;background:transparent;font-family:inherit;color:#667085;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.bottom-nav-item.active{color:#1d3557}.bottom-nav-icon{width:24px;height:24px}.bottom-nav-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}@media(max-width:600px){.weekly-entry-shell{width:94%;margin-top:12px}.entry-tabs{padding:6px}.entry-tab{font-size:13px;padding:12px 8px}.weekly-frame{height:calc(100vh - 120px);min-height:720px}}
</style></head>
<body>
<div class="weekly-entry-shell"><nav class="entry-tabs" role="tablist" aria-label="نوع پایش"><button id="weeklyTab" class="entry-tab active" type="button" role="tab" aria-selected="true">پایش هفتگی گله</button><button id="dailyTab" class="entry-tab" type="button" role="tab" aria-selected="false">پایش روزانه گله</button></nav><section id="weeklyPanel" class="entry-panel active" role="tabpanel"><iframe id="weeklyFrame" class="weekly-frame" src="weekly-core.html" title="پایش هفتگی گله"></iframe></section><section id="dailyPanel" class="entry-panel" role="tabpanel" hidden><div class="daily-empty"><div><strong>پایش روزانه گله</strong><p>این بخش فعلاً خالی است و در مرحله بعد طراحی خواهد شد.</p></div></div></section></div>
<nav class="bottom-navigation" aria-label="ناوبری اصلی"><button type="button" class="bottom-nav-item" onclick="location.href='Dashboard.html'"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6"></path></svg></span><span>خانه</span></button><button type="button" class="bottom-nav-item" onclick="location.href='flocks.html'"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"></path><path d="M7 21v-7h10v7"></path><path d="M9 10h6"></path><path d="M12 7v3"></path></svg></span><span>فارم‌ها</span></button><button type="button" class="bottom-nav-item active" onclick="showPanel('weekly')"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h17"></path><path d="M6.5 15l4-4 3 2 5-6"></path><circle cx="6.5" cy="15" r="1"></circle><circle cx="10.5" cy="11" r="1"></circle><circle cx="13.5" cy="13" r="1"></circle><circle cx="18.5" cy="7" r="1"></circle></svg></span><span>ثبت هفتگی</span></button><button type="button" class="bottom-nav-item" onclick="location.href='reports.html'"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"></path><path d="M15 3v5h5"></path><path d="M9 12h6"></path><path d="M9 16h6"></path><path d="M9 8h2"></path></svg></span><span>گزارش‌ها</span></button></nav>
<script>const weeklyTab=document.getElementById('weeklyTab'),dailyTab=document.getElementById('dailyTab'),weeklyPanel=document.getElementById('weeklyPanel'),dailyPanel=document.getElementById('dailyPanel');function showPanel(p){const w=p==='weekly';weeklyTab.classList.toggle('active',w);dailyTab.classList.toggle('active',!w);weeklyTab.setAttribute('aria-selected',w);dailyTab.setAttribute('aria-selected',!w);weeklyPanel.classList.toggle('active',w);dailyPanel.classList.toggle('active',!w);weeklyPanel.hidden=!w;dailyPanel.hidden=w}weeklyTab.onclick=()=>showPanel('weekly');dailyTab.onclick=()=>showPanel('daily');document.getElementById('weeklyFrame').addEventListener('load',function(){try{const n=this.contentDocument.getElementById('bottomNavigation');if(n)n.style.display='none';this.contentDocument.body.style.paddingBottom='0'}catch(e){}});</script>
<script src="shared-jalali-calendar-v1.js"></script>
</body></html>
