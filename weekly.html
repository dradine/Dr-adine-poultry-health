<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;color:#172033}body{padding:0 0 76px}.weekly-entry-shell{width:min(1400px,94%);margin:20px auto 40px}.entry-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}.entry-tab{min-height:72px;border:1px solid #e5eaf0;background:#fff;color:#667085;font:800 16px Tahoma,Arial,sans-serif;border-radius:16px;padding:16px 12px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.06);transition:.15s ease}.entry-tab:hover{border-color:#cbd5e1;transform:translateY(-1px)}.entry-tab.active{background:#1d3557;border-color:#1d3557;color:#fff;box-shadow:0 6px 20px rgba(29,53,87,.18)}.entry-panel{display:none}.entry-panel.active{display:block}.daily-frame{width:100%;height:calc(100vh - 135px);min-height:760px;border:0;display:block;background:#f5f7fa;border-radius:16px}.weekly-frame{width:100%;height:calc(100vh - 135px);min-height:760px;border:0;display:block;background:#f5f7fa;border-radius:16px}.bottom-navigation{position:fixed;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #e5eaf0;display:grid;grid-template-columns:repeat(4,1fr);z-index:10000}.bottom-nav-item{border:0;background:transparent;font-family:inherit;color:#667085;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.bottom-nav-item.active{color:#1d3557}.bottom-nav-icon{width:24px;height:24px}.bottom-nav-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:600px){.weekly-entry-shell{width:94%;margin-top:12px}.entry-tabs{gap:10px}.entry-tab{min-height:64px;font-size:14px;padding:13px 8px}.daily-frame,.weekly-frame{height:calc(100vh - 120px);min-height:720px}}
</style>
<script src="weekly-completion-restore-v1.js"></script>

<body>
<div class="weekly-entry-shell">

<button id="weeklyTab" class="entry-tab" type="button" role="tab" aria-selected="false" aria-controls="weeklyPanel">پایش هفتگی گله</button><button id="monthlyTab" class="entry-tab" type="button" role="tab" aria-selected="false" aria-controls="monthlyPanel">پایش ماهانه گله</button>
</nav>
<section id="dailyPanel" class="entry-panel active" role="tabpanel"><iframe id="dailyFrame" class="daily-frame" src="daily-router.html?v=20260924-layer-router-v1" title="پایش روزانه گله"></iframe></section>

  <button type="button" data-nav="Dashboard.html" aria-label="خانه" onclick="window.location.href='Dashboard.html'"><span data-icon="home" aria-hidden="true"></span><small>خانه</small></button>
  <button type="button" data-nav="Farms.html" aria-label="فارم‌ها" onclick="window.location.href='Farms.html'"><span data-icon="farm" aria-hidden="true"></span><small>فارم‌ها</small></button>

  <button type="button" data-nav="reports.html" aria-label="گزارش‌ها" onclick="window.location.href='reports.html'"><span data-icon="report" aria-hidden="true"></span><small>گزارش‌ها</small></button>
</nav>
<script>
const dailyTab=document.getElementById('dailyTab'),weeklyTab=document.getElementById('weeklyTab'),monthlyTab=document.getElementById('monthlyTab'),dailyPanel=document.getElementById('dailyPanel'),weeklyPanel=document.getElementById('weeklyPanel'),monthlyPanel=document.getElementById('monthlyPanel');
function showPanel(p){const d=p==='daily',w=p==='weekly',m=p==='monthly';dailyTab.classList.toggle('active',d);weeklyTab.classList.toggle('active',w);monthlyTab.classList.toggle('active',m);dailyTab.setAttribute('aria-selected',String(d));weeklyTab.setAttribute('aria-selected',String(w));monthlyTab.setAttribute('aria-selected',String(m));dailyPanel.classList.toggle('active',d);weeklyPanel.classList.toggle('active',w);monthlyPanel.classList.toggle('active',m);dailyPanel.hidden=!d;weeklyPanel.hidden=!w;monthlyPanel.hidden=!m;window.scrollTo({top:0,behavior:'smooth'});}
dailyTab.onclick=()=>showPanel('daily');weeklyTab.onclick=()=>showPanel('weekly');monthlyTab.onclick=()=>showPanel('monthly');
function loadDailyCalendar(frame,doc){const existing=doc.getElementById('daily-date-system-loader');if(existing)return;const dateScript=doc.createElement('script');dateScript.id='daily-date-system-loader';dateScript.src='date-system.js';dateScript.onload=()=>{const cal=doc.createElement('script');cal.id='daily-shared-calendar-loader';cal.src='shared-jalali-calendar-v1.js';doc.head.appendChild(cal);};doc.head.appendChild(dateScript);}
function applyDailyDayOneOnly(doc){try{const root=doc.getElementById('dailyRoot');if(!root)return;const status=doc.getElementById('dayStatus');const text=status?String(status.textContent||''):'';const m=text.match(/(?:روز\s*)([۰-۹0-9]+)/);let day=m?Number(m[1].replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776))):null;if(!Number.isFinite(day)){const p=new URLSearchParams(doc.defaultView?.location?.search||'');day=Number(p.get('day'))||null;}const isDay1=day===1;root.classList.toggle('daily-day1-active',isDay1);root.classList.toggle('daily-day2plus',!isDay1);const styleId='daily-day1-parent-enforcement';if(!doc.getElementById(styleId)){const s=doc.createElement('style');s.id=styleId;s.textContent='.daily-day2plus .daily-day1-only-accordion{display:none!important}.daily-day2plus .daily-day1-only-node{display:none!important}';doc.head.appendChild(s)}const headings=[...doc.querySelectorAll('.daily-accordion-head')];headings.forEach(h=>{const t=String(h.textContent||'').replace(/[+−]/g,'').trim();if(t.includes('پر بودن چینه‌دان')||t.includes('مشاهده کیفیت جوجه و مشاهدات مرغدار')){h.classList.add('daily-day1-only-accordion');const p=h.nextElementSibling;if(p&&p.classList.contains('daily-accordion-panel'))p.classList.add('daily-day1-only-accordion')}});const ids=['crop2','crop4','crop8','crop12','crop24','chickObservation'];ids.forEach(id=>{const el=doc.getElementById(id);if(!el)return;const node=el.closest('.form-grid')||el.closest('.group');if(node)node.classList.add('daily-day1-only-node')});const observerKey='dailyDayOneObserverAttached';if(!root.dataset[observerKey]){root.dataset[observerKey]='1';const mo=new MutationObserver(()=>{const s2=doc.getElementById('dayStatus');const tx=String(s2?.textContent||'');const mm=tx.match(/(?:روز\s*)([۰-۹0-9]+)/);let d=mm?Number(mm[1].replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776))):null;if(!Number.isFinite(d))d=Number(new URLSearchParams(doc.defaultView?.location?.search||'').get('day'))||null;const day1=d===1;root.classList.toggle('daily-day1-active',day1);root.classList.toggle('daily-day2plus',!day1)});mo.observe(status||root,{childList:true,subtree:true,characterData:true});}}catch(e){console.warn('Daily day-one enforcement skipped',e)}}
function setupDailyAccordion(frame){try{const doc=frame.contentDocument;if(!doc||!doc.body)return;const form=doc.getElementById('dailyForm');if(!form)return;if(!doc.getElementById('daily-accordion-style')){const s=doc.createElement('style');s.id='daily-accordion-style';s.textContent='.daily-accordion-head{display:flex!important;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;user-select:none;background:#f8fafc;border:1px solid #e5eaf0;border-radius:12px;padding:13px 15px!important;margin:16px 0 0!important;border-bottom:1px solid #e5eaf0!important;transition:.15s ease}.daily-accordion-head:hover{background:#f1f5f9}.daily-accordion-head[aria-expanded="true"]{background:#f1f5f9;border-color:#d6dee8}.daily-accordion-icon{width:28px;height:28px;min-width:28px;border-radius:50%;background:#fff;border:1px solid #d7dde5;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;line-height:1;color:#1d3557}.daily-accordion-icon::before{content:"+"}.daily-accordion-head[aria-expanded="true"] .daily-accordion-icon::before{content:"−"}.daily-accordion-panel{overflow:hidden;padding-top:12px}.daily-accordion-panel[hidden]{display:none!important}';doc.head.appendChild(s)}if(form.dataset.accordionReady!=='1'){form.dataset.accordionReady='1';const headings=[...form.querySelectorAll('.sub')].filter(h=>/^\s*[۱-۷1-7][)）]/.test(h.textContent));headings.forEach((heading,index)=>{heading.textContent=heading.textContent.replace(/^\s*[۱-۷1-7][)）]\s*/,'');heading.classList.add('daily-accordion-head');heading.setAttribute('role','button');heading.setAttribute('tabindex','0');heading.setAttribute('aria-expanded',index===0?'true':'false');const icon=doc.createElement('span');icon.className='daily-accordion-icon';icon.setAttribute('aria-hidden','true');heading.appendChild(icon);const panel=doc.createElement('div');panel.className='daily-accordion-panel';panel.hidden=index!==0;panel.id='dailyAccordionPanel'+(index+1);heading.setAttribute('aria-controls',panel.id);let next=heading.nextSibling;while(next){const candidate=next.nextSibling;if(next.nodeType===1&&next.classList&&next.classList.contains('sub'))break;panel.appendChild(next);next=candidate;}heading.parentNode.insertBefore(panel,heading.nextSibling);const toggle=()=>{const open=heading.getAttribute('aria-expanded')==='true';heading.setAttribute('aria-expanded',String(!open));panel.hidden=open;};heading.addEventListener('click',toggle);heading.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});});}applyDailyDayOneOnly(doc);loadDailyCalendar(frame,doc);}catch(e){console.warn('Daily accordion setup skipped',e)}}
document.getElementById('dailyFrame').addEventListener('load',function(){try{const n=this.contentDocument.getElementById('bottomNavigation');if(n)n.style.display='none';this.contentDocument.body.style.paddingBottom='0';}catch(e){}setupDailyAccordion(this);setTimeout(()=>applyDailyDayOneOnly(this.contentDocument),50);setTimeout(()=>applyDailyDayOneOnly(this.contentDocument),300);setTimeout(()=>applyDailyDayOneOnly(this.contentDocument),1000);});
document.getElementById('monthlyFrame').addEventListener('load',function(){try{const n=this.contentDocument.getElementById('bottomNavigation');if(n)n.style.display='none';this.contentDocument.body.style.paddingBottom='0';}catch(e){}});document.getElementById('weeklyFrame').addEventListener('load',function(){try{const n=this.contentDocument.getElementById('bottomNavigation');if(n)n.style.display='none';this.contentDocument.body.style.paddingBottom='0';}catch(e){}});
</script>
