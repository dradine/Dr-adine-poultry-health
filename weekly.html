<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت روزانه و هفتگی | مرکز تخصصی سلامت طیور آدینه</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;color:#172033}body{padding:0 0 76px}.weekly-entry-shell{width:min(1400px,94%);margin:20px auto 40px}.entry-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}.entry-tab{min-height:72px;border:1px solid #e5eaf0;background:#fff;color:#667085;font:800 16px Tahoma,Arial,sans-serif;border-radius:16px;padding:16px 12px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.06);transition:.15s ease}.entry-tab:hover{border-color:#cbd5e1;transform:translateY(-1px)}.entry-tab.active{background:#1d3557;border-color:#1d3557;color:#fff;box-shadow:0 6px 20px rgba(29,53,87,.18)}.entry-panel{display:none}.entry-panel.active{display:block}.daily-frame{width:100%;height:calc(100vh - 135px);min-height:760px;border:0;display:block;background:#f5f7fa;border-radius:16px}.weekly-frame{width:100%;height:calc(100vh - 135px);min-height:760px;border:0;display:block;background:#f5f7fa;border-radius:16px}.bottom-navigation{position:fixed;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #e5eaf0;display:grid;grid-template-columns:repeat(4,1fr);z-index:10000}.bottom-nav-item{border:0;background:transparent;font-family:inherit;color:#667085;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.bottom-nav-item.active{color:#1d3557}.bottom-nav-icon{width:24px;height:24px}.bottom-nav-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:600px){.weekly-entry-shell{width:94%;margin-top:12px}.entry-tabs{gap:10px}.entry-tab{min-height:64px;font-size:14px;padding:13px 8px}.daily-frame,.weekly-frame{height:calc(100vh - 120px);min-height:720px}}
</style>
<script src="weekly-completion-restore-v1.js"></script>
</head>
<body>
<div class="weekly-entry-shell">
<nav class="entry-tabs" role="tablist" aria-label="نوع پایش">
<button id="dailyTab" class="entry-tab active" type="button" role="tab" aria-selected="true" aria-controls="dailyPanel">پایش روزانه گله</button>
<button id="weeklyTab" class="entry-tab" type="button" role="tab" aria-selected="false" aria-controls="weeklyPanel">پایش هفتگی گله</button>
</nav>
<section id="dailyPanel" class="entry-panel active" role="tabpanel"><iframe id="dailyFrame" class="daily-frame" src="daily-core.html?v=20260915-daily2" title="پایش روزانه گله"></iframe></section>
<section id="weeklyPanel" class="entry-panel" role="tabpanel" hidden><iframe id="weeklyFrame" class="weekly-frame" src="weekly-core.html?v=20260915-tabs3" title="پایش هفتگی گله"></iframe></section>
</div>
<nav class="bottom-navigation" aria-label="ناوبری اصلی"><button type="button" class="bottom-nav-item" onclick="location.href='Dashboard.html'"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6"></path></svg></span><span>خانه</span></button><button type="button" class="bottom-nav-item" onclick="location.href='flocks.html'"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"></path><path d="M7 21v-7h10v7"></path><path d="M9 10h6"></path><path d="M12 7v3"></path></svg></span><span>فارم‌ها</span></button><button type="button" class="bottom-nav-item active" onclick="showPanel('weekly')"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h17"></path><path d="M6.5 15l4-4 3 2 5-6"></path><circle cx="6.5" cy="15" r="1"></circle><circle cx="10.5" cy="11" r="1"></circle><circle cx="13.5" cy="13" r="1"></circle><circle cx="18.5" cy="7" r="1"></circle></svg></span><span>ثبت هفتگی</span></button><button type="button" class="bottom-nav-item" onclick="location.href='reports.html'"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"></path><path d="M15 3v5h5"></path><path d="M9 12h6"></path><path d="M9 16h6"></path><path d="M9 8h2"></path></svg></span><span>گزارش‌ها</span></button></nav>
<script>
const dailyTab=document.getElementById('dailyTab'),weeklyTab=document.getElementById('weeklyTab'),dailyPanel=document.getElementById('dailyPanel'),weeklyPanel=document.getElementById('weeklyPanel');
function showPanel(p){const d=p==='daily';dailyTab.classList.toggle('active',d);weeklyTab.classList.toggle('active',!d);dailyTab.setAttribute('aria-selected',String(d));weeklyTab.setAttribute('aria-selected',String(!d));dailyPanel.classList.toggle('active',d);weeklyPanel.classList.toggle('active',!d);dailyPanel.hidden=!d;weeklyPanel.hidden=d;window.scrollTo({top:0,behavior:'smooth'});}
dailyTab.onclick=()=>showPanel('daily');weeklyTab.onclick=()=>showPanel('weekly');
function faDigits(v){return String(v??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function isoFromDayStatus(doc){const t=doc.getElementById('dayStatus')?.textContent||'';const m=t.match(/\|\s*(\d{4}-\d{2}-\d{2})/);return m?m[1]:'';}
function setupDailyDate(frame,doc){
  try{
    if(!doc||!doc.body)return;
    const ds=frame.contentWindow.AdineDateSystem;if(!ds)return;
    const status=doc.getElementById('dayStatus');
    const query=new URLSearchParams(frame.contentWindow.location.search);
    let iso=query.get('date')||isoFromDayStatus(doc)||'';
    const jalali=iso&&ds.isoToJalali?ds.isoToJalali(iso):'';
    if(!doc.getElementById('dailyDateGroup')){
      const group=doc.createElement('div');group.id='dailyDateGroup';group.className='group';group.style.minWidth='210px';
      group.innerHTML='<label for="dailyDate">تاریخ ثبت پایش</label><input id="dailyDate" class="jalali-input" type="text" inputmode="none" autocomplete="off" placeholder="۱۴۰۵/۰۶/۲۴" readonly><small>همان تقویم شمسی مشترک سامانه استفاده می‌شود.</small>';
      const anchor=doc.getElementById('daySwitch');
      if(anchor&&anchor.parentNode){const grid=doc.createElement('div');grid.className='form-grid';grid.style.marginBottom='14px';grid.appendChild(group);anchor.parentNode.insertBefore(grid,anchor.nextSibling);}
      const input=doc.getElementById('dailyDate');
      input.addEventListener('change',()=>{
        const value=input.value||'';const next=ds.jalaliToISO?.(value);if(!next)return;
        const p=new URLSearchParams(frame.contentWindow.location.search);p.set('date',next);p.delete('day');frame.contentWindow.location.search=p.toString();
      });
    }
    const input=doc.getElementById('dailyDate');if(input&&jalali)input.value=faDigits(jalali);
    if(status&&jalali){const txt=status.textContent||'';const m=txt.match(/روز\s*([۰-۹0-9]+)/);if(m)status.textContent='روز '+faDigits(m[1])+' | '+faDigits(jalali);}
    const flockInfo=doc.getElementById('flockInfo');if(flockInfo&&ds.isoToJalali){[...flockInfo.querySelectorAll('.info')].forEach(card=>{const label=card.querySelector('label'),b=card.querySelector('b');if(label&&b&&label.textContent.trim()==='تاریخ ورود'){const raw=b.textContent.trim();if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){const j=ds.isoToJalali(raw);if(j)b.textContent=faDigits(j)}}});}
  }catch(e){console.warn('Daily Persian date setup skipped',e)}
}
function loadDailyCalendar(frame,doc){
  const existing=doc.getElementById('daily-date-system-loader');if(existing)return;
  const dateScript=doc.createElement('script');dateScript.id='daily-date-system-loader';dateScript.src='date-system.js';dateScript.onload=()=>{const cal=doc.createElement('script');cal.id='daily-shared-calendar-loader';cal.src='shared-jalali-calendar-v1.js';cal.onload=()=>setupDailyDate(frame,doc);doc.head.appendChild(cal);};doc.head.appendChild(dateScript);
}
function setupDailyAccordion(frame){try{const doc=frame.contentDocument;if(!doc||!doc.body)return;const form=doc.getElementById('dailyForm');if(!form)return;
  if(!doc.getElementById('daily-accordion-style')){const s=doc.createElement('style');s.id='daily-accordion-style';s.textContent='.daily-accordion-head{display:flex!important;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;user-select:none;background:#f8fafc;border:1px solid #e5eaf0;border-radius:12px;padding:13px 15px!important;margin:16px 0 0!important;border-bottom:1px solid #e5eaf0!important;transition:.15s ease}.daily-accordion-head:hover{background:#f1f5f9}.daily-accordion-head[aria-expanded="true"]{background:#f1f5f9;border-color:#d6dee8}.daily-accordion-icon{width:28px;height:28px;min-width:28px;border-radius:50%;background:#fff;border:1px solid #d7dde5;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;line-height:1;color:#1d3557}.daily-accordion-icon::before{content:"+"}.daily-accordion-head[aria-expanded="true"] .daily-accordion-icon::before{content:"−"}.daily-accordion-panel{overflow:hidden;padding-top:12px}.daily-accordion-panel[hidden]{display:none!important}';doc.head.appendChild(s)}
  if(form.dataset.accordionReady!=='1'){form.dataset.accordionReady='1';const headings=[...form.querySelectorAll('.sub')].filter(h=>/^\s*[۱-۷1-7][)）]/.test(h.textContent));headings.forEach((heading,index)=>{heading.textContent=heading.textContent.replace(/^\s*[۱-۷1-7][)）]\s*/,'');heading.classList.add('daily-accordion-head');heading.setAttribute('role','button');heading.setAttribute('tabindex','0');heading.setAttribute('aria-expanded',index===0?'true':'false');const icon=doc.createElement('span');icon.className='daily-accordion-icon';icon.setAttribute('aria-hidden','true');heading.appendChild(icon);const panel=doc.createElement('div');panel.className='daily-accordion-panel';panel.hidden=index!==0;panel.id='dailyAccordionPanel'+(index+1);heading.setAttribute('aria-controls',panel.id);let next=heading.nextSibling;while(next){const candidate=next.nextSibling;if(next.nodeType===1&&next.classList&&next.classList.contains('sub'))break;panel.appendChild(next);next=candidate;}heading.parentNode.insertBefore(panel,heading.nextSibling);const toggle=()=>{const open=heading.getAttribute('aria-expanded')==='true';heading.setAttribute('aria-expanded',String(!open));panel.hidden=open;};heading.addEventListener('click',toggle);heading.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});});}
  loadDailyCalendar(frame,doc);setupDailyDate(frame,doc);
}catch(e){console.warn('Daily accordion setup skipped',e)}}
document.getElementById('dailyFrame').addEventListener('load',function(){try{const n=this.contentDocument.getElementById('bottomNavigation');if(n)n.style.display='none';this.contentDocument.body.style.paddingBottom='0';}catch(e){}setupDailyAccordion(this);});
document.getElementById('weeklyFrame').addEventListener('load',function(){try{const n=this.contentDocument.getElementById('bottomNavigation');if(n)n.style.display='none';this.contentDocument.body.style.paddingBottom='0';}catch(e){}});
</script>
<script src="shared-jalali-calendar-v1.js"></script>
</body></html>
